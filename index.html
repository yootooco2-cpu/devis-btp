  /* ---------------- Onglet « Aperçu et impression » ---------------- */
  function rendreApercu() {
    const z = $('#onglet-apercu');
    if (!res) { z.innerHTML = '<div class="carte no-print">Calcul indisponible : ' + esc(erreurCalcul ? erreurCalcul.message : '') + '</div>'; return; }
    const c = res.conformite;
    z.innerHTML = entete('apercu', 'Le devis tel que le client le recevra, en A4') + '<div class="carte no-print"><h2>Aperçu du devis client <span class="aide">A4 portrait · pour un PDF : Imprimer puis « Enregistrer au format PDF »</span></h2>' +
      '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button class="btn primaire" id="btn-imprimer-2"' + (c.conforme ? '' : ' disabled') + '>Imprimer / enregistrer en PDF</button>' +
      '<span class="note" style="margin:0">Numérotation « Page X / Y » et pied de page : Chrome ou Edge récents. Désactivez « En-têtes et pieds de page » dans la fenêtre d\'impression.</span></div>' +
      rendreConformite() + '</div><div class="zone-apercu">' + Doc.rendreDocument(etat.catalogue, etat.devis, res) + '</div>';
    $('#btn-imprimer-2').addEventListener('click', imprimer);
  }

  /* ---------------- Zone d'impression (devis ou facture) ---------------- */
  let impressionFacture = null, minuteurImpression = null;
  function styleDePage(pied) {
    const p = String(pied).replace(/\\/g, '\\\\').replace(/"/g, '\\"').replace(/[\r\n]+/g, ' ');
    return '@page { @bottom-left { content: "' + p + '"; font: 7.5pt sans-serif; color: #555; } }';
  }
  function preparerImpression() {
    const z = $('#impression');
    if (impressionFacture) {
      z.innerHTML = impressionFacture.html;
      $('#style-page').textContent = styleDePage(impressionFacture.pied);
    } else if (res) {
      z.innerHTML = Doc.rendreDocument(etat.catalogue, etat.devis, res);
      $('#style-page').textContent = styleDePage(Doc.piedDePage(etat.catalogue, etat.devis));
    }
  }
  function planifierImpression() { clearTimeout(minuteurImpression); minuteurImpression = setTimeout(() => { if (!impressionFacture) preparerImpression(); }, 250); }
  function imprimer() {
    if (!res || !res.conformite.conforme) { activer('apercu'); return; }
    impressionFacture = null;
    preparerImpression();
    setTimeout(() => window.print(), 50);
  }
  function imprimerHtml(html, libelle) {
    impressionFacture = { html, pied: Doc.piedDePage(etat.catalogue, etat.devis, libelle) };
    preparerImpression();
    setTimeout(() => window.print(), 50);
  }
  window.addEventListener('beforeprint', preparerImpression);
  window.addEventListener('afterprint', () => { impressionFacture = null; planifierImpression(); });

  /* ---------------- Onglet « Facturation » ---------------- */
  function brouillon() {
    const d = etat.devis;
    d.factures = d.factures || [];
    if (!d.facturation) d.facturation = FA.nouveauBrouillon(etat.catalogue, d);
    d.facturation.qtesRealisees = d.facturation.qtesRealisees || {};
    return d.facturation;
  }
  function calculFacture() {
    const br = brouillon();
    try {
      const calc = FA.calculer(etat.catalogue, etat.devis, br);
      return { br, calc, conf: FA.verifierFacture(etat.catalogue, etat.devis, br, calc), verifs: FA.verifierCalculs(etat.catalogue, etat.devis, calc) };
    } catch (e) { return { br, erreur: e }; }
  }
  function prochaineEtape() {
    if (!res) return { type: 'acompte', etape: 0 };
    const st = FA.etatFacturation(etat.devis, res);
    const e = st.etapes.find(x => !x.derniere && !x.facture);
    return e ? { type: 'acompte', etape: e.index } : { type: 'solde', etape: 0 };
  }

  function rendreFactures() {
    const z = $('#onglet-factures');
    if (!res) { z.innerHTML = '<div class="carte">Calcul indisponible.</div>'; return; }
    const br = brouillon();
    const d = etat.devis;
    const P = etat.catalogue.parametres;
    const etapes = res.echeancier.map((e, i) => [String(i), (i + 1) + '. ' + e.libelle + ' (' + M.pourcent(e.part_bp) + ')']).slice(0, -1);
    let h = entete('factures', 'Acomptes et solde, à partir du devis signé') + '<div class="note info">Une facture se prépare à partir du devis <b>signé</b> : choisissez l\'acompte à facturer, ou la facture de solde en fin de chantier. ' +
      'Une facture émise reçoit un numéro définitif (série continue, distincte des devis) et ne peut plus être modifiée : une erreur se corrige par un avoir.</div>';
    h += '<div class="carte"><h2>Suivi de facturation <span class="aide">Devis ' + esc(d.numero || 'sans numéro') + ' · ' + M.euros(res.totalTTC_c) + (res.autoliquidation ? ' HT' : ' TTC') + '</span></h2><div id="fact-suivi"></div></div>';
    h += '<div class="carte"><h2>Facture en préparation</h2><div class="grille large">' +
      F.s('devis.facturation.type', 'Type de facture', [['acompte', 'Facture d\'acompte (étape de l\'échéancier)'], ['solde', 'Facture de solde (travaux réalisés)']], { rr: 'factures' }) +
      (br.type === 'acompte' ? F.s('devis.facturation.etape', 'Étape facturée', etapes, { dt: 'entier', rr: 'factures' }) : '') +
      F.t('devis.facturation.date', 'Date d\'émission', { type: 'date', req: true }) +
      F.t('devis.facturation.delaiJours', 'Délai de paiement (jours, 0 = à réception)', { dt: 'entier', mode: 'numeric' }) +
      F.t('devis.facturation.dateDebut', br.type === 'solde' ? 'Début des travaux' : 'Démarrage prévu', { type: 'date' }) +
      (br.type === 'solde' ? F.t('devis.facturation.dateFin', 'Achèvement des travaux', { type: 'date', req: true }) : '') +
      F.c('devis.facturation.optionDebits', 'Option pour le paiement de la TVA d\'après les débits') +
      '</div>';
    if (br.type === 'solde') {
      h += '<h3>Quantités réellement exécutées <span class="aide" style="font-weight:400">vide = quantité du devis</span></h3><div class="defile" style="max-height:360px"><table class="t"><thead><tr>' +
        '<th scope="col">N°</th><th scope="col">Ouvrage</th><th scope="col" class="num">Qté devis</th><th scope="col">Qté réalisée</th></tr></thead><tbody>' +
        res.valides.map(l => '<tr><td>' + esc(l.numero || '') + '</td><td>' + esc(l.libelle) + '</td><td class="num">' + M.quantite(l.q_m) + ' ' + esc(l.unite) + '</td>' +
          '<td style="width:110px"><input type="text" data-qr="' + esc(l.id) + '" value="' + esc(br.qtesRealisees[l.id] || '') + '" placeholder="' + M.quantite(l.q_m) + '" inputmode="decimal"></td></tr>').join('') +
        '</tbody></table></div>';
    }
    h += '<div id="fact-resume" style="margin-top:12px"></div><div id="fact-conf"></div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="btn primaire" id="btn-emettre">Émettre la facture</button>' +
      '<span class="note" style="margin:0">Le numéro est attribué à l\'émission : ' + esc(FA.numeroFacture(P, br.date)) + '.</span></div></div>';
    h += '<div class="carte no-print"><h2>Aperçu de la facture en préparation</h2><div class="zone-apercu" id="fact-apercu"></div></div>';
    h += '<div class="carte"><h2>Registre de toutes les factures émises <span class="aide">tous devis confondus</span></h2><div id="fact-registre"></div></div>';
    z.innerHTML = h;
    remplirFormulaires(z);
    majVisibilite();
    $('#btn-emettre').addEventListener('click', emettreFacture);
    majFactures();
  }

  function majFactures() {
    if (!$('#fact-suivi')) return;
    const d = etat.devis;
    const st = FA.etatFacturation(d, res);
    const ttcOuHt = res.autoliquidation ? 'HT' : 'TTC';
    const voir = f => '<button class="btn petit" data-voir-facture="' + esc(f.id) + '">Voir / imprimer</button> <button class="btn petit" data-export-facture="' + esc(f.id) + '">JSON</button>';
    let h = '';
    if (M.vide(d.numero) || !res.conformite.conforme) h += '<div class="note erreur">Le devis doit être numéroté et conforme avant toute facturation. <a href="#" data-aller="apercu">Voir les points à corriger</a></div>';
    h += '<table class="t"><thead><tr><th scope="col">Étape</th><th scope="col" class="num">Part</th><th scope="col" class="num">Prévu ' + ttcOuHt + '</th><th scope="col">Facture</th><th scope="col" class="num">Facturé ' + ttcOuHt + '</th><th></th></tr></thead><tbody>';
    st.etapes.forEach(e => {
      if (e.derniere) return;
      h += '<tr><td>' + (e.index + 1) + '. ' + esc(e.libelle) + '</td><td class="num">' + M.pourcent(e.part_bp) + '</td><td class="num">' + M.euros(e.montant_c) + '</td>' +
        (e.facture ? '<td>✓ n° ' + esc(e.facture.numero) + ' du ' + M.dateFr(e.facture.date) + '</td><td class="num">' + M.euros(e.facture.montants.ttc_c) + '</td><td>' + voir(e.facture) + '</td>'
          : '<td><span class="tag">à facturer</span></td><td class="num">—</td><td>' + (st.solde ? '' : '<button class="btn petit" data-preparer="acompte:' + e.index + '">Préparer</button>') + '</td>') + '</tr>';
    });
    const der = st.etapes[st.etapes.length - 1];
    h += '<tr><td>' + (der ? (der.index + 1) + '. ' + esc(der.libelle) : 'Solde') + ' — <b>facture de solde</b></td><td class="num">' + (der ? M.pourcent(der.part_bp) : '') + '</td><td class="num">' + (der ? M.euros(der.montant_c) : '') + '</td>' +
      (st.solde ? '<td>✓ n° ' + esc(st.solde.numero) + ' du ' + M.dateFr(st.solde.date) + '</td><td class="num">' + M.euros(st.solde.montants.ttc_c) + '</td><td>' + voir(st.solde) + '</td>'
        : '<td><span class="tag">en fin de chantier</span></td><td class="num">—</td><td><button class="btn petit" data-preparer="solde:0">Préparer</button></td>') + '</tr>';
    const facture = d.factures.reduce((a, f) => a + f.montants.ttc_c, 0);
    h += '</tbody><tfoot><tr><td colspan="4">Total facturé</td><td class="num">' + M.euros(facture) + '</td><td></td></tr></tfoot></table>';
    $('#fact-suivi').innerHTML = h;

    const r = calculFacture();
    if (r.erreur) { $('#fact-conf').innerHTML = '<div class="note erreur">Calcul impossible : ' + esc(r.erreur.message) + '</div>'; return; }
    const c = r.calc;
    let res2 = '';
    if (c.type === 'acompte' && !c.erreur) res2 = 'Acompte n° ' + c.numeroAcompte + ' : <b>' + M.euros(c.totalTTC_c) + ' ' + ttcOuHt + '</b> (HT ' + M.euros(c.totalHT_c) + ', TVA ' + M.euros(c.totalTVA_c) + ') · ' +
      c.ventilation.map(v => (c.autoliquidation ? 'autoliquidation' : M.pourcent(v.bp)) + ' : ' + M.euros(v.ttc_c)).join(' · ');
    if (c.type === 'solde') res2 = 'Travaux réalisés ' + M.euros(c.totalTravauxTTC_c) + ' − acomptes ' + M.euros(c.acomptesTTC_c) + (c.retenue.active ? ' − retenue de garantie ' + M.euros(c.retenue.montant_c) : '') +
      ' = <b>net à payer ' + M.euros(c.netAPayer_c) + '</b>' + (c.ecarts.length ? ' · ' + c.ecarts.length + ' quantité(s) ajustée(s)' : '');
    const ko = r.verifs.filter(v => !v.ok);
    $('#fact-resume').innerHTML = '<div class="note info">' + res2 + '<br><span class="' + (ko.length ? 'test-ko' : 'test-ok') + '">' + (ko.length ? '✗ ' + ko.length + ' contrôle(s) de calcul en échec' : '✓ ' + r.verifs.length + ' contrôles de calcul passent') + '</span></div>';
    let cf = '';
    if (r.conf.conforme) cf += '<div class="note ok"><b>Facture conforme :</b> elle peut être émise.</div>';
    else cf += '<div class="note erreur"><b>Émission bloquée</b><ul>' + r.conf.bloquants.map(b => '<li>' + esc(b.message) + '</li>').join('') + '</ul></div>';
    if (r.conf.avertissements.length) cf += '<div class="note hypothese"><ul>' + r.conf.avertissements.map(a => '<li>' + esc(a.message) + '</li>').join('') + '</ul></div>';
    $('#fact-conf').innerHTML = cf;
    $('#btn-emettre').disabled = !r.conf.conforme;
    $('#fact-apercu').innerHTML = Doc.rendreFacture(etat.catalogue, etat.devis, r.br, c, { emise: false, conformite: r.conf });
    const reg = etat.catalogue.parametres.factures.registre || [];
    $('#fact-registre').innerHTML = reg.length ? '<table class="t"><thead><tr><th scope="col">Numéro</th><th scope="col">Date</th><th scope="col">Type</th><th scope="col">Devis</th><th scope="col">Client</th><th scope="col" class="num">Montant</th></tr></thead><tbody>' +
      reg.map(x => '<tr><td class="code">' + esc(x.numero) + '</td><td>' + M.dateFr(x.date) + '</td><td>' + (x.type === 'solde' ? 'Solde' : 'Acompte') + '</td><td class="code">' + esc(x.devis) + '</td><td>' + esc(x.client || '') +
        '</td><td class="num">' + M.euros(x.ttc_c) + '</td></tr>').join('') + '</tbody></table><p class="note">Le registre est conservé dans ce navigateur : exportez le catalogue après chaque émission pour en garder une trace.</p>'
      : '<p class="note">Aucune facture émise pour l\'instant.</p>';
  }

  function emettreFacture() {
    const r = calculFacture();
    if (r.erreur || !r.conf.conforme) return;
    const cat = etat.catalogue, P = cat.parametres, d = etat.devis;
    const numero = FA.numeroFacture(P, r.br.date);
    const c = r.calc;
    const quoi = c.type === 'acompte' ? 'facture d\'acompte de ' + M.euros(c.totalTTC_c) : 'facture de solde (net à payer ' + M.euros(c.netAPayer_c) + ')';
    if (!confirm('Émettre la ' + quoi + ' sous le numéro ' + numero + ' ?\n\nUne facture émise ne peut plus être modifiée ni supprimée.')) return;
    const html = Doc.rendreFacture(cat, d, r.br, c, { numero, emise: true });
    const f = {
      id: 'F' + Date.now().toString(36), type: c.type, etape: c.type === 'acompte' ? c.indexEtape : null, numero, date: r.br.date,
      echeance: FA.echeance(r.br), devis: d.numero, montants: FA.montantsFiges(c), brouillon: clone(r.br), html, emiseLe: new Date().toISOString()
    };
    d.factures.push(f);
    P.factures.registre = P.factures.registre || [];
    P.factures.registre.push({ numero, date: f.date, type: f.type, devis: d.numero, client: d.client.type === 'professionnel' ? d.client.raisonSociale : d.client.nom, ttc_c: f.montants.ttc_c });
    P.factures.prochainNumero = Number(P.factures.prochainNumero) + 1;
    const suite = prochaineEtape();
    d.facturation = Object.assign(FA.nouveauBrouillon(cat, d), suite, { dateDebut: r.br.dateDebut });
    rendreFactures();
    majCalcul();
    imprimerOuMontrer(f);
  }
  function imprimerOuMontrer(f) {
    if (confirm('Facture ' + f.numero + ' émise. L\'imprimer ou l\'enregistrer en PDF maintenant ?')) imprimerHtml(f.html, 'Facture n° ' + f.numero);
  }

  document.addEventListener('click', ev => {
    const p = ev.target.closest('[data-preparer]');
    if (p) {
      const [type, etape] = p.dataset.preparer.split(':');
      const br = brouillon();
      br.type = type; br.etape = Number(etape);
      rendreFactures();
      $('#onglet-factures .carte:nth-of-type(2)').scrollIntoView({ behavior: 'smooth' });
      return;
    }
    const v = ev.target.closest('[data-voir-facture]');
    if (v) { const f = etat.devis.factures.find(x => x.id === v.dataset.voirFacture); if (f) imprimerHtml(f.html, 'Facture n° ' + f.numero); return; }
    const x = ev.target.closest('[data-export-facture]');
    if (x) {
      const f = etat.devis.factures.find(y => y.id === x.dataset.exportFacture);
      if (f) telecharger('facture-' + f.numero + '.json', { type: 'facture', numero: f.numero, date: f.date, echeance: f.echeance, nature: f.type, devis: f.devis,
        entreprise: etat.catalogue.entreprise, client: etat.devis.client, chantier: M.adresseChantier(etat.devis), montants: f.montants, emiseLe: f.emiseLe });
    }
  });
  document.addEventListener('input', ev => {
    const el = ev.target;
    if (!el.dataset || !el.dataset.qr) return;
    const br = brouillon();
    const v = el.value.trim();
    const ok = v === '' || M.versEntier(v, 3) >= 0;
    el.classList.toggle('invalide', !ok);
    if (!ok) return;
    if (v === '') delete br.qtesRealisees[el.dataset.qr]; else br.qtesRealisees[el.dataset.qr] = v;
    majFactures(); sauver();
  });

  function surSuppressionCatalogue(ev) {
    const bf = ev.target.closest('[data-suppr-fourn]'), bo = ev.target.closest('[data-suppr-ouv]');
    if (bf) {
      const f = etat.catalogue.fournitures[Number(bf.dataset.supprFourn)];

      etat.catalogue.fournitures.splice(Number(bf.dataset.supprFourn), 1); rendreCatalogue(); majCalcul();
    }
    if (bo) {
      const o = etat.catalogue.ouvrages[Number(bo.dataset.supprOuv)];
      if (etat.devis.lignes.some(l => l.ouvrage === o.code) && !confirm('L\'ouvrage ' + o.code + ' est utilisé dans le devis en cours. Le supprimer quand même ?')) return;

      etat.catalogue.ouvrages.splice(Number(bo.dataset.supprOuv), 1); rendreCatalogue(); construireLignes(); majCalcul();

  function majCatalogueCalcule() {
    const cat = etat.catalogue, P = cat.parametres;
    const ex = $('#expli-marge');
    if (ex) {
      const t = M.versEntier(P.marge.tauxMarque, 2), k = M.versEntier(P.marge.coefficient, 4);
      const pvT = M.prixVente(10000, { mode: 'taux_marque', entier: t }), pvK = M.prixVente(10000, { mode: 'coefficient', entier: k });
      ex.innerHTML = 'Exemple pour un achat de 100,00 € HT :<br>• Taux de marque ' + M.pourcent(t) + ' → vente <b>' + M.euros(pvT) + '</b>, marge ' + M.euros(pvT - 10000) +
        ' (= ' + M.pourcent(t) + ' du prix de vente ; coefficient équivalent ' + (t < 10000 ? (10000 / (10000 - t)).toFixed(4).replace('.', ',') : '—') + ').<br>• Coefficient ' + M.coef(k) +
        ' → vente <b>' + M.euros(pvK) + '</b>, marge ' + M.euros(pvK - 10000) + ' (= seulement ' + (k ? ((k - 10000) / k * 100).toFixed(2).replace('.', ',') : '—') + ' % du prix de vente).<br>' +
        'Mode actif : <b>' + (P.marge.mode === 'coefficient' ? 'coefficient' : 'taux de marque') + '</b>. Les deux indicateurs sont rappelés dans le récapitulatif interne.';
    }
    const fam = new Map(cat.familles.map(f => [f.code, f]));
    cat.fournitures.forEach((f, i) => {
      const td = $('#pv-f-' + i);
      if (!td) return;
      const r = M.regleMarge(cat, f, fam);
      const pv = M.prixVente(f.pa_c, r);
      td.innerHTML = Number.isInteger(pv) ? M.euros(pv) + '<br><span class="code">' + esc(r.source) + '</span>' : '—';
    });
    let idx = null;
    try { idx = M.indexer(cat); } catch (e) { return; }
    cat.ouvrages.forEach((o, i) => {
      const td = $('#pu-o-' + i);
      if (!td) return;
      try {
        const sl = idx.sousLots.get(o.sousLot), lot = sl && idx.lots.get(sl.lot), m = lot && P.metiers[lot.metier];
        const v = M.valeursFournitures(idx, o);
        const mo = o.mode === 'horaire' ? m.tauxHoraire_c : (Number.isInteger(o.prixMOBase_c) ? o.prixMOBase_c : M.mulDiv([M.versEntier(o.tempsUnitaire_h, 3), m.tauxHoraire_c], [1000]));
        td.textContent = M.euros(v.PVu + mo);
      } catch (e) { td.textContent = '—'; }
    });
  }

      'Qté × PU = Total sur chaque ligne, ventilation de la TVA, somme de l\'échéancier égale au TTC, prix de vente conformes au mode de marge, cohérence du récapitulatif interne.</p>' +

    $('#btn-tests').addEventListener('click', lancerTests);
  }
  function lancerTests() {
    const out = [];
    let ko = 0, n = 0;
    const tous = S.liste.map((sc, k) => ({ sc, k, exemple: false })).concat(S.modeles.map((m, k) => ({ sc: { titre: 'Modèle ' + m.id + ' · ' + m.titre, construire: c => m.construire(c, { exemple: true }) }, k, modele: true })));
    tous.forEach(({ sc, k, modele }) => {
      const blocs = [];
      ['taux_marque', 'coefficient'].forEach(mode => {
        const cat = clone(etat.catalogue);
        if (M.vide(cat.entreprise.raisonSociale)) cat.entreprise = clone(S.entrepriseDemo);
        cat.parametres.marge.mode = mode;
        const d = sc.construire(cat);
        const t0 = performance.now();
        let r, v;
        try { r = M.calculer(cat, d); v = M.verifierCalculs(cat, d, r); } catch (e) { v = [{ nom: 'Exception', ok: false, detail: e.message }]; }
        const ms = (performance.now() - t0).toFixed(1);
        v.forEach(x => { n++; if (!x.ok) ko++; });
        blocs.push({ mode, r, v, ms });
      });
      const okSc = blocs.every(b => b.v.every(x => x.ok));
      const b0 = blocs[0].r;
      out.push('<div class="carte" style="margin-bottom:10px"><div class="test-resume"><span class="' + (okSc ? 'test-ok' : 'test-ko') + '">' + (okSc ? '✓' : '✗') + '</span><b>' + esc(sc.titre) + '</b>' +
        (b0 ? '<span class="code">HT ' + M.euros(b0.totalHT_c) + ' · TVA ' + M.euros(b0.totalTVA_c) + ' · TTC ' + M.euros(b0.totalTTC_c) + ' · ' + b0.valides.length + ' ligne(s) · ' +
          b0.conformite.bloquants.length + ' blocage(s)</span>' : '') +
        '<button class="btn petit" ' + (modele ? 'data-charger-modele' : 'data-charger-test') + '="' + k + '" style="margin-left:auto">Ouvrir dans l\'éditeur</button></div>' +
        blocs.map(b => '<details><summary>Marge en mode « ' + (b.mode === 'coefficient' ? 'coefficient' : 'taux de marque') + ' » — ' + b.v.filter(x => x.ok).length + '/' + b.v.length + ' contrôles · ' + b.ms + ' ms</summary><ul>' +
          b.v.map(x => '<li><span class="' + (x.ok ? 'test-ok' : 'test-ko') + '">' + (x.ok ? '✓' : '✗') + '</span> ' + esc(x.nom) + (x.detail ? ' <span class="code">' + esc(x.detail) + '</span>' : '') + '</li>').join('') +
          '</ul>' + (b.r ? '<p class="code">Échéancier : ' + b.r.echeancier.map(e => M.pourcent(e.part_bp) + ' ' + M.euros(e.montant_c)).join(' + ') + ' = ' + M.euros(b.r.echeancier.reduce((a, e) => a + e.montant_c, 0)) + '</p>' : '') + '</details>').join('') + '</div>');
    });
    $('#resultats-tests').innerHTML = '<div class="note ' + (ko ? 'erreur' : 'ok') + '"><b>' + (ko ? ko + ' contrôle(s) en échec' : 'Tous les contrôles passent') + '</b> — ' + (n - ko) + '/' + n + '</div>' + out.join('');
  }

  // Modèle : remplace les lignes et les conditions de chantier ; propose de garder le client déjà saisi.
  function chargerModele(k) {
    const m = S.modeles[k];
    const cur = etat.devis, cl = cur.client || {};
    if (cur.lignes.length && !confirm('Remplacer les ' + cur.lignes.length + ' ligne(s) du devis en cours par le modèle « ' + m.titre + ' » ?')) return false;
    const nouveau = m.construire(etat.catalogue);
    const nomClient = cl.type === 'professionnel' ? cl.raisonSociale : cl.nom;
    if (!M.vide(nomClient) && confirm('Garder le client « ' + nomClient + ' » et l\'adresse du chantier ?')) {
      nouveau.client = clone(cl);
      ['identiqueClient', 'adresse', 'cp', 'ville', 'departement', 'zoneRurale'].forEach(c => { nouveau.chantier[c] = cur.chantier[c]; });
      if (!M.vide(cur.numero) && !(cur.factures || []).length) nouveau.numero = cur.numero;
      if (cl.type === 'professionnel' && nouveau.chantier.typeLocal === 'logement' && m.metier === 'Professionnels') nouveau.chantier.typeLocal = 'local_pro';
    }
    etat.devis = nouveau;
    toutReconstruire();
    activer('lignes');
    const info = $('#sel-info');
    if (info) info.textContent = 'Modèle « ' + m.titre + ' » chargé : ajustez les quantités à votre métré, complétez le client et attribuez le numéro.';

  /* ---------------- Import / export de fichiers ---------------- */
  function telecharger(nom, obj) {
    const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = nom;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
  function lireFichier(input, rappel) {
    const f = input.files && input.files[0];
    if (!f) return;
    const lec = new FileReader();
    lec.onload = () => { try { rappel(JSON.parse(lec.result)); } catch (e) { alert('Fichier JSON illisible : ' + e.message); } input.value = ''; };
    lec.readAsText(f, 'utf-8');
  }
  function importerDevis(obj) {
    const d = obj && obj.devis ? obj.devis : obj;
    if (!d || !Array.isArray(d.lignes) || typeof d.client !== 'object') { alert('Ce fichier ne contient pas un devis (lignes et client attendus).'); return; }
    if (etat.devis.lignes.length && !confirm('Remplacer le devis en cours par le devis importé ?')) return;
    etat.devis = completer(M.nouveauDevis(etat.catalogue), d);

  /* ---------------- Profil, contacts et sauvegarde ----------------
     Tout reste sur l'appareil (stockage du navigateur). La sauvegarde est un fichier JSON
     qui contient le profil, le catalogue (entreprise, prix, registres) et le devis en cours. */
  const PROFIL_DEFAUT = {
    nom: '', telephone: '', email: '', metier: '',
    preferences: { ouverture: 'reprendre' },
    contacts: [], accueilVu: false, derniereSauvegarde: ''
  };
  const CONTACT_DEFAUT = { nom: '', email: '', telephone: '' };
  /* Profil transmis dans le lien lui-même (#profil=… en base64url) : la partie après « # » n'est jamais
     envoyée au serveur, donc les coordonnées ne sont stockées nulle part en ligne. */
  const RE_PROFIL_LIEN = /(^#|&)profil=([A-Za-z0-9_-]+)/;
  function profilDepuisLien() {
    const m = location.hash.match(RE_PROFIL_LIEN);
    if (!m) return null;
    try {
      const b = atob(m[2].replace(/-/g, '+').replace(/_/g, '/'));
      const p = JSON.parse(new TextDecoder().decode(Uint8Array.from(b, c => c.charCodeAt(0))));
      return p && typeof p === 'object' && !Array.isArray(p) ? p : null;
    } catch (e) { return null; }
  }
  function profilPreenregistre() {
    try {
      const el = document.getElementById('profil-preenregistre');
      const p = profilDepuisLien() || (el ? JSON.parse(el.textContent) : null);
      if (!p || typeof p !== 'object') return {};
      const o = clone(p);
      o.contacts = Array.isArray(o.contacts) ? o.contacts.map(c => completer(CONTACT_DEFAUT, c)) : [];
      return o;
    } catch (e) { return {}; }
  }
  const EMOJI = /\p{Extended_Pictographic}(️|‍\p{Extended_Pictographic})*/u;
  function avatar(nom) {

    if (m) return { emoji: true, txt: m[0] };
    const mots = String(nom || '').replace(EMOJI, '').trim().split(/\s+/).filter(Boolean);
    return { emoji: false, txt: ((mots[0] || '?')[0] + (mots.length > 1 ? mots[mots.length - 1][0] : '')).toUpperCase() };
  }

    if (t) {
      const c = etat.profil.contacts[Number(t.dataset.appeler)];
      if (!c || telLien(c.telephone).length < 6) { alert('Renseignez un numéro de téléphone pour ce contact.'); return; }
      location.href = 'tel:' + telLien(c.telephone);
    }
    if (x) {
      const i = Number(x.dataset.supprimerContact), c = etat.profil.contacts[i];
      if (!c || !confirm('Supprimer le contact « ' + (c.nom || 'sans nom') + ' » ?')) return;
      etat.profil.contacts.splice(i, 1);
      rendreContacts(); majCalcul();
    }
  });
  // L'avatar suit le nom tapé (initiales ou émoji)
  document.addEventListener('input', ev => {
    const b = ev.target.dataset && ev.target.dataset.bind;
    const m = b && b.match(/^profil\.contacts\.(\d+)\.nom$/);
    if (!m) return;
    const av = ev.target.closest('.contact') && ev.target.closest('.contact').querySelector('.avatar');
    if (!av) return;
    const a = avatar(ev.target.value);
    av.textContent = a.txt; av.classList.toggle('emoji', a.emoji);
  });

  function majSauvegardeInfo() {
    const z = $('#info-sauvegarde');
    if (!z) return;
    const d = etat.profil.derniereSauvegarde;
    z.className = 'note ' + (d ? 'ok' : 'hypothese');
    z.textContent = d ? 'Dernière sauvegarde téléchargée le ' + M.dateFr(d.slice(0, 10)) + '.' : 'Aucune sauvegarde téléchargée depuis cet appareil.';
  }
  function telechargerSauvegarde() {
    const jour = M.aujourdhui();
    etat.profil.derniereSauvegarde = new Date().toISOString();
    telecharger('sauvegarde-devis-btp-' + jour + '.json', { type: 'sauvegarde-devis-btp', version: 1, exporteLe: etat.profil.derniereSauvegarde, profil: etat.profil, catalogue: etat.catalogue, devis: etat.devis });
    majSauvegardeInfo(); sauver();
  }
  function restaurerSauvegarde(obj) {
    if (!obj || obj.type !== 'sauvegarde-devis-btp' || !obj.catalogue || !obj.devis) { alert('Ce fichier n\'est pas une sauvegarde du simulateur.'); return; }
    const err = M.validerCatalogue(obj.catalogue);
    if (err.length) { alert('Sauvegarde refusée, catalogue invalide :\n' + err.slice(0, 10).join('\n')); return; }
    if (!Array.isArray(obj.devis.lignes)) { alert('Sauvegarde refusée : le devis est illisible.'); return; }
    const quand = obj.exporteLe ? ' du ' + M.dateFr(String(obj.exporteLe).slice(0, 10)) : '';
    if (!confirm('Restaurer la sauvegarde' + quand + ' ? Le profil, l\'entreprise, les prix et le devis de cet appareil seront remplacés.')) return;
    etat.catalogue = completer(CAT_DEFAUT, obj.catalogue);
    etat.devis = completer(M.nouveauDevis(etat.catalogue), obj.devis);
    etat.profil = completer(PROFIL_DEFAUT, obj.profil || {});
    etat.profil.accueilVu = true;
    toutReconstruire();
    activer('profil');
    alert('Sauvegarde restaurée.');
  }


  /* ---------------- Nouvelle prestation (hors catalogue) ----------------
     Crée une ligne libre ou, si demandé, un ouvrage « PERSO-nnn » dans le catalogue de l'utilisateur.
     Le prix saisi est un prix de base : les coefficients du chantier s'y appliquent comme au reste. */
  function prochainCodePerso() {
    const pris = new Set(etat.catalogue.ouvrages.map(o => o.code));
    let n = 1; while (pris.has('PERSO-' + String(n).padStart(3, '0'))) n++;
    return 'PERSO-' + String(n).padStart(3, '0');
  }
  function sousLotParDefaut() {
    const L = etat.devis.lignes;
    for (let i = L.length - 1; i >= 0; i--) {
      const l = L[i];
      if (l.libre && l.libre.sousLot) return l.libre.sousLot;
      const o = etat.catalogue.ouvrages.find(x => x.code === l.ouvrage); if (o) return o.sousLot;
    }
    return etat.catalogue.lots[0].sousLots[0].code;
  }
  function ouvrirPrestation(texte, qte) {
    const d = $('#prestation');
    if (!d || d.open) return;
    const C = etat.catalogue, slDef = sousLotParDefaut();
    const optsSl = C.lots.map(l => '<optgroup label="' + esc(l.libelle) + '">' + l.sousLots.map(s => '<option value="' + esc(s.code) + '"' + (s.code === slDef ? ' selected' : '') + '>' + esc(l.libelle + ' › ' + s.libelle) + '</option>').join('') + '</optgroup>').join('');
    const optsU = M.UNITES.map(u => '<option value="' + esc(u) + '"' + (u === 'u' ? ' selected' : '') + '>' + esc(u) + '</option>').join('');
    d.innerHTML = '<form method="dialog" class="accueil-corps" novalidate>' +
      '<span class="kicker">Hors catalogue</span><h2 id="prestation-titre" tabindex="-1">Nouvelle prestation</h2>' +
      '<p class="chapo">Décrivez-la comme elle doit apparaître sur le devis. Le prix final tient compte des conditions de ce chantier.</p>' +
      '<div class="grille-prest">' +
      '<label class="champ large"><span>Désignation <b class="req">*</b></span><textarea id="pr-lib" rows="2" required placeholder="ex. Pose d\'une VMC simple flux hygroréglable, bouches comprises">' + esc(texte || '') + '</textarea></label>' +
      '<label class="champ large"><span>Lot</span><select id="pr-sl">' + optsSl + '</select></label>' +
      '<label class="champ"><span>Unité</span><select id="pr-u">' + optsU + '</select></label>' +
      '<label class="champ"><span>Quantité</span><input id="pr-q" type="text" inputmode="decimal" value="' + esc(qte && M.versEntier(qte, 3) > 0 ? qte : '1') + '"></label>' +
      '<fieldset class="radios large"><legend>Comment la chiffrer ?</legend><div class="opts">' +
      '<label><input type="radio" name="pr-mode" value="prix" checked> Un prix par unité</label>' +
      '<label><input type="radio" name="pr-mode" value="temps"> Temps de pose et fournitures</label></div></fieldset>' +
      '<label class="champ" data-pr="prix"><span>Prix HT de base par unité (€) <b class="req">*</b></span><input id="pr-prix" type="text" inputmode="decimal" placeholder="ex. 120"></label>' +
      '<label class="champ" data-pr="temps" hidden><span>Temps de pose par unité (h) <b class="req">*</b></span><input id="pr-t" type="text" inputmode="decimal" placeholder="ex. 1,5"></label>' +
      '<label class="champ" data-pr="temps" hidden><span>Fournitures, prix d\'achat HT par unité (€)</span><input id="pr-pa" type="text" inputmode="decimal" placeholder="ex. 85"></label>' +
      '</div>' +
      '<label class="case"><input type="checkbox" id="pr-55"><span>Travaux de rénovation énergétique (TVA à 5,5 % si le chantier y a droit)</span></label>' +
      '<label class="case"><input type="checkbox" id="pr-garder" checked><span>Garder cette prestation dans mon catalogue pour mes prochains devis</span></label>' +
      '<div class="resultat-prest" id="pr-res" role="status" aria-live="polite"></div>' +
      '<div class="accueil-actions"><button class="btn primaire grand" type="submit" value="ok">Ajouter au devis</button><button class="btn grand" type="submit" value="annuler" formnovalidate>Annuler</button></div>' +
      '</form><button class="fermer-accueil" type="button" aria-label="Fermer" data-fermer-prest>✕</button>';
    const f = d.querySelector('form');
    const val = id => d.querySelector('#' + id).value.trim();
    const modeChoisi = () => d.querySelector('input[name="pr-mode"]:checked').value;
    function lire() {
      const mode = modeChoisi(), err = [];
      const lib = val('pr-lib'), q = val('pr-q') || '1';
      if (lib.length < 3) err.push(['pr-lib', 'Décrivez la prestation (3 caractères au moins).']);
      if (!(M.versEntier(q, 3) > 0)) err.push(['pr-q', 'Quantité invalide.']);
      let prix = null, t = null, pa = 0;
      if (mode === 'prix') {
        prix = M.versEntier(val('pr-prix').replace(/€/g, ''), 2);
        if (!(prix > 0)) err.push(['pr-prix', 'Indiquez un prix supérieur à 0.']);
      } else {
        t = val('pr-t').replace(',', '.');
        if (!(M.versEntier(t, 3) > 0)) err.push(['pr-t', 'Indiquez un temps supérieur à 0.']);
        const p = val('pr-pa');
        pa = p ? M.versEntier(p.replace(/€/g, ''), 2) : 0;
        if (!(pa >= 0)) err.push(['pr-pa', 'Prix d\'achat invalide.']);
      }
      const libre = { libelle: lib, sousLot: val('pr-sl'), unite: val('pr-u'), mode: 'unite',
        tempsUnitaire_h: mode === 'temps' ? Number(t) : null, prixMOBase_c: mode === 'prix' ? prix : null,
        paFournitures_c: mode === 'temps' ? pa : 0, inclus: '', exclus: '', eligible55: d.querySelector('#pr-55').checked };
      return { err, libre, q, mode };
    }
    function apercu(montrerErreurs) {
      const r = lire(), z = d.querySelector('#pr-res');
      d.querySelectorAll('.invalide').forEach(el => el.classList.remove('invalide'));
      if (r.err.length) {
        if (montrerErreurs) { r.err.forEach(([id]) => d.querySelector('#' + id).classList.add('invalide')); z.className = 'resultat-prest ko'; z.textContent = r.err.map(e => e[1]).join(' '); }
        else { z.className = 'resultat-prest'; z.textContent = 'Le prix sur ce devis s\'affichera ici.'; }
        return null;
      }
      const essai = clone(etat.devis);
      essai.lignes = [{ id: 'essai-prest', ouvrage: null, libre: r.libre, qte: r.q, mode: null, unite: null, tva: 'auto', complement: '', qteFourn: '' }];
      try {
        const x = M.calculer(etat.catalogue, essai).valides.find(l => l.id === 'essai-prest');
        if (!x) throw new Error('calcul impossible');
        z.className = 'resultat-prest ok';
        z.innerHTML = 'Sur ce devis : <b>' + M.euros(x.PU) + ' HT</b> par ' + esc(r.libre.unite) + ' · <b>' + M.euros(x.total_c) + ' HT</b> pour ' + esc(r.q.replace('.', ',')) + ' ' + esc(r.libre.unite) +
          (x.PU !== (r.libre.prixMOBase_c || -1) && r.mode === 'prix' ? '<small>Majorations de ce chantier comprises (étage, accès, pénibilité).</small>' : '');
        return r;
      } catch (e) { z.className = 'resultat-prest ko'; z.textContent = 'Calcul impossible : ' + e.message; return null; }
    }
    d.querySelectorAll('input[name="pr-mode"]').forEach(x => x.addEventListener('change', () => {
      const m = modeChoisi(); d.querySelectorAll('[data-pr]').forEach(el => { el.hidden = el.dataset.pr !== m; }); apercu(false);
    }));
    f.addEventListener('input', () => apercu(false));
    f.addEventListener('change', () => apercu(false));
    f.addEventListener('submit', ev => {
      if (ev.submitter && ev.submitter.value === 'annuler') return;
      const r = apercu(true);
      if (!r) { ev.preventDefault(); const e = d.querySelector('.invalide'); if (e) e.focus(); return; }
      let ligne, message;
      if (d.querySelector('#pr-garder').checked) {
        const code = prochainCodePerso(), avant = clone(etat.catalogue), C = etat.catalogue, L = r.libre;
        const ouv = { code, sousLot: L.sousLot, libelle: L.libelle, unite: L.unite, mode: 'unite', tempsUnitaire_h: L.tempsUnitaire_h, prixMOBase_c: L.prixMOBase_c,
          fournitures: [], inclus: [], exclus: [], eligible55: L.eligible55, perso: true };
        if (L.paFournitures_c > 0) {
          if (!C.familles.some(x => x.code === 'PERSO')) C.familles.push({ code: 'PERSO', libelle: 'Fournitures de mes prestations', marge: null });
          C.fournitures.push({ code: 'F-' + code, libelle: L.libelle, famille: 'PERSO', unite: L.unite, pa_c: L.paFournitures_c, marge: null });
          ouv.fournitures = [{ code: 'F-' + code, ratio: 1 }];
        }
        C.ouvrages.push(ouv);
        const err = M.validerCatalogue(C);
        if (err.length) { etat.catalogue = avant; ev.preventDefault(); const z = d.querySelector('#pr-res'); z.className = 'resultat-prest ko'; z.textContent = 'Enregistrement impossible : ' + err[0]; return; }
        ligne = { id: idLigne(), ouvrage: code, libre: null, qte: r.q, mode: null, unite: null, tva: 'auto', complement: '', qteFourn: '' };
        message = '✓ « ' + L.libelle + ' » ajoutée au devis et gardée dans votre catalogue : tapez son nom dans la recherche pour la retrouver.';
      } else {
        ligne = { id: idLigne(), ouvrage: null, libre: r.libre, qte: r.q, mode: 'unite', unite: null, tva: 'auto', complement: '', qteFourn: '' };
        message = '✓ « ' + r.libre.libelle + ' » ajoutée à ce devis seulement.';
      }
      etat.devis.lignes.push(ligne);
      if (ligne.ouvrage) rendreCatalogue(); // la nouvelle prestation apparaît aussi dans Catalogue et paramètres
      if (ongletActif !== 'lignes') activer('lignes');
      rendreLignes(); majCalcul();
      const info = $('#sel-info'); if (info) info.textContent = message;
      const rech = $('#sel-recherche'); if (rech) rech.value = '';
    });
    d.querySelector('[data-fermer-prest]').addEventListener('click', () => d.close('annuler'));
    if (typeof d.showModal === 'function') d.showModal(); else d.setAttribute('open', '');
    d.scrollTop = 0;
    apercu(false);
    const cible = texte ? d.querySelector('#pr-prix') : d.querySelector('#pr-lib');
    if (cible) cible.focus();
  }
  document.addEventListener('click', ev => {
    if (ev.target.closest('[data-nouvelle-prestation]')) { const r = $('#sel-recherche'); ouvrirPrestation(r ? r.value.trim() : '', ''); }
  });

  /* ---------------- Mode d'emploi (accueil) ---------------- */
  function ouvrirAccueil() {
    const d = $('#accueil');
    if (!d || d.open) return;
    const prenom = String(etat.profil.nom || '').trim().split(/\s+/)[0];
    const etape = (n, t, x) => '<li><span class="num" aria-hidden="true">' + n + '</span><div><b>' + t + '</b><span>' + x + '</span></div></li>';
    d.innerHTML = '<form method="dialog" class="accueil-corps">' +
      '<span class="kicker">Mode d\'emploi · 2 minutes</span>' +
      '<h2 id="accueil-titre" tabindex="-1">' + (prenom ? 'Bonjour ' + esc(prenom) + ', voici' : 'Voici') + ' votre générateur de devis</h2>' +
      '<p class="chapo">Électricité, plomberie, carrelage et sols. Vous choisissez les ouvrages, il calcule les prix, la TVA et l\'échéancier, ' +
      'vérifie les mentions obligatoires, puis prépare le devis en PDF et les factures.</p>' +
      '<div class="avant"><b>Une seule fois, au début</b><span>Dans <i>Réglages</i> : <i>Mon profil</i>, puis <i>Entreprise</i> (vos mentions légales et votre assurance décennale), puis <i>Catalogue</i> (vos prix et taux horaires).</span></div>' +
      '<ol class="parcours">' +
      etape(1, 'Client et chantier', 'Qui, où, l\'étage, l\'accès, et les questions de TVA.') +
      etape(2, 'Chiffrage et lignes', 'Tapez « prise » ou « parquet », la quantité, puis Entrée. Une prestation manque ? Entrée vous propose de la créer, et elle reste dans votre catalogue.') +
      etape(3, 'Récapitulatif interne', 'Vos coûts et vos marges. Jamais imprimés.') +
      etape(4, 'Aperçu et impression', 'Imprimez, puis « Enregistrer au format PDF ». Tant qu\'une mention manque, l\'impression reste bloquée et la liste vous mène au bon champ.') +
      etape(5, 'Facturation', 'Les acomptes, puis le solde, à partir du devis signé.') +
      '</ol>' +
      '<div class="rassurer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>' +
      '<span>Vos données restent sur cet appareil. Pensez à télécharger une sauvegarde depuis <i>Mon profil</i>. ' +
      'Un exemple fictif (salle de bains) est chargé pour essayer : il est imprimé avec la mention « SPÉCIMEN ».</span></div>' +
      '<div class="accueil-actions">' +
      '<button class="btn primaire grand" value="exemple" type="submit">Essayer avec l\'exemple</button>' +
      '<button class="btn grand" value="profil" type="submit">Remplir mon profil d\'abord</button>' +
      '</div></form>' +
      '<button class="fermer-accueil" type="button" aria-label="Fermer le mode d\'emploi" data-fermer-accueil>✕</button>';
    d.querySelector('[data-fermer-accueil]').addEventListener('click', () => d.close('exemple'));
    d.addEventListener('close', function surFermeture() {
      d.removeEventListener('close', surFermeture);
      etat.profil.accueilVu = true; sauver();
      if (d.returnValue === 'profil') activer('profil');
    });
    if (typeof d.showModal === 'function') d.showModal(); else d.setAttribute('open', '');
    d.scrollTop = 0;
    const t = d.querySelector('#accueil-titre'); if (t) t.focus({ preventScroll: true });
  }

  /* ---------------- Construction générale ---------------- */
  function toutReconstruire() {
    construireDevis(); construireLignes(); construireProfil(); construireEntreprise(); rendreCatalogue(); construireTests();
    remplirFormulaires();
    majCalcul();
  }

  function init() {
    const s = charger();
    if (s && s.catalogue && s.devis && M.validerCatalogue(s.catalogue).length === 0) {
      etat = { catalogue: completer(CAT_DEFAUT, s.catalogue), devis: completer(M.nouveauDevis(s.catalogue), s.devis) };
    } else {
      const cat = clone(CAT_DEFAUT);
      cat.entreprise = clone(S.entrepriseDemo);
      etat = { catalogue: cat, devis: S.liste[0].construire(cat) };
    }
    // Profil : celui enregistré sur cet appareil, sinon le profil pré-enregistré de cette version, sinon vide.
    // Un profil déjà rempli sur l'appareil n'est jamais écrasé ; un profil encore vide cède la place à celui du lien.
    const profilVide = p => !p || (M.vide(p.nom) && !(p.contacts && p.contacts.length));
    const garderLocal = s && s.profil && !(profilVide(s.profil) && profilDepuisLien());
    etat.profil = completer(PROFIL_DEFAUT, garderLocal ? s.profil : profilPreenregistre());
    // Le profil du lien est lu une seule fois : on le retire de l'adresse (il est ensuite enregistré sur l'appareil).
    if (RE_PROFIL_LIEN.test(location.hash)) {
      try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { location.hash = ''; }
      sauver();
    }
    $('#rail').addEventListener('click', ev => { const b = ev.target.closest('[data-onglet]'); if (b) activer(b.dataset.onglet); });
    document.addEventListener('keydown', ev => {
      if (ev.key !== '/' || ev.metaKey || ev.ctrlKey || ev.altKey) return;
      const t = ev.target;
      if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable)) return;
      ev.preventDefault();
      if (ongletActif !== 'lignes') activer('lignes');
      const r = $('#sel-recherche'); if (r) r.focus();
    });
    const sel = $('#choix-test');
    const groupe = (titre, items) => { const g = document.createElement('optgroup'); g.label = titre; items.forEach(([v, l]) => g.appendChild(new Option(l, v))); sel.appendChild(g); };
    const metiers = [];
    S.modeles.forEach(m => { if (!metiers.includes(m.metier)) metiers.push(m.metier); });
    metiers.forEach(mt => groupe('Modèles · ' + mt, S.modeles.map((m, k) => [m, k]).filter(([m]) => m.metier === mt).map(([m, k]) => ['m:' + k, m.titre])));
    groupe('Exemples complets (données fictives)', S.liste.slice(0, 4).map((sc, k) => ['e:' + k, sc.titre.replace(/^\d+\.\s*/, '')]));
    groupe('Cas de test', S.liste.slice(4).map((sc, k) => ['e:' + (k + 4), sc.titre.replace(/^\d+[ab]?\.\s*/, '')]));
    sel.addEventListener('change', () => {
      const [type, k] = sel.value.split(':');
      if (type === 'm') chargerModele(Number(k));
      if (type === 'e') chargerTest(Number(k));
      sel.value = '';
    });
    $('#btn-nouveau').addEventListener('click', () => {
      if (!confirm('Créer un nouveau devis vide ? Le devis en cours sera remplacé (exportez-le d\'abord si besoin).')) return;
      etat.devis = M.nouveauDevis(etat.catalogue);
      toutReconstruire(); activer('devis');
    });
    $('#btn-export-devis').addEventListener('click', () => telecharger('devis-' + (etat.devis.numero || 'sans-numero') + '.json',
      { type: 'devis', version: 1, exporteLe: new Date().toISOString(), entreprise: etat.catalogue.entreprise, devis: etat.devis,
        totaux: res ? { ht_c: res.totalHT_c, tva_c: res.totalTVA_c, ttc_c: res.totalTTC_c } : null }));
    $('#fichier-devis').addEventListener('change', ev => lireFichier(ev.target, importerDevis));
    $('#btn-imprimer').addEventListener('click', imprimer);
    // Liens directs : #test=1 (charge un jeu de test), #apercu (ouvre l'aperçu)
    const hash = location.hash.slice(1);
    const mTest = hash.match(/test=(\d+)/);
    if (mTest && S.liste[Number(mTest[1]) - 1]) {
      if (M.vide(etat.catalogue.entreprise.raisonSociale)) etat.catalogue.entreprise = clone(S.entrepriseDemo);
      etat.devis = S.liste[Number(mTest[1]) - 1].construire(etat.catalogue);
    }
    toutReconstruire();
    let depart = 'devis';
    try { depart = localStorage.getItem(CLE + '-onglet') || 'devis'; } catch (e) { /* ignoré */ }
    const ouv = etat.profil.preferences.ouverture;
    if (ouv && ouv !== 'reprendre') depart = ouv;
    if (/apercu/.test(hash)) depart = 'apercu';
    activer(ONGLETS.some(o => o[0] === depart) ? depart : 'devis');
    $('#btn-guide').addEventListener('click', ouvrirAccueil);
    // Mode d'emploi au premier lancement (jamais pendant les impressions automatiques ou les liens de test)
    if (!etat.profil.accueilVu && !hash && !navigator.webdriver) ouvrirAccueil();
  }

  init();
})();

</script>
