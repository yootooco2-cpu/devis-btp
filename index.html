<script id="facture">
/* ==========================================================================
   MOTEUR DE FACTURATION — module JavaScript pur, sans DOM.
   Deux documents, toujours rattachés à un devis numéroté et conforme :
   - facture d'ACOMPTE : une étape de l'échéancier (hors dernière) ;
   - facture de SOLDE  : détail des travaux réalisés (quantités ajustables),
                         moins les acomptes déjà facturés, moins la retenue de garantie.

   RÈGLES DE CALCUL
   - Acompte : le montant TTC de l'étape est réparti entre les taux de TVA au
     prorata du TTC de chaque taux sur le devis (plus fort reste). Pour chaque taux :
     HT = arrondi(TTC × 100 / (100 + taux)) ; TVA = TTC − HT. La somme boucle donc
     exactement sur le TTC appelé.
   - Solde : les travaux sont recalculés par le moteur de devis avec les quantités
     réalisées. Pour chaque taux : reste HT = base HT − HT des acomptes,
     reste TVA = TVA − TVA des acomptes. Net à payer = TTC des travaux − TTC des
     acomptes − retenue de garantie (arrondi(TTC × taux)).
   ========================================================================== */
(function (racine) {
  'use strict';
  const M = (typeof module !== 'undefined' && module.exports) ? require('./moteur.js') : racine.Moteur;
  const ECH = 10000;

  function nouveauBrouillon(cat, devis) {
    const P = cat.parametres.factures || {};
    return {
      type: 'acompte', etape: 0, date: M.aujourdhui(), dateDebut: (devis.parametres || {}).dateDemarrage || '', dateFin: '',
      delaiJours: Number.isInteger(P.delaiPaiementJours) ? P.delaiPaiementJours : 0,
      optionDebits: !!P.optionDebits, qtesRealisees: {}
    };
  }

  function facturesEmises(devis) { return (devis.factures || []).slice(); }

  // Situation de chaque étape : facturée ou non.
  function etatFacturation(devis, res) {
    const emises = facturesEmises(devis);
    const etapes = res.echeancier.map((e, i) => {
      const f = emises.find(x => x.type === 'acompte' && x.etape === i);
      return { index: i, libelle: e.libelle, part_bp: e.part_bp, montant_c: e.montant_c, facture: f || null, derniere: i === res.echeancier.length - 1 };
    });
    const solde = emises.find(x => x.type === 'solde') || null;
    const acomptes = emises.filter(x => x.type === 'acompte');
    return { etapes, solde, acomptes, totalAcomptesTTC_c: acomptes.reduce((a, f) => a + f.montants.ttc_c, 0) };
  }

  function ventilerTTC(montantTTC, res) {
    if (res.autoliquidation || res.tva.length === 0) return [{ bp: 0, ht_c: montantTTC, tva_c: 0, ttc_c: montantTTC }];
    const parts = M.repartir(montantTTC, res.tva.map(t => t.base_c + t.montant_c));
    return res.tva.map((t, i) => {
      const ttc = parts[i];
      const ht = M.mulDiv([ttc, ECH], [ECH + t.bp]);
      return { bp: t.bp, ht_c: ht, tva_c: ttc - ht, ttc_c: ttc };
    });
  }

  function calculerAcompte(cat, devis, brouillon) {
    const res = M.calculer(cat, devis);
    const i = Number(brouillon.etape) || 0;
    const e = res.echeancier[i];
    if (!e) return { type: 'acompte', erreur: 'Étape d\'échéancier introuvable', res };
    const ventilation = ventilerTTC(e.montant_c, res);
    const ht = ventilation.reduce((a, v) => a + v.ht_c, 0);
    const tva = ventilation.reduce((a, v) => a + v.tva_c, 0);
    return {
      type: 'acompte', res, etape: e, indexEtape: i, numeroAcompte: i + 1, ventilation,
      totalHT_c: ht, totalTVA_c: tva, totalTTC_c: e.montant_c, netAPayer_c: e.montant_c, autoliquidation: res.autoliquidation
    };
  }

  function devisRealise(devis, brouillon) {
    const d = JSON.parse(JSON.stringify(devis));
    const q = brouillon.qtesRealisees || {};
    d.lignes.forEach(l => { if (!M.vide(q[l.id])) l.qte = String(q[l.id]); });
    return d;
  }

  function calculerSolde(cat, devis, brouillon) {
    const resDevis = M.calculer(cat, devis);
    const dR = devisRealise(devis, brouillon);
    const res = M.calculer(cat, dR);
    const acomptes = facturesEmises(devis).filter(f => f.type === 'acompte');
    const parTaux = new Map();
    res.tva.forEach(t => parTaux.set(t.bp, { bp: t.bp, base_c: t.base_c, tva_c: t.montant_c, acHT_c: 0, acTVA_c: 0 }));
    acomptes.forEach(f => f.montants.ventilation.forEach(v => {
      if (!parTaux.has(v.bp)) parTaux.set(v.bp, { bp: v.bp, base_c: 0, tva_c: 0, acHT_c: 0, acTVA_c: 0 });
      const x = parTaux.get(v.bp);
      x.acHT_c += v.ht_c; x.acTVA_c += v.tva_c;
    }));
    const ventilation = Array.from(parTaux.values()).sort((a, b) => b.bp - a.bp).map(x => Object.assign(x, {
      resteHT_c: x.base_c - x.acHT_c, resteTVA_c: x.tva_c - x.acTVA_c
    }));
    const acomptesTTC = acomptes.reduce((a, f) => a + f.montants.ttc_c, 0);
    const acomptesHT = acomptes.reduce((a, f) => a + f.montants.ht_c, 0);
    const acomptesTVA = acomptes.reduce((a, f) => a + f.montants.tva_c, 0);
    const resteTTC = res.totalTTC_c - acomptesTTC;
    const rgActive = !!(devis.parametres || {}).retenueGarantie;
    const rgTaux = M.versEntier(cat.parametres.retenueGarantie.taux, 2);
    const rg = rgActive ? M.mulDiv([res.totalTTC_c, rgTaux], [ECH]) : 0;
    const ecarts = res.valides.filter(l => {
      const ld = resDevis.valides.find(x => x.id === l.id);
      return ld && ld.q_m !== l.q_m;
    }).map(l => ({ id: l.id, libelle: l.libelle, qDevis_m: resDevis.valides.find(x => x.id === l.id).q_m, qReel_m: l.q_m }));
    return {
      type: 'solde', res, resDevis, devisRealise: dR, acomptes, ventilation, ecarts,
      totalTravauxHT_c: res.totalHT_c, totalTravauxTVA_c: res.totalTVA_c, totalTravauxTTC_c: res.totalTTC_c,
      acomptesHT_c: acomptesHT, acomptesTVA_c: acomptesTVA, acomptesTTC_c: acomptesTTC,
      resteHT_c: res.totalHT_c - acomptesHT, resteTVA_c: res.totalTVA_c - acomptesTVA, resteTTC_c: resteTTC,
      retenue: { active: rgActive, taux_bp: rgTaux, montant_c: rg },
      netAPayer_c: resteTTC - rg, autoliquidation: res.autoliquidation
    };
  }

  function calculer(cat, devis, brouillon) {
    return brouillon.type === 'solde' ? calculerSolde(cat, devis, brouillon) : calculerAcompte(cat, devis, brouillon);
  }

  function echeance(brouillon) {
    const j = Math.max(0, parseInt(brouillon.delaiJours, 10) || 0);
    return M.dateValide(brouillon.date) ? M.ajouterJours(brouillon.date, j) : '';
  }

  /* ---------- Conformité de la facture (bloquant avant émission) ---------- */
  function verifierFacture(cat, devis, brouillon, calc) {
    const B = [], A = [];
    const bloq = m => B.push({ onglet: 'factures', message: m });
    const avert = m => A.push({ onglet: 'factures', message: m });
    const resDevis = calc.type === 'solde' ? calc.resDevis : calc.res;
    const c = devis.client || {};
    const pro = c.type === 'professionnel';
    const emises = facturesEmises(devis);

    if (M.vide(devis.numero)) bloq('Le devis doit être numéroté avant toute facturation');
    if (!resDevis.conformite.conforme) bloq('Le devis n\'est pas conforme (' + resDevis.conformite.bloquants.length + ' point(s)) : corrigez-le avant de facturer');
    if (!M.dateValide(brouillon.date)) bloq('Date d\'émission de la facture manquante ou invalide');
    else if (M.dateValide(devis.date) && brouillon.date < devis.date) bloq('La date de facture est antérieure à la date du devis');
    const derniere = emises.filter(f => M.dateValide(f.date)).map(f => f.date).sort().pop();
    if (derniere && M.dateValide(brouillon.date) && brouillon.date < derniere) avert('Date antérieure à la dernière facture émise : la numérotation doit suivre l\'ordre chronologique');
    if (pro && M.vide(c.siret)) bloq('Client professionnel : SIREN/SIRET obligatoire sur la facture (réforme de la facturation électronique, à vérifier à la date d\'émission)');
    if (!(parseInt(brouillon.delaiJours, 10) >= 0)) bloq('Délai de paiement invalide');
    if (pro && parseInt(brouillon.delaiJours, 10) > 60) bloq('Délai de paiement supérieur à 60 jours entre professionnels (art. L441-10 C. com.)');

    if (calc.type === 'acompte') {
      if (calc.erreur) bloq(calc.erreur);
      else {
        if (calc.indexEtape === resDevis.echeancier.length - 1) bloq('La dernière étape se facture par la facture de solde');
        if (emises.some(f => f.type === 'acompte' && f.etape === calc.indexEtape)) bloq('Cette étape a déjà été facturée');
        if (emises.some(f => f.type === 'solde')) bloq('La facture de solde est déjà émise : plus aucun acompte ne peut être facturé');
        if (!(calc.totalTTC_c > 0)) bloq('Montant d\'acompte nul');
        for (let k = 0; k < calc.indexEtape; k++) {
          if (!emises.some(f => f.type === 'acompte' && f.etape === k)) { avert('Les étapes précédentes ne sont pas toutes facturées'); break; }
        }
        const ch = devis.chantier || {};
        if (ch.horsEtablissement && !pro && calc.indexEtape === 0 && M.dateValide(brouillon.date) && M.dateValide(devis.date) && brouillon.date < M.ajouterJours(devis.date, 7)) {
          avert('Contrat hors établissement : aucun paiement ne peut être exigé avant 7 jours après la conclusion du contrat (art. L221-10). Vérifiez la date de signature.');
        }
      }
    } else {
      if (emises.some(f => f.type === 'solde')) bloq('La facture de solde de ce devis est déjà émise');
      if (!M.dateValide(brouillon.dateFin)) bloq('Date d\'achèvement des travaux manquante (date de réalisation de la prestation)');
      else if (M.dateValide(brouillon.dateDebut) && brouillon.dateFin < brouillon.dateDebut) bloq('Date d\'achèvement antérieure à la date de début des travaux');
      calc.res.lignes.forEach((l, i) => l.erreurs.forEach(e => bloq('Ligne ' + (i + 1) + ' : ' + e)));
      if (calc.netAPayer_c < 0) bloq('Les acomptes facturés dépassent le montant dû : établissez un avoir plutôt qu\'une facture de solde négative');
      if (calc.ecarts.some(e => e.qReel_m > e.qDevis_m)) avert('Quantités réalisées supérieures au devis : les travaux supplémentaires doivent avoir fait l\'objet d\'un avenant ou d\'un devis signé');
      if (calc.ecarts.length) avert(calc.ecarts.length + ' ligne(s) facturée(s) avec une quantité différente du devis');
      const etapesNonFacturees = resDevis.echeancier.slice(0, -1).filter((e, i) => !emises.some(f => f.type === 'acompte' && f.etape === i));
      if (etapesNonFacturees.length) avert(etapesNonFacturees.length + ' étape(s) d\'acompte non facturée(s) : elles sont incluses dans le solde');
    }
    if (emises.some(f => Number.isInteger((f.montants || {}).devisTTC_c) && f.montants.devisTTC_c !== resDevis.totalTTC_c))
      avert('Le devis a été modifié depuis une facture déjà émise : toute modification après signature doit faire l\'objet d\'un avenant signé');
    if (calc.autoliquidation) avert('Autoliquidation : la facture porte la mention de l\'article 283-2 nonies du CGI et aucune TVA');
    return { bloquants: B, avertissements: A, conforme: B.length === 0 };
  }

  /* ---------- Vérifications de calcul ---------- */
  function verifierCalculs(cat, devis, calc) {
    const out = [];
    const ok = (nom, cond, detail) => out.push({ nom, ok: !!cond, detail: detail || '' });
    if (calc.type === 'acompte') {
      ok('Acompte : somme des parts TTC par taux = montant de l\'étape', calc.ventilation.reduce((a, v) => a + v.ttc_c, 0) === calc.totalTTC_c, M.euros(calc.totalTTC_c));
      ok('Acompte : HT + TVA = TTC pour chaque taux', calc.ventilation.every(v => v.ht_c + v.tva_c === v.ttc_c));
      ok('Acompte : HT = arrondi(TTC ÷ (1 + taux))', calc.ventilation.every(v => v.ht_c === M.mulDiv([v.ttc_c, ECH], [ECH + v.bp])));
      ok('Acompte : total HT + total TVA = total TTC', calc.totalHT_c + calc.totalTVA_c === calc.totalTTC_c);
      if (calc.autoliquidation) ok('Acompte autoliquidé : TVA nulle', calc.totalTVA_c === 0);
    } else {
      M.verifierCalculs(cat, calc.devisRealise, calc.res).forEach(v => out.push(Object.assign({}, v, { nom: 'Travaux réalisés : ' + v.nom })));
      ok('Solde : reste HT + reste TVA = reste TTC', calc.resteHT_c + calc.resteTVA_c === calc.resteTTC_c, M.euros(calc.resteTTC_c));
      ok('Solde : ventilation des restes = reste HT et reste TVA',
        calc.ventilation.reduce((a, v) => a + v.resteHT_c, 0) === calc.resteHT_c && calc.ventilation.reduce((a, v) => a + v.resteTVA_c, 0) === calc.resteTVA_c);
      ok('Solde : travaux TTC − acomptes − retenue = net à payer', calc.totalTravauxTTC_c - calc.acomptesTTC_c - calc.retenue.montant_c === calc.netAPayer_c, M.euros(calc.netAPayer_c));
      ok('Solde : acomptes + net à payer + retenue = TTC des travaux', calc.acomptesTTC_c + calc.netAPayer_c + calc.retenue.montant_c === calc.totalTravauxTTC_c);
    }
    return out;
  }

  // Montants figés enregistrés avec la facture émise
  function montantsFiges(calc) {
    if (calc.type === 'acompte') {
      return { ht_c: calc.totalHT_c, tva_c: calc.totalTVA_c, ttc_c: calc.totalTTC_c, net_c: calc.netAPayer_c, devisTTC_c: calc.res.totalTTC_c,
        ventilation: calc.ventilation.map(v => ({ bp: v.bp, ht_c: v.ht_c, tva_c: v.tva_c, ttc_c: v.ttc_c })) };
    }
    return { ht_c: calc.resteHT_c, tva_c: calc.resteTVA_c, ttc_c: calc.resteTTC_c, net_c: calc.netAPayer_c,
      travauxHT_c: calc.totalTravauxHT_c, travauxTTC_c: calc.totalTravauxTTC_c, retenue_c: calc.retenue.montant_c,
      ventilation: calc.ventilation.map(v => ({ bp: v.bp, ht_c: v.resteHT_c, tva_c: v.resteTVA_c, ttc_c: v.resteHT_c + v.resteTVA_c })) };
  }

  function numeroFacture(params, dateIso) {
    const f = params.factures || { prefixe: 'F', prochainNumero: 1 };
    const annee = (M.dateValide(dateIso) ? dateIso : M.aujourdhui()).slice(0, 4);
    return (f.prefixe || 'F') + '-' + annee + '-' + String(f.prochainNumero).padStart(4, '0');
  }

  const Facture = { nouveauBrouillon, etatFacturation, ventilerTTC, calculerAcompte, calculerSolde, calculer, echeance, verifierFacture, verifierCalculs, montantsFiges, numeroFacture, devisRealise };
  if (typeof module !== 'undefined' && module.exports) module.exports = Facture;
  else racine.Facture = Facture;
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
<script id="document">
/* ==========================================================================

(function (racine) {

  function esc(s) {

  function details(l) {
    return l.details.map(d => {
      if (d.type === 'texte') return '<div class="det">' + nl2br(d.texte) + '</div>';
      const titre = d.type === 'inclus' ? 'Comprend :' : 'Ne comprend pas :';
      return '<div class="det"><strong>' + titre + '</strong><ul>' + d.items.map(i => '<li>' + esc(i) + '</li>').join('') + '</ul></div>';
    }).join('');
  }

  function celTva(res, bp) { return res.autoliquidation ? 'AL' : M.pourcent(bp); }

        '<td class="num">' + tva + '</td><td class="num">' + euros(d.total_c) + '</td></tr>';
    }
    let h = '<tr class="r-ligne r-entete-ouvrage"><td class="n">' + l.numero + '</td><td class="des" colspan="6"><div class="lib">' + esc(l.libelle) + '</div>' + details(l) + '</td></tr>';

  // Bloc émetteur (identité légale de l'entreprise)
  function emetteur(E) {

  }

  // Bloc client (particulier ou professionnel)
  function blocClient(c, pro) {
    const h = [];
    if (pro) {
      h.push('<div class="nom">' + ph(c.raisonSociale, 'raison sociale du client') + '</div>');

      if (!M.vide(c.tvaIntra)) h.push('<div>N° TVA ' + esc(c.tvaIntra) + '</div>');
    } else {
      h.push('<div class="nom">' + esc(c.civilite ? c.civilite + ' ' : '') + ph(c.nom, 'nom du client') + '</div>');
      h.push('<div>' + ph(c.adresse, 'adresse du client') + '<br>' + ph(c.cp, 'code postal') + ' ' + ph(c.ville, 'ville') + '</div>');
    }
    const cc = [c.telephone ? 'Tél. ' + esc(c.telephone) : '', c.email ? esc(c.email) : ''].filter(Boolean).join(' · ');
    if (cc) h.push('<div>' + cc + '</div>');
    return h.join('');
  }

  // Tableau des travaux : Lot > Sous-lot > Ouvrages, sous-totaux, frais annexes
  function tableTravaux(res) {
    const h = [];
    h.push('<table class="doc-table"><caption class="sr">Détail des travaux par lot et sous-lot</caption>');
    h.push('<colgroup><col style="width:12mm"><col><col style="width:12mm"><col style="width:15mm"><col style="width:22mm"><col style="width:13mm"><col style="width:24mm"></colgroup>');
    h.push('<thead><tr><th scope="col">N°</th><th scope="col">Désignation</th><th scope="col">U.</th><th scope="col" class="num">Qté</th><th scope="col" class="num">PU HT</th><th scope="col" class="num">TVA</th><th scope="col" class="num">Total HT</th></tr></thead>');
    if (res.structure.length === 0) h.push('<tbody><tr><td colspan="7"><span class="ph">[À COMPLÉTER : aucune ligne de travaux]</span></td></tr></tbody>');
    res.structure.forEach(lot => {
      h.push('<tbody><tr class="r-lot"><th colspan="7" scope="rowgroup">' + lot.numero + '. ' + esc(lot.libelle) +
        (lot.reference ? ' <span class="ref">— réf. ' + esc(lot.reference) + '</span>' : '') + '</th></tr>');
      lot.sousLots.forEach(sl => {
        h.push('<tr class="r-sl"><th colspan="7" scope="rowgroup">' + sl.numero + ' ' + esc(sl.libelle) + '</th></tr>');
        sl.lignes.forEach(l => h.push(lignesOuvrage(res, l)));
        h.push('<tr class="r-st"><td></td><td colspan="5">Sous-total ' + sl.numero + ' ' + esc(sl.libelle) + '</td><td class="num">' + euros(sl.total_c) + '</td></tr>');
      });
      h.push('<tr class="r-lt"><td colspan="6">Total lot ' + lot.numero + ' — ' + esc(lot.libelle) + '</td><td class="num">' + euros(lot.total_c) + '</td></tr></tbody>');

      h.push('<tr class="r-ligne"><td class="n">' + (res.structure.length + 1) + '.1</td><td class="des"><div class="lib">' + esc(res.deplacement.designation) + '</div>' +
        (res.deplacement.ventilation.length > 1 ? '<div class="det">TVA répartie au prorata des travaux de chaque taux.</div>' : '') + '</td><td>j</td><td class="num">' +
        M.quantite(d.q_m) + '</td><td class="num">' + euros(d.pu_c) + '</td><td class="num">' + tvaDep + '</td><td class="num">' + euros(d.total_c) + '</td></tr></tbody>');
    }
    h.push('</table>');
    if (res.autoliquidation) h.push('<p style="font-size:7.8pt;color:#555;margin:1mm 0 0">AL : autoliquidation de la TVA par le preneur.</p>');
    return h.join('');
  }

  function rendreDocument(cat, devis, res) {
    const E = cat.entreprise || {};
    const P = cat.parametres;

    h.push('<article class="feuille" lang="fr">');
    if (!res.conformite.conforme) h.push('<div class="filigrane" aria-hidden="true"><span>BROUILLON<br>NON CONFORME</span></div>');
    else if (E.demo) h.push('<div class="filigrane neutre" aria-hidden="true"><span>SPÉCIMEN</span></div>');

    // En-tête
    // En-tête
    h.push('<header class="doc-entete">' + emetteur(E));
    h.push('<div class="doc-titre"><h1>DEVIS</h1><table class="doc-meta"><tbody>');

    h.push('<tr><th scope="row">Date</th><td>' + (M.dateValide(devis.date) ? M.dateFr(devis.date) : ph('', 'date')) + '</td></tr>');
    h.push('<tr><th scope="row">Validité</th><td>' + (validite > 0 ? validite + ' jours' + (finValidite ? ', jusqu\'au ' + finValidite : '') : ph('', 'durée de validité')) + '</td></tr>');

    // Parties

    h.push('<section class="doc-parties"><div class="doc-bloc"><h2>Client</h2>');
    h.push(blocClient(c, pro));
    h.push('</div><div class="doc-bloc"><h2>Adresse du chantier</h2>');
    h.push('<div>' + ph(adr.adresse, 'adresse du chantier') + '<br>' + ph(adr.cp, 'code postal') + ' ' + ph(adr.ville, 'ville') + '</div>');

    h.push('</div></section>');
    if (!M.vide(devis.objet)) h.push('<p class="doc-objet"><strong>Objet</strong> ' + esc(devis.objet) + '</p>');
    if (res.autoliquidation) h.push('<div class="bandeau">Autoliquidation — TVA due par le preneur assujetti (article 283, 2 nonies du CGI). Montants exprimés hors taxes, aucune TVA facturée.</div>');

    // Tableau des travaux
    // Tableau des travaux
    h.push(tableTravaux(res));

    // Récapitulatif et totaux
    h.push('<div class="doc-bas"><div>');
    h.push('<table class="doc-mini"><caption>Récapitulatif par lot</caption><thead><tr><th scope="col">Lot</th><th scope="col" class="num">Montant HT</th></tr></thead><tbody>');
    res.structure.forEach(l => h.push('<tr><td>' + l.numero + '. ' + esc(l.libelle) + '</td><td class="num">' + euros(l.total_c) + '</td></tr>'));
    if (res.deplacement.total_c) h.push('<tr><td>' + (res.structure.length + 1) + '. Frais annexes</td><td class="num">' + euros(res.deplacement.total_c) + '</td></tr>');
    h.push('</tbody></table>');
    h.push('<table class="doc-mini" style="margin-top:4mm"><caption>Ventilation de la TVA</caption><thead><tr><th scope="col">Taux</th><th scope="col" class="num">Base HT</th><th scope="col" class="num">TVA</th><th scope="col" class="num">TTC</th></tr></thead><tbody>');
    if (res.autoliquidation) h.push('<tr><td>Autoliquidation</td><td class="num">' + euros(res.totalHT_c) + '</td><td class="num">' + euros(0) + '</td><td class="num">' + euros(res.totalHT_c) + '</td></tr>');
    else res.tva.forEach(t => h.push('<tr><td>' + M.pourcent(t.bp) + '</td><td class="num">' + euros(t.base_c) + '</td><td class="num">' + euros(t.montant_c) + '</td><td class="num">' + euros(t.base_c + t.montant_c) + '</td></tr>'));
    h.push('</tbody></table></div>');
    h.push('<table class="doc-mini doc-totaux"><caption>Totaux</caption><tbody>');
    h.push('<tr><th scope="row">Total HT</th><td class="num">' + euros(res.totalHT_c) + '</td></tr>');
    if (res.autoliquidation) h.push('<tr><th scope="row">TVA</th><td class="num">Autoliquidation</td></tr>');
    else res.tva.forEach(t => h.push('<tr><th scope="row">TVA ' + M.pourcent(t.bp) + '</th><td class="num">' + euros(t.montant_c) + '</td></tr>'));
    h.push('<tr><th scope="row">Total TVA</th><td class="num">' + euros(res.totalTVA_c) + '</td></tr>');
    h.push('<tr class="ttc"><th scope="row">Total TTC</th><td class="num">' + euros(res.totalTTC_c) + '</td></tr>');
    h.push('<tr class="net"><th scope="row">Net à payer' + (res.autoliquidation ? ' HT' : ' TTC') + '</th><td class="num">' + euros(res.netAPayer_c) + '</td></tr>');
    h.push('</tbody></table></div>');

    // Échéancier
    h.push('<section class="doc-section"><h2>Conditions et échéancier de règlement</h2>');
    h.push('<table class="doc-mini"><thead><tr><th scope="col">Étape</th><th scope="col" class="num">Appel</th><th scope="col" class="num">Cumul</th><th scope="col" class="num">Montant ' + (res.autoliquidation ? 'HT' : 'TTC') + '</th>' +
      (res.retenue.active ? '<th scope="col" class="num">Net à régler</th>' : '') + '</tr></thead><tbody>');
    res.echeancier.forEach(e => {
      h.push('<tr><td>' + esc(e.libelle) + (e.mention ? '<div style="font-size:7.8pt;color:#555">' + esc(e.mention) + '</div>' : '') +
        (e.retenue_c ? '<div style="font-size:7.8pt;color:#555">dont retenue de garantie de ' + M.pourcent(res.retenue.taux_bp) + ' : ' + euros(e.retenue_c) + '</div>' : '') +
        '</td><td class="num">' + M.pourcent(e.part_bp) + '</td><td class="num">' + M.pourcent(e.cumul_bp) + '</td><td class="num">' + euros(e.montant_c) + '</td>' +
        (res.retenue.active ? '<td class="num">' + euros(e.payable_c) + '</td>' : '') + '</tr>');
    });
    if (res.retenue.active) h.push('<tr><td>Retenue de garantie, libérée un an après la réception</td><td class="num">—</td><td class="num">—</td><td class="num">—</td><td class="num">' + euros(res.retenue.montant_c) + '</td></tr>');
    h.push('<tr><th scope="row">Total</th><td></td><td class="num">100 %</td><td class="num"><strong>' + euros(res.echeancier.reduce((a, e) => a + e.montant_c, 0)) + '</strong></td>' +
      (res.retenue.active ? '<td class="num"><strong>' + euros(res.echeancier.reduce((a, e) => a + e.payable_c, 0) + res.retenue.montant_c) + '</strong></td>' : '') + '</tr>');
    h.push('</tbody></table>');
    h.push('<p>Modes de paiement : ' + esc(P.devis.modesPaiement) + ' Chaque échéance fait l\'objet d\'un appel de fonds ou d\'une facture, payable à réception.</p>');
    h.push('<p>' + esc(pro ? P.devis.penalitesPro : P.devis.penalitesParticulier) + '</p>');
    if (pro) h.push('<p>Indemnité forfaitaire pour frais de recouvrement due en cas de retard de paiement : ' + euros(P.devis.indemniteForfaitaire_c) + ' (art. L441-10 et D441-5 du Code de commerce). ' + esc(P.devis.escompte) + '</p>');
    if (res.retenue.active) {
      h.push('<p>Retenue de garantie de ' + M.pourcent(res.retenue.taux_bp) + ' du montant ' + (res.autoliquidation ? 'des travaux' : 'TTC') + ' (loi n° 71-584 du 16 juillet 1971), libérée un an après la réception des travaux, sauf réserves non levées' +
        (pr.cautionBancaire ? ' ; elle est remplacée par une caution personnelle et solidaire d\'un établissement financier.' : ' ; elle peut être remplacée par une caution bancaire.') + '</p>');
    }
    h.push('</section>');

    // Assurances
    const D = E.assuranceDecennale || {}, R = E.assuranceRcPro || {};
    h.push('<section class="doc-section"><h2>Assurances</h2>');
    h.push('<p>Assurance de responsabilité civile décennale : ' + ph(D.assureur, 'assureur décennal') + ', contrat n° ' + ph(D.contrat, 'n° de contrat décennale') +
      ', couverture géographique : ' + ph(D.couverture, 'couverture géographique') + '.</p>');
    if (!M.vide(R.assureur)) h.push('<p>Responsabilité civile professionnelle : ' + esc(R.assureur) + (M.vide(R.contrat) ? '' : ', contrat n° ' + esc(R.contrat)) + '.</p>');
    h.push('</section>');

    // Mentions
    h.push('<section class="doc-section doc-mentions"><h2>Mentions</h2>');
    h.push('<p>Les prix s\'entendent fournitures et main-d\'œuvre comprises, sauf mention contraire. Tout travail non prévu au présent devis fera l\'objet d\'un devis complémentaire ou d\'un avenant signé avant son exécution.</p>');
    if (res.tauxReduit && !res.autoliquidation) {
      const a55 = res.tva.some(t => t.bp === tauxReduitBp);
      h.push('<p><strong>Certification du client (taux réduit de TVA).</strong> Le client certifie que les travaux portent sur des locaux affectés à l\'habitation, achevés depuis plus de deux ans, ' +
        'qu\'ils n\'aboutissent pas à la production d\'un immeuble neuf au sens de l\'article 257 du CGI' +
        (a55 ? ', et que les travaux soumis au taux de 5,5 % sont des travaux d\'amélioration de la qualité énergétique au sens de l\'article 278-0 bis A du CGI' : '') +
        '. Il conserve un exemplaire du présent document. En cas de déclaration inexacte, il est solidairement tenu au paiement du complément de TVA.</p>');
    }
    if (ch.sousTraitance) h.push('<p>Travaux exécutés en sous-traitance au sens de la loi n° 75-1334 du 31 décembre 1975' + (M.vide(ch.maitreOuvrage) ? '' : ' ; maître d\'ouvrage : ' + esc(ch.maitreOuvrage)) + '.</p>');
    if (!pro) {
      const Me = E.mediateur || {};
      h.push('<p>En cas de litige, le client consommateur peut recourir gratuitement au médiateur de la consommation : ' + ph(Me.nom, 'nom du médiateur') + ', ' + ph(Me.site, 'site du médiateur') + ' (art. L612-1 du Code de la consommation).</p>');
    }
    const horsEtab = ch.horsEtablissement && !pro;
    if (horsEtab) {
      h.push('<p><strong>Droit de rétractation.</strong> Contrat conclu hors établissement : le client dispose d\'un délai de 14 jours à compter de la conclusion du contrat pour se rétracter, sans motif, ' +
        'au moyen du formulaire ci-annexé ou de toute autre déclaration dénuée d\'ambiguïté (art. L221-18 C. consom.). Aucun paiement ne peut être exigé avant l\'expiration d\'un délai de 7 jours ' +
        'à compter de la conclusion du contrat (art. L221-10). Si le client demande expressément que les travaux commencent avant la fin du délai de rétractation, il reste redevable, en cas de rétractation, ' +
        'd\'un montant proportionnel aux travaux exécutés jusqu\'à la communication de sa décision (art. L221-25).</p>');
    }
    if (!M.vide(pr.conditionsParticulieres)) h.push('<p><strong>Conditions particulières.</strong> ' + nl2br(pr.conditionsParticulieres) + '</p>');
    h.push('</section>');

    // Signatures
    h.push('<section class="doc-signatures"><div class="doc-bloc"><h2>L\'entreprise</h2><div>' + ph(E.raisonSociale, 'raison sociale') + '</div>' +
      '<div style="margin-top:2mm">Date, cachet et signature :</div></div>');
    h.push('<div class="doc-bloc"><h2>Le client — Bon pour accord</h2>');
    if (pro) h.push('<div>Nom et qualité du signataire :</div><div class="ligne-ecrite"></div>');
    h.push('<div>Date : ____ / ____ / ________</div>');
    h.push('<div style="margin-top:1.5mm">Signature précédée de la mention manuscrite « Devis reçu avant l\'exécution des travaux, bon pour accord »' + (pro ? ' et cachet' : '') + ' :</div>');
    if (horsEtab) h.push('<div style="margin-top:2mm;font-size:8pt"><span class="case-doc"></span>Je demande expressément que les travaux commencent avant la fin du délai de rétractation.</div>');
    h.push('</div></section>');

    // Annexe : formulaire de rétractation (modèle de l'annexe à l'article R221-1 C. consom.)
    if (horsEtab) {
      h.push('<section class="annexe"><h2>Annexe — Formulaire de rétractation</h2>');
      h.push('<p><em>Veuillez compléter et renvoyer le présent formulaire uniquement si vous souhaitez vous rétracter du contrat.</em></p>');
      h.push('<p>À l\'attention de ' + ph(E.raisonSociale, 'raison sociale') + ', ' + ph(E.adresse, 'adresse') + ', ' + ph(E.cp, 'code postal') + ' ' + ph(E.ville, 'ville') +
        (M.vide(E.email) ? '' : ', ' + esc(E.email)) + ' :</p>');
      h.push('<p>Je/Nous (*) vous notifie/notifions (*) par la présente ma/notre (*) rétractation du contrat portant sur la prestation de services ci-dessous :</p>');
      h.push('<p>Devis n° ' + ph(devis.numero, 'numéro de devis') + ' du ' + (M.dateValide(devis.date) ? M.dateFr(devis.date) : '') + '</p>');
      h.push('<p>Commandé le (*) / reçu le (*) :</p><div class="ligne-ecrite"></div>');
      h.push('<p>Nom du (des) consommateur(s) :</p><div class="ligne-ecrite"></div>');
      h.push('<p>Adresse du (des) consommateur(s) :</p><div class="ligne-ecrite"></div><div class="ligne-ecrite"></div>');
      h.push('<p>Signature du (des) consommateur(s) (uniquement en cas de notification du présent formulaire sur papier) :</p><div class="ligne-ecrite" style="height:16mm"></div>');
      h.push('<p>Date :</p><div class="ligne-ecrite"></div>');
      h.push('<p style="font-size:8pt">(*) Rayez la mention inutile.</p></section>');
    }
    h.push('</article>');
    return h.join('');
  }

  /* ---------- FACTURE (acompte ou solde) ---------- */
  // opts : { numero, emise (bool), conformite }
  function rendreFacture(cat, devis, brouillon, calc, opts) {
    opts = opts || {};
    const E = cat.entreprise || {};
    const P = cat.parametres;
    const PF = P.factures || {};
    const c = devis.client || {};
    const ch = devis.chantier || {};
    const pro = c.type === 'professionnel';
    const adr = M.adresseChantier(devis);
    const res = calc.res;
    const resDevis = calc.type === 'solde' ? calc.resDevis : calc.res;
    const acompte = calc.type === 'acompte';
    const ech = M.dateValide(brouillon.date) ? M.ajouterJours(brouillon.date, Math.max(0, parseInt(brouillon.delaiJours, 10) || 0)) : '';
    const h = [];

    h.push('<article class="feuille" lang="fr">');
    if (!opts.emise) h.push('<div class="filigrane" aria-hidden="true"><span>BROUILLON' + (opts.conformite && !opts.conformite.conforme ? '<br>NON CONFORME' : '') + '</span></div>');
    else if (E.demo) h.push('<div class="filigrane neutre" aria-hidden="true"><span>SPÉCIMEN</span></div>');

    h.push('<header class="doc-entete">' + emetteur(E) + '<div class="doc-titre"><h1 style="font-size:' + (acompte ? '16pt' : '22pt') + '">' + (acompte ? 'FACTURE D\'ACOMPTE' : 'FACTURE') + '</h1>');
    h.push('<table class="doc-meta"><tbody>');
    h.push('<tr><th scope="row">N°</th><td>' + (opts.numero ? esc(opts.numero) : '<span style="color:#8a4b00">attribué à l\'émission</span>') + '</td></tr>');
    h.push('<tr><th scope="row">Date</th><td>' + (M.dateValide(brouillon.date) ? M.dateFr(brouillon.date) : ph('', 'date d\'émission')) + '</td></tr>');
    h.push('<tr><th scope="row">Échéance</th><td>' + (ech ? M.dateFr(ech) : '—') + '</td></tr>');
    h.push('<tr><th scope="row">Devis</th><td>n° ' + ph(devis.numero, 'numéro de devis') + (M.dateValide(devis.date) ? ' du ' + M.dateFr(devis.date) : '') + '</td></tr>');
    h.push('</tbody></table></div></header>');

    h.push('<section class="doc-parties"><div class="doc-bloc"><h2>Client</h2>' + blocClient(c, pro) + '</div>');
    h.push('<div class="doc-bloc"><h2>Lieu d\'exécution des travaux</h2>');
    h.push('<div>' + ph(adr.adresse, 'adresse du chantier') + '<br>' + ph(adr.cp, 'code postal') + ' ' + ph(adr.ville, 'ville') + '</div>');
    if (ch.sousTraitance && !M.vide(ch.maitreOuvrage)) h.push('<div>Maître d\'ouvrage : ' + esc(ch.maitreOuvrage) + '</div>');
    if (acompte) h.push('<div style="margin-top:1.5mm">Acompte sur travaux' + (M.dateValide(brouillon.dateDebut) ? ' — démarrage prévu le <strong>' + M.dateFr(brouillon.dateDebut) + '</strong>' : '') + '</div>');
    else h.push('<div style="margin-top:1.5mm">Travaux réalisés ' + (M.dateValide(brouillon.dateDebut) ? 'du <strong>' + M.dateFr(brouillon.dateDebut) + '</strong> ' : '') +
      'au <strong>' + (M.dateValide(brouillon.dateFin) ? M.dateFr(brouillon.dateFin) : ph('', 'date d\'achèvement')) + '</strong></div>');
    h.push('<div>Nature de l\'opération : ' + esc(PF.natureOperation || 'Prestation de services') + '</div>');
    h.push('</div></section>');
    if (!M.vide(devis.objet)) h.push('<p class="doc-objet"><strong>Objet</strong> ' + esc(devis.objet) + '</p>');
    if (calc.autoliquidation) h.push('<div class="bandeau">Autoliquidation — TVA due par le preneur assujetti (article 283, 2 nonies du CGI). Montants exprimés hors taxes, aucune TVA facturée.</div>');

    if (acompte) {
      const e = calc.etape;
      const dejaTTC = (devis.factures || []).filter(f => f.type === 'acompte' && f.etape !== calc.indexEtape).reduce((a, f) => a + f.montants.ttc_c, 0);
      h.push('<table class="doc-table"><caption class="sr">Détail de l\'acompte</caption><thead><tr><th scope="col">Désignation</th><th scope="col" class="num">Taux TVA</th>' +
        '<th scope="col" class="num">Montant HT</th><th scope="col" class="num">TVA</th><th scope="col" class="num">Montant TTC</th></tr></thead><tbody>');
      h.push('<tr class="r-ligne r-entete-ouvrage"><td colspan="5"><div class="lib">Acompte n° ' + calc.numeroAcompte + ' — ' + esc(e.libelle) + '</div>' +
        '<div class="det">' + M.pourcent(e.part_bp) + ' du montant ' + (calc.autoliquidation ? 'HT' : 'TTC') + ' du devis n° ' + esc(devis.numero) + (M.dateValide(devis.date) ? ' du ' + M.dateFr(devis.date) : '') +
        ' (' + M.euros(resDevis.totalTTC_c) + ').' + (e.mention ? ' ' + esc(e.mention) + '.' : '') + '</div></td></tr>');
      calc.ventilation.forEach(v => h.push('<tr class="r-sous"><td class="des">— Travaux ' + (calc.autoliquidation ? 'en autoliquidation' : 'au taux de ' + M.pourcent(v.bp)) + '</td><td class="num">' +
        (calc.autoliquidation ? 'AL' : M.pourcent(v.bp)) + '</td><td class="num">' + euros(v.ht_c) + '</td><td class="num">' + euros(v.tva_c) + '</td><td class="num">' + euros(v.ttc_c) + '</td></tr>'));
      h.push('</tbody></table>');
      h.push('<div class="doc-bas"><div><table class="doc-mini"><caption>Suivi de facturation du devis</caption><tbody>' +
        '<tr><td>Montant du devis</td><td class="num">' + euros(resDevis.totalTTC_c) + '</td></tr>' +
        '<tr><td>Acomptes facturés précédemment</td><td class="num">' + euros(dejaTTC) + '</td></tr>' +
        '<tr><td>Présente facture</td><td class="num">' + euros(calc.totalTTC_c) + '</td></tr>' +
        '<tr><th scope="row">Reste à facturer</th><td class="num"><strong>' + euros(resDevis.totalTTC_c - dejaTTC - calc.totalTTC_c) + '</strong></td></tr></tbody></table></div>');
      h.push('<table class="doc-mini doc-totaux"><caption>Totaux</caption><tbody><tr><th scope="row">Total HT</th><td class="num">' + euros(calc.totalHT_c) + '</td></tr>');
      if (calc.autoliquidation) h.push('<tr><th scope="row">TVA</th><td class="num">Autoliquidation</td></tr>');
      else calc.ventilation.forEach(v => h.push('<tr><th scope="row">TVA ' + M.pourcent(v.bp) + '</th><td class="num">' + euros(v.tva_c) + '</td></tr>'));
      h.push('<tr class="ttc"><th scope="row">Total TTC</th><td class="num">' + euros(calc.totalTTC_c) + '</td></tr>');
      h.push('<tr class="net"><th scope="row">Net à payer' + (calc.autoliquidation ? ' HT' : ' TTC') + '</th><td class="num">' + euros(calc.netAPayer_c) + '</td></tr></tbody></table></div>');
    } else {
      h.push(tableTravaux(res));
      if (calc.ecarts.length) h.push('<p style="font-size:7.8pt;color:#555;margin:1mm 0 0">Quantités établies selon les travaux réellement exécutés (' + calc.ecarts.length + ' ligne(s) ajustée(s) par rapport au devis).</p>');
      h.push('<section class="doc-section"><h2>Décompte</h2><table class="doc-mini"><thead><tr><th scope="col"></th><th scope="col" class="num">HT</th><th scope="col" class="num">TVA</th><th scope="col" class="num">TTC</th></tr></thead><tbody>');
      h.push('<tr><th scope="row">Total des travaux réalisés</th><td class="num">' + euros(calc.totalTravauxHT_c) + '</td><td class="num">' + euros(calc.totalTravauxTVA_c) + '</td><td class="num">' + euros(calc.totalTravauxTTC_c) + '</td></tr>');
      calc.acomptes.forEach(f => h.push('<tr><td>Acompte facturé n° ' + esc(f.numero) + ' du ' + M.dateFr(f.date) + '</td><td class="num">' + moins(f.montants.ht_c) +
        '</td><td class="num">' + moins(f.montants.tva_c) + '</td><td class="num">' + moins(f.montants.ttc_c) + '</td></tr>'));
      h.push('<tr><th scope="row">Reste dû</th><td class="num">' + euros(calc.resteHT_c) + '</td><td class="num">' + euros(calc.resteTVA_c) + '</td><td class="num"><strong>' + euros(calc.resteTTC_c) + '</strong></td></tr>');
      if (calc.retenue.active) h.push('<tr><td>Retenue de garantie ' + M.pourcent(calc.retenue.taux_bp) + ' (libérable un an après la réception)</td><td></td><td></td><td class="num">' + moins(calc.retenue.montant_c) + '</td></tr>');
      h.push('</tbody></table></section>');
      h.push('<div class="doc-bas"><div><table class="doc-mini"><caption>TVA de la présente facture</caption><thead><tr><th scope="col">Taux</th><th scope="col" class="num">Base HT</th><th scope="col" class="num">TVA</th></tr></thead><tbody>');
      if (calc.autoliquidation) h.push('<tr><td>Autoliquidation</td><td class="num">' + euros(calc.resteHT_c) + '</td><td class="num">' + euros(0) + '</td></tr>');
      else calc.ventilation.forEach(v => h.push('<tr><td>' + M.pourcent(v.bp) + '</td><td class="num">' + euros(v.resteHT_c) + '</td><td class="num">' + euros(v.resteTVA_c) + '</td></tr>'));
      h.push('</tbody></table></div><table class="doc-mini doc-totaux"><caption>Totaux</caption><tbody>');
      h.push('<tr><th scope="row">Reste dû HT</th><td class="num">' + euros(calc.resteHT_c) + '</td></tr>');
      h.push('<tr><th scope="row">TVA</th><td class="num">' + (calc.autoliquidation ? 'Autoliquidation' : euros(calc.resteTVA_c)) + '</td></tr>');
      h.push('<tr class="ttc"><th scope="row">Reste dû' + (calc.autoliquidation ? '' : ' TTC') + '</th><td class="num">' + euros(calc.resteTTC_c) + '</td></tr>');
      if (calc.retenue.active) h.push('<tr><th scope="row">Retenue de garantie</th><td class="num">' + moins(calc.retenue.montant_c) + '</td></tr>');
      h.push('<tr class="net"><th scope="row">Net à payer' + (calc.autoliquidation ? ' HT' : ' TTC') + '</th><td class="num">' + euros(calc.netAPayer_c) + '</td></tr></tbody></table></div>');
    }

    // Règlement
    h.push('<section class="doc-section"><h2>Règlement</h2>');
    h.push('<p><strong>Date d\'échéance : ' + (ech ? M.dateFr(ech) : '—') + '</strong>' + ((parseInt(brouillon.delaiJours, 10) || 0) === 0 ? ' (paiement à réception de la facture)' : '') + '.</p>');
    h.push('<p>Modes de paiement : ' + esc(P.devis.modesPaiement) + (M.vide(E.iban) ? '' : ' IBAN : ' + esc(E.iban) + '.') + '</p>');
    h.push('<p>' + esc(pro ? P.devis.penalitesPro : P.devis.penalitesParticulier) + '</p>');
    if (pro) h.push('<p>Indemnité forfaitaire pour frais de recouvrement due en cas de retard de paiement : ' + euros(P.devis.indemniteForfaitaire_c) + ' (art. L441-10 et D441-5 du Code de commerce). ' + esc(P.devis.escompte) + '</p>');
    if (!acompte && calc.retenue.active) h.push('<p>Retenue de garantie de ' + M.pourcent(calc.retenue.taux_bp) + ' (loi n° 71-584 du 16 juillet 1971), libérée un an après la réception des travaux, sauf réserves non levées' +
      ((devis.parametres || {}).cautionBancaire ? ' ; elle est remplacée par une caution bancaire.' : '.') + '</p>');
    h.push('</section>');

    // Mentions
    h.push('<section class="doc-section doc-mentions"><h2>Mentions</h2>');
    if (brouillon.optionDebits) h.push('<p>Option pour le paiement de la taxe d\'après les débits.</p>');
    if (resDevis.tauxReduit && !calc.autoliquidation) h.push('<p>Taux réduit de TVA appliqué au vu de la certification du client portée sur le devis n° ' + esc(devis.numero) + ' (art. 279-0 bis et 278-0 bis A du CGI).</p>');
    if (ch.sousTraitance) h.push('<p>Travaux exécutés en sous-traitance au sens de la loi n° 75-1334 du 31 décembre 1975' + (M.vide(ch.maitreOuvrage) ? '' : ' ; maître d\'ouvrage : ' + esc(ch.maitreOuvrage)) + '.</p>');
    const D = E.assuranceDecennale || {};
    h.push('<p>Assurance de responsabilité civile décennale : ' + ph(D.assureur, 'assureur décennal') + ', contrat n° ' + ph(D.contrat, 'n° de contrat') + ', couverture géographique : ' + ph(D.couverture, 'couverture géographique') + '.</p>');
    if (!pro) {
      const Me = E.mediateur || {};
      h.push('<p>Médiateur de la consommation : ' + ph(Me.nom, 'nom du médiateur') + ', ' + ph(Me.site, 'site du médiateur') + '.</p>');
    }
    h.push('</section></article>');
    return h.join('');
  }

  // Texte du pied de page imprimé (marge @page bas gauche)
  function piedDePage(cat, devis, libelle) {

<script id="app">

      case 'compo': return (v || []).map(c => c.code + ' × ' + String(c.ratio).replace('.', ',')).join(' ; ');

        const n = M.versEntier(s.replace(/€/g, ''), 2);

      case 'nombre': {
        if (s === '') return { ok: true, v: '' };

      }

  /* ---------------- Fabriques de champs ---------------- */

  }

  function evaluer(expr) {
    const neg = expr.startsWith('!');

    let r;

  function majVisibilite() { $$('[data-si]').forEach(el => { el.hidden = !el.dataset.si.split('&').every(evaluer); }); }

  /* ---------------- Saisie générique ---------------- */
  function surSaisie(ev) {

  function majInfos() {

        '<p>' + n + ' mention' + (n > 1 ? 's' : '') + ' obligatoire' + (n > 1 ? 's' : '') + ' manque' + (n > 1 ? 'nt' : '') + (onglets.length === 1 ? ', ' + (n > 1 ? 'toutes' : '') + ' dans ' + libOnglet[premier.onglet] : '') + '.</p><ul>' +

    z.innerHTML = '<table class="t"><thead><tr><th scope="col">Lot</th><th scope="col">Pénibilité</th><th scope="col">Coef. d\'accessibilité</th></tr></thead><tbody>' +
      etat.catalogue.lots.map(l => '<tr><td>' + esc(l.libelle) + '</td><td><select data-bind="devis.surchargesLots.' + l.code + '.penibilite" data-type="nombre">' +
        '<option value="">Globale</option>' + P.penibilite.map(p => '<option value="' + p.niveau + '">' + p.niveau + ' — ' + esc(p.libelle) + '</option>').join('') +
        '</select></td><td><input type="text" data-bind="devis.surchargesLots.' + l.code + '.accessibilite" data-type="nombre" placeholder="Globale" inputmode="decimal"></td></tr>').join('') +
      '</tbody></table><p class="note">Exemple : une salle de bains exiguë passe le lot carrelage en pénibilité 3 sans toucher aux autres lots. Le coefficient d\'accessibilité saisi remplace tous les facteurs d\'accès pour ce lot.</p>';
    remplirFormulaires(z);
  }

  const OPT_MODE = [['', 'Mode du catalogue'], ['unite', 'Prix unitaire'], ['forfait', 'Forfait'], ['horaire', 'Taux horaire']];
  function options(liste, val) { return liste.map(([v, l]) => '<option value="' + esc(v) + '"' + (String(val === null || val === undefined ? '' : val) === String(v) ? ' selected' : '') + '>' + esc(l) + '</option>').join(''); }

  /* Tableau de saisie groupé : Lot > Sous-lot > lignes, comme le devis imprimé.
     Les lots et sous-lots se replient ; chaque ligne a un panneau « Réglages » dépliable. */
  const replies = new Set();   // codes de lots / sous-lots repliés (le temps de la session)
  const ouverts = new Set();   // identifiants de lignes dont les réglages sont dépliés
  let signatureLignes = null;
  const parId = id => document.getElementById(id);
  const pl = n => (n > 1 ? 's' : '');
  function chevron(ouvert) {
    return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="' +
      (ouvert ? 'M6 9l6 6 6-6' : 'M9 6l6 6-6 6') + '"/></svg>';
  }
  function signature(r) {
    if (!r) return '';
    return r.structure.map(l => l.code + ':' + l.sousLots.map(x => x.code + '=' + x.lignes.map(y => y.id + '/' + y.mode + '/' + y.unite).join(',')).join(';')).join('|') +
      '#' + r.lignes.filter(x => x.invalide).map(x => x.id).join(',') + '#' + (r.deplacement.doc ? 'd' : '') + r.deplacement.mode +
      '#' + Array.from(replies).join(',') + '#' + Array.from(ouverts).join(',') + '#' + JSON.stringify(etat.devis.surchargesLots || {});
  }
  function libelleLigne(r, l) {
    if (r.invalide) return 'Ouvrage introuvable dans le catalogue : ' + (l.ouvrage || '');
    return l.libre ? l.libre.libelle : r.ouvrage.libelle;
  }

  function rangeeLigne(r, i) {
    const cat = etat.catalogue, l = etat.devis.lignes[i], id = l.id;
    const o = r.invalide ? null : r.ouvrage;
    const mode = r.mode || l.mode || 'unite';
    const ouvert = ouverts.has(id);
    const badge = mode === 'forfait' ? ' <span class="badge-mode">Forfait</span>' : mode === 'horaire' ? ' <span class="badge-mode">Au temps passé</span>' : '';
    let h = '<tr class="ligne-saisie" data-i="' + i + '" id="lg-' + esc(id) + '">' +
      '<td class="des"><div class="libelle"><span id="lib-' + esc(id) + '">' + esc(libelleLigne(r, l)) + '</span>' + badge + '</div>' +
      '<div class="meta"><span class="code">' + esc(l.libre ? 'Ligne libre' : (l.ouvrage || '')) + '</span><span id="tva-' + esc(id) + '"></span></div>' +
      '<div class="det" id="cpl-' + esc(id) + '"' + (M.vide(l.complement) ? ' hidden' : '') + '>' + esc(l.complement || '') + '</div>' +
      '<div class="msg" id="msg-' + esc(id) + '"></div></td>' +
      '<td class="c-u">' + esc(r.unite || '') + '</td>' +
      '<td class="num c-q"><input type="text" data-l="qte" value="' + esc(l.qte) + '" inputmode="decimal" aria-label="Quantité : ' + esc(libelleLigne(r, l)) + '"' +
      (mode === 'horaire' ? ' title="Nombre d\'heures estimé"' : '') + '></td>' +
      '<td class="num c-pu" id="pu-' + esc(id) + '"></td><td class="num c-t" id="tot-' + esc(id) + '"></td>' +
      '<td class="c-a"><div class="actions-ligne">' +
      '<button type="button" class="icone" data-act="reglages" aria-expanded="' + ouvert + '" aria-controls="ed-' + esc(id) + '" title="Réglages de la ligne" aria-label="Réglages de la ligne">' +
      '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h10"/><path d="M18 6h2"/><circle cx="16" cy="6" r="2"/><path d="M4 12h4"/><path d="M12 12h8"/><circle cx="10" cy="12" r="2"/><path d="M4 18h12"/><path d="M20 18h0"/><circle cx="18" cy="18" r="2"/></svg></button>' +
      '<button type="button" class="icone" data-act="haut" title="Monter dans le sous-lot" aria-label="Monter">↑</button>' +
      '<button type="button" class="icone" data-act="bas" title="Descendre dans le sous-lot" aria-label="Descendre">↓</button>' +
      '<button type="button" class="icone" data-act="dup" title="Dupliquer" aria-label="Dupliquer">⧉</button>' +
      '<button type="button" class="icone" data-act="suppr" title="Supprimer" aria-label="Supprimer">✕</button></div></td></tr>';
    if (!r.invalide && mode === 'forfait') {
      const inc = r.details.find(d => d.type === 'inclus'), exc = r.details.find(d => d.type === 'exclus');
      if (inc || exc) {
        h += '<tr class="r-forfait" data-i="' + i + '"><td colspan="6"><div class="encadre-forfait">' +
          '<div><span class="t-inc">Comprend</span>' + (inc ? inc.items.map(x => '<span>' + esc(x) + '</span>').join('') : '<span>—</span>') + '</div>' +
          '<div><span class="t-exc">Ne comprend pas</span>' + (exc ? exc.items.map(x => '<span>' + esc(x) + '</span>').join('') : '<span>Rien de précisé</span>') + '</div></div></td></tr>';
      }
    }
    // Panneau de réglages
    const tousSl = [];
    cat.lots.forEach(lt => lt.sousLots.forEach(x => tousSl.push([x.code, lt.libelle + ' › ' + x.libelle])));
    const T = cat.parametres.tva;
    const optTva = [['auto', 'Automatique'], [String(T.normal), String(T.normal).replace('.', ',') + ' %'], [String(T.intermediaire), String(T.intermediaire).replace('.', ',') + ' %'], [String(T.reduit), String(T.reduit).replace('.', ',') + ' %']];
    const optUnite = [['', 'Automatique']].concat(M.UNITES.map(u => [u, u]));
    h += '<tr class="r-edition" data-i="' + i + '" id="ed-' + esc(id) + '"' + (ouvert ? '' : ' hidden') + '><td colspan="6"><div class="edition-ligne">' +
      '<label class="champ"><span>Mode de chiffrage</span><select data-l="mode">' + options(OPT_MODE, l.mode || '') + '</select></label>' +
      '<label class="champ"><span>Unité affichée</span><select data-l="unite">' + options(optUnite, l.unite || '') + '</select></label>' +
      '<label class="champ"><span>TVA</span><select data-l="tva">' + options(optTva, l.tva || 'auto') + '</select></label>' +
      '<label class="champ large"><span>Précision imprimée sous le libellé</span><input type="text" data-l="complement" value="' + esc(l.complement || '') + '" placeholder="facultatif"></label>';
    if (mode === 'horaire' && ((o && (o.fournitures || []).length) || (l.libre && l.libre.paFournitures_c))) {
      h += '<label class="champ"><span>Quantité de fournitures (en ' + esc(o ? o.unite : l.libre.unite) + ')</span><input type="text" data-l="qteFourn" value="' + esc(l.qteFourn || '') + '"></label>';
    }
    if (l.libre) {
      const L = l.libre;
      h += '<label class="champ large"><span>Libellé de la ligne libre</span><textarea data-l="libre.libelle" rows="2">' + esc(L.libelle) + '</textarea></label>' +
        '<label class="champ"><span>Sous-lot</span><select data-l="libre.sousLot">' + options(tousSl, L.sousLot) + '</select></label>' +
        '<label class="champ"><span>Unité</span><select data-l="libre.unite">' + options(M.UNITES.map(u => [u, u]), L.unite) + '</select></label>' +
        '<label class="champ"><span>Temps unitaire (h)</span><input type="text" data-l="libre.tempsUnitaire_h" data-t="nombre" value="' + esc(formater('nombre', L.tempsUnitaire_h)) + '"></label>' +
        '<label class="champ"><span>Fournitures, achat HT (€/unité)</span><input type="text" data-l="libre.paFournitures_c" data-t="euros" value="' + esc(formater('euros', L.paFournitures_c)) + '"></label>' +
        '<label class="case" style="align-self:end"><input type="checkbox" data-l="libre.eligible55"' + (L.eligible55 ? ' checked' : '') + '><span>Éligible 5,5 %</span></label>' +
        '<label class="champ large"><span>Contenu compris (une ligne par élément, obligatoire pour un forfait)</span><textarea data-l="libre.inclus" rows="2">' + esc(L.inclus) + '</textarea></label>' +
        '<label class="champ large"><span>Non compris</span><textarea data-l="libre.exclus" rows="1">' + esc(L.exclus) + '</textarea></label>';
    }
    h += '</div></td></tr>';
    return h;
  }

  function rendreLignes() {
    const t = $('#table-lignes');
    if (!t) return;
    try { res = M.calculer(etat.catalogue, etat.devis); erreurCalcul = null; } catch (e) { erreurCalcul = e; }
    const lignes = etat.devis.lignes;
    const nbLots = res ? res.structure.length : 0;
    $('#nb-lignes').textContent = lignes.length + ' ligne' + pl(lignes.length) + ' · ' + nbLots + ' lot' + pl(nbLots) + ' · rangées comme sur le devis imprimé';
    if (!lignes.length || !res) {
      t.innerHTML = '<tbody><tr><td class="vide">Aucune ligne pour l\'instant. Tapez un mot dans la recherche ci-dessus (« prise », « parquet », « WC »…) ou chargez un jeu de test.</td></tr></tbody>';
      signatureLignes = signature(res);
      return;
    }
    const index = new Map(lignes.map((l, i) => [l.id, i]));
    const P = etat.catalogue.parametres;
    let h = '<caption class="sr">Lignes du devis rangées par lot et sous-lot</caption><thead><tr><th scope="col">Désignation</th><th scope="col" class="c-u">Unité</th>' +
      '<th scope="col" class="num c-q">Qté</th><th scope="col" class="num c-pu">PU HT</th><th scope="col" class="num c-t">Total HT</th><th scope="col" class="c-a"><span class="sr">Actions</span></th></tr></thead>';
    res.structure.forEach(lot => {
      const ouvertLot = !replies.has(lot.code);
      const nb = lot.sousLots.reduce((a, x) => a + x.lignes.length, 0);
      const sur = (etat.devis.surchargesLots || {})[lot.code] || {};
      let pastilles = '';
      if (!M.vide(sur.penibilite)) pastilles += '<span class="pastille-lot">Pénibilité propre au lot : niveau ' + esc(sur.penibilite) + '</span>';
      if (!M.vide(sur.accessibilite)) pastilles += '<span class="pastille-lot">Accès propre au lot ×' + M.coef(M.versEntier(sur.accessibilite, 4)) + '</span>';
      h += '<tbody class="g-lot"><tr class="r-lot-saisie"><th colspan="6" scope="rowgroup"><div class="tete-lot">' +
        '<button type="button" class="repli" data-repli="' + esc(lot.code) + '" aria-expanded="' + ouvertLot + '" aria-label="' + (ouvertLot ? 'Replier' : 'Déplier') + ' le lot ' + esc(lot.libelle) + '">' + chevron(ouvertLot) + '</button>' +
        '<span class="nom-lot">Lot ' + lot.numero + ' · ' + esc(lot.libelle) + '</span>' +
        '<span class="ref-lot">' + esc(lot.reference ? lot.reference + ' · ' : '') + nb + ' ligne' + pl(nb) + '</span>' + pastilles +
        '<span class="total-lot" id="tl-' + esc(lot.code) + '">' + M.euros(lot.total_c) + '</span></div></th></tr>';
      if (ouvertLot) lot.sousLots.forEach(sl => {
        const ouvertSl = !replies.has(sl.code);
        h += '<tr class="r-sl-saisie"><th colspan="6" scope="rowgroup"><div class="tete-sl">' +
          '<button type="button" class="repli petit" data-repli="' + esc(sl.code) + '" aria-expanded="' + ouvertSl + '" aria-label="' + (ouvertSl ? 'Replier' : 'Déplier') + ' le sous-lot ' + esc(sl.libelle) + '">' + chevron(ouvertSl) + '</button>' +
          '<span class="nom-sl">' + esc(sl.libelle) + '</span><span class="nb">' + sl.lignes.length + ' ligne' + pl(sl.lignes.length) + '</span>' +
          '<span class="total-sl" id="tsl-' + esc(sl.code) + '">' + M.euros(sl.total_c) + '</span></div></th></tr>';
        if (ouvertSl) sl.lignes.forEach(r => { h += rangeeLigne(r, index.get(r.id)); });
      });
      h += '</tbody>';
    });
    const invalides = res.lignes.filter(r => r.invalide);
    if (invalides.length) {
      h += '<tbody class="g-lot"><tr class="r-lot-saisie ko"><th colspan="6" scope="rowgroup"><div class="tete-lot"><span class="nom-lot">Lignes à corriger</span>' +
        '<span class="ref-lot">' + invalides.length + ' ligne' + pl(invalides.length) + ' hors du devis tant qu\'elles ne sont pas corrigées</span></div></th></tr>' +
        invalides.map(r => rangeeLigne(r, index.get(r.id))).join('') + '</tbody>';
    }
    const d = res.deplacement;
    if (d.doc || (d.mode === 'majoration' && d.majoration_bp > 0)) {
      h += '<tbody><tr class="r-dep-saisie"><td colspan="6"><div class="tete-dep"><b>Frais de déplacement</b><span id="dep-detail"></span>' +
        '<span class="total-sl" id="dep-total"></span></div></td></tr></tbody>';
    }
    h += '<tfoot><tr><td colspan="4">Total HT du devis' + (d.doc ? ', déplacement compris' : '') + '</td><td class="num" id="tot-lignes"></td><td></td></tr></tfoot>';
    t.innerHTML = h;
    signatureLignes = signature(res);
  }

  function surLigne(ev) {
    const el = ev.target;
    if (!el.dataset || !el.dataset.l) return;
    const discret = el.type === 'checkbox' || el.tagName === 'SELECT';
    if ((ev.type === 'input') === discret) return;
    const porteur = el.closest('[data-i]');
    if (!porteur) return;
    const i = Number(porteur.dataset.i);
    const l = etat.devis.lignes[i];
    const champ = el.dataset.l;
    let v = el.type === 'checkbox' ? el.checked : el.value;
    if (el.dataset.t) {
      const r = analyser(el.dataset.t, v, el);
      el.classList.toggle('invalide', !r.ok);
      if (!r.ok) return;
      v = el.dataset.t === 'euros' && r.v === null ? 0 : r.v;
    }
    if (champ === 'qte') el.classList.toggle('invalide', !(M.versEntier(v, 3) > 0));
    if (champ.startsWith('libre.')) l.libre[champ.slice(6)] = v;
    else l[champ] = (v === '' && (champ === 'mode' || champ === 'unite')) ? null : v;
    if (champ === 'mode' && l.libre) l.libre.mode = v || 'unite';
    if (champ === 'complement') { const c = parId('cpl-' + l.id); if (c) { c.textContent = v; c.hidden = M.vide(v); } }
    if (champ === 'libre.libelle') { const c = parId('lib-' + l.id); if (c) c.textContent = v; }
    if (champ === 'mode' || champ === 'unite' || champ === 'libre.sousLot' || champ === 'libre.unite') rendreLignes();
    majCalcul();
  }

  function surActionLigne(ev) {
    const rp = ev.target.closest('[data-repli]');
    if (rp) {
      const code = rp.dataset.repli;
      if (replies.has(code)) replies.delete(code); else replies.add(code);
      rendreLignes(); majLignes();
      const b = document.querySelector('[data-repli="' + code + '"]'); if (b) b.focus();
      return;
    }
    const b = ev.target.closest('[data-act]');
    if (!b) return;
    const i = Number(b.closest('[data-i]').dataset.i);
    const L = etat.devis.lignes, id = L[i].id;
    const act = b.dataset.act;
    if (act === 'reglages') {
      const ouvre = !ouverts.has(id);
      if (ouvre) ouverts.add(id); else ouverts.delete(id);
      const ed = parId('ed-' + id); if (ed) ed.hidden = !ouvre;
      b.setAttribute('aria-expanded', String(ouvre));
      signatureLignes = signature(res);
      if (ouvre && ed) { const f = ed.querySelector('select, input, textarea'); if (f) f.focus(); }
      return;
    }
    if (act === 'suppr') { L.splice(i, 1); ouverts.delete(id); }
    if (act === 'dup') { const c = clone(L[i]); c.id = idLigne(); L.splice(i + 1, 0, c); }
    if (act === 'haut' || act === 'bas') {
      // échange avec la ligne voisine du même sous-lot (ordre d'affichage)
      const r = res && res.lignes.find(x => x.id === id);
      const groupe = r && !r.invalide ? res.valides.filter(x => x.sousLot === r.sousLot).map(x => x.id) : [];
      const k = groupe.indexOf(id), voisin = groupe[act === 'haut' ? k - 1 : k + 1];
      if (voisin) { const j = L.findIndex(x => x.id === voisin); [L[i], L[j]] = [L[j], L[i]]; }
    }
    rendreLignes(); majCalcul();
    const apres = parId('lg-' + id); if (apres) { const bb = apres.querySelector('[data-act="' + act + '"]'); if (bb && act !== 'suppr') bb.focus(); }
  }

  function majLignes() {
    if (!res || !$('#table-lignes')) return;
    if (signature(res) !== signatureLignes) rendreLignes();
    const multiTaux = res.tva.length > 1;
    res.lignes.forEach(r => {
      const id = r.id;
      const tr = parId('lg-' + id);
      if (!tr) return;
      const pu = parId('pu-' + id), tot = parId('tot-' + id), msg = parId('msg-' + id), tv = parId('tva-' + id);
      if (r.invalide) { pu.textContent = '—'; tot.textContent = '—'; }
      else {
        const unit = r.mode === 'horaire' ? r.puMO : (r.mode === 'forfait' ? r.docs.reduce((a, x) => a + x.total_c, 0) : r.PU);
        pu.innerHTML = M.euros(unit) + (r.mode === 'horaire' ? '<span class="code"> / h</span>' : '');
        pu.title = 'Fournitures ' + M.euros(r.PVu) + ' + main-d\'œuvre ' + M.euros(r.puMO) + ' par unité, coefficients du chantier compris';
        tot.textContent = M.euros(r.total_c);
        if (tv) tv.textContent = r.tva.autoliquidation ? ' · autoliquidation' : (multiTaux || r.tva.force ? ' · TVA ' + M.pourcent(r.tva.bp) + (r.tva.force ? ' (forcée)' : '') : '');
      }
      msg.innerHTML = r.erreurs.map(e => '<div>⛔ ' + esc(e) + '</div>').join('') + (r.avertissements || []).map(e => '<div class="av">⚠ ' + esc(e) + '</div>').join('');
      tr.classList.toggle('ligne-ko', r.erreurs.length > 0);
      tr.classList.toggle('ligne-av', !r.erreurs.length && (r.avertissements || []).length > 0);
    });
    res.structure.forEach(lot => {
      const tl = parId('tl-' + lot.code); if (tl) tl.textContent = M.euros(lot.total_c);
      lot.sousLots.forEach(sl => { const ts = parId('tsl-' + sl.code); if (ts) ts.textContent = M.euros(sl.total_c); });
    });
    const d = res.deplacement, dd = parId('dep-detail'), dt = parId('dep-total');
    if (dd) dd.textContent = d.doc ? d.zone.libelle + ' · ' + d.jours + ' jour' + pl(d.jours) + ' × ' + M.euros(d.forfaitJour_c) : d.zone.libelle + ' · majoration de ' + M.pourcent(d.majoration_bp) + ' intégrée à la main-d\'œuvre';
    if (dt) dt.textContent = d.doc ? M.euros(d.total_c) : 'inclus';
    const tl = $('#tot-lignes');
    if (tl) tl.textContent = M.euros(res.totalHT_c);
  }

  /* ---------------- Onglet « Récapitulatif interne » ---------------- */
  const pct = x => (x === null || x === undefined || !isFinite(x)) ? '—' : (x * 100).toFixed(2).replace('.', ',') + '\u00A0%';
  const ratioTxt = x => (x === null || x === undefined || !isFinite(x)) ? '—' : x.toFixed(4).replace('.', ',');

  function rendreInterne() {
    const z = $('#onglet-interne');
    if (!res) { z.innerHTML = '<div class="carte">Calcul indisponible.</div>'; return; }
    const I = res.interne, T = I.total, mg = I.marge;
    const eur = M.euros;
    let h = entete('interne', 'Coûts, marges et coefficients : jamais imprimés sur le devis client') + '<div class="note erreur no-print"><b>Document interne.</b> Prix d\'achat, marges et coefficients ne figurent jamais sur le devis client et cet onglet n\'est pas imprimé avec lui.</div>';
    h += '<div class="carte"><h2>Synthèse</h2><table class="t"><tbody>' +
      '<tr><th scope="row">Chiffre d\'affaires HT du devis</th><td class="num">' + eur(res.totalHT_c) + '</td><th scope="row">Heures brutes / ajustées</th><td class="num">' + M.quantite(T.heuresBrutes_mh) + ' h / ' + M.quantite(T.heuresAj_mh) + ' h</td></tr>' +
      '<tr><th scope="row">Coût d\'achat des fournitures</th><td class="num">' + eur(T.fournPA_c) + '</td><th scope="row">Durée estimée</th><td class="num">' + res.jours + ' jour(s) · ' + res.compagnons + ' compagnon(s)</td></tr>' +
      '<tr><th scope="row">Prix de vente des fournitures</th><td class="num">' + eur(T.fournPV_c) + '</td><th scope="row">Main-d\'œuvre vendue</th><td class="num">' + eur(T.mo_c) + '</td></tr>' +
      '<tr><th scope="row">Marge sur fournitures</th><td class="num">' + eur(T.margeFourn_c) + '</td><th scope="row">Coût estimé de la main-d\'œuvre</th><td class="num">' + eur(T.coutMO_c) + '</td></tr>' +

      '</tbody></table><p class="note hypothese">Piège classique : un coefficient de 1,30 ne donne pas 30 % de marge sur le prix de vente, mais 23,08 %. Pour 30 % de taux de marque, il faut un coefficient de 1,4286. Les écarts entre paramètre et réel viennent des surcharges par famille ou fourniture et des arrondis au centime.</p></div>';

    h += '<div class="carte"><h2>Par lot</h2><div class="defile"><table class="t"><thead><tr><th scope="col">Lot</th><th scope="col" class="num">Achat fournitures</th><th scope="col" class="num">Vente fournitures</th>' +
      '<th scope="col" class="num">Marge fourn.</th><th scope="col" class="num">Taux de marque</th><th scope="col" class="num">MO vendue</th><th scope="col" class="num">Coût MO</th><th scope="col" class="num">Marge MO</th>' +
      '<th scope="col" class="num">Marge brute</th><th scope="col" class="num">% du lot</th><th scope="col" class="num">Heures aj.</th></tr></thead><tbody>' +

        '</td><td class="num">' + pct(l.fournPV_c ? l.margeFourn_c / l.fournPV_c : null) + '</td><td class="num">' + eur(l.mo_c) + '</td><td class="num">' + eur(l.coutMO_c) + '</td><td class="num">' + eur(l.margeMO_c) +
        '</td><td class="num"><b>' + eur(l.margeBrute_c) + '</b></td><td class="num">' + pct(l.total_c ? l.margeBrute_c / l.total_c : null) + '</td><td class="num">' + M.quantite(l.heuresAj_mh) + '</td></tr>').join('') +
      '</tbody><tfoot><tr><td>Total</td><td class="num">' + eur(T.fournPA_c) + '</td><td class="num">' + eur(T.fournPV_c) + '</td><td class="num">' + eur(T.margeFourn_c) + '</td><td class="num">' + pct(mg.tauxMarqueReel) +
      '</td><td class="num">' + eur(T.mo_c) + '</td><td class="num">' + eur(T.coutMO_c) + '</td><td class="num">' + eur(T.margeMO_c) + '</td><td class="num">' + eur(T.margeBrute_c) + '</td><td class="num">' +
      pct(T.total_c ? T.margeBrute_c / T.total_c : null) + '</td><td class="num">' + M.quantite(T.heuresAj_mh) + '</td></tr></tfoot></table></div></div>';

    h += '<div class="carte"><h2>Coefficients appliqués à la main-d\'œuvre</h2><p class="note">MO ligne = quantité × temps unitaire × taux horaire du métier × coef. région × coef. pénibilité × coef(s) accessibilité' +
      (res.deplacement.mode === 'majoration' ? ' × majoration de déplacement' : '') + '. Ces coefficients sont intégrés aux prix unitaires du devis client et n\'y apparaissent pas en clair.</p>' +
      '<table class="t"><thead><tr><th scope="col">Lot</th><th scope="col">Région</th><th scope="col">Pénibilité</th><th scope="col">Accessibilité</th>' +
      (res.deplacement.mode === 'majoration' ? '<th scope="col">Déplacement</th>' : '') + '<th scope="col" class="num">Coef. prix total</th><th scope="col" class="num">Coef. temps</th></tr></thead><tbody>' +
      I.lots.map(l => {
        const f = l.facteurs;
        return '<tr><td>' + esc(l.libelle) + '</td><td>' + res.region.facteurs.map(x => esc(x.libelle) + ' ×' + M.coef(x.entier)).join('<br>') + '</td><td>' + f.penibilite.niveau + ' — ' + esc(f.penibilite.libelle) +
          ' ×' + M.coef(f.penibilite.entier) + (f.penibilite.surcharge ? ' <span class="tag bleu">lot</span>' : '') + '</td><td>' +
          (f.accessibilite.map(a => esc(a.libelle) + ' ×' + M.coef(a.entier)).join('<br>') || 'aucune') + (f.accSurcharge ? ' <span class="tag bleu">lot</span>' : '') + '</td>' +
          (res.deplacement.mode === 'majoration' ? '<td>×' + M.coef(10000 + res.deplacement.majoration_bp) + '</td>' : '') +

      }).join('') + '</tbody></table>' +
      '<h3>Déplacements</h3><p>' + res.deplacement.km + ' km · ' + esc(res.deplacement.zone.libelle) + ' · ' + res.jours + ' jour(s) = ceil(' + M.quantite(res.heuresAj_mh) + ' h ÷ (' +
      M.quantite(res.heuresParJour_mh) + ' h × ' + res.compagnons + ')) · ' + (res.deplacement.mode === 'forfait' ? 'forfait de ' + eur(res.deplacement.forfaitJour_c) + ' par jour → ' + eur(res.deplacement.total_c) + ' HT'
        : 'majoration de ' + M.pourcent(res.deplacement.majoration_bp) + ' sur la main-d\'œuvre') + '</p></div>';

    h += '<div class="carte"><details><summary><b>Détail ligne par ligne</b> (' + res.valides.length + ' lignes)</summary><div class="defile" style="margin-top:8px"><table class="t"><thead><tr>' +
      '<th scope="col">N°</th><th scope="col">Code</th><th scope="col" class="num">Qté</th><th scope="col" class="num">PA fourn./u</th><th scope="col" class="num">PV fourn./u</th><th scope="col" class="num">MO/u</th>' +
      '<th scope="col" class="num">Total HT</th><th scope="col" class="num">Heures aj.</th><th scope="col" class="num">Coût MO</th></tr></thead><tbody>' +
      res.valides.map(l => '<tr><td>' + (l.numero || '') + '</td><td class="code">' + esc(l.ouvrage.code) + '</td><td class="num">' + M.quantite(l.q_m) + '</td><td class="num">' + eur(l.PAu) +
        '</td><td class="num">' + eur(l.PVu) + '</td><td class="num">' + eur(l.puMO) + '</td><td class="num">' + eur(l.total_c) + '</td><td class="num">' + M.quantite(l.heuresAj_mh) +
        '</td><td class="num">' + eur(l.coutMO_c) + '</td></tr>').join('') + '</tbody></table></div></details></div>';
    z.innerHTML = h;
