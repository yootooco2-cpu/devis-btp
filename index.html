  --trait-leger: #EEEBE5;
  --trait-fort: #CFC9BE;
  --accent: #B8430E;
  --accent-clair: #FBEDE4;
  --ok: #1E6B42;
  --ok-clair: #E5F2EA;
  --alerte: #7A4A00;
  --alerte-clair: #FFF2D9;
  --erreur: #A3241C;
  --erreur-clair: #FBE9E7;
  --rail: #1A1D21;
  --rail-2: #2C3036;
  --rail-texte: #B9BDC4;
  --rayon: 8px;
  --rayon-carte: 10px;
  /* Archivo est embarquée en base64 (src/police-archivo.css) ; repli sur une grotesque grasse du système */
  --titre: "Archivo", "Helvetica Neue", "Arial Nova", Arial, sans-serif;
  --police: "Inter", -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--fond); color: var(--encre); font: 14px/1.45 var(--police); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[hidden] { display: none !important; }
.chiffre { font-family: var(--titre); font-variant-numeric: tabular-nums; }

/* ---------- Barre du haut ---------- */
.app-barre {
  position: sticky; top: 0; z-index: 20; background: var(--surface); color: var(--encre); border-bottom: 1px solid var(--trait);
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 24px; padding: 12px 24px;
}
.marque { display: flex; align-items: center; gap: 10px; }
.marque .logo { width: 32px; height: 32px; border-radius: 6px; background: var(--accent); display: flex; align-items: center; justify-content: center; flex: none; }
.marque b { display: block; font-family: var(--titre); font-weight: 800; font-size: 16px; letter-spacing: -.01em; line-height: 1.1; }
.marque small { display: block; font-size: 12px; color: var(--encre-3); }
.contexte { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; flex: 1 1 320px; min-width: 0; }
.contexte .numero { font-family: var(--titre); font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; }
.contexte .qui { color: var(--encre-2); }
.app-barre .totaux { display: flex; gap: 14px; font-variant-numeric: tabular-nums; flex-wrap: wrap; color: var(--encre-2); }
.app-barre .totaux b { font-family: var(--titre); font-weight: 700; color: var(--encre); }
.app-barre .actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.app-barre select { width: auto; max-width: 200px; height: 40px; }
@media (min-width: 1321px) { .app-barre .totaux { display: none; } }
.app-barre .btn { height: 40px; }
.cadenas { display: none; }
#btn-imprimer:disabled { background: #ECE9E3; border-color: var(--trait-fort); color: var(--encre-3); opacity: 1; }
#btn-imprimer:disabled .cadenas { display: inline-block; }
.badge { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 99px; font-size: 12px; font-weight: 600; border: 0; }
.badge.ok { background: var(--ok-clair); color: var(--ok); }
.badge.ko { background: var(--erreur-clair); color: var(--erreur); }
.badge.brouillon { background: var(--alerte-clair); color: var(--alerte); }

/* ---------- Disposition : rail | plan de travail | devis en direct ---------- */
.disposition { display: grid; grid-template-columns: 248px minmax(0, 1fr) 320px; align-items: stretch; min-height: calc(100vh - 65px); }
.disposition.sans-direct { grid-template-columns: 248px minmax(0, 1fr); }
.disposition.sans-direct .direct { display: none; }
.rail { background: var(--rail); color: #fff; padding: 20px 12px; display: flex; flex-direction: column; gap: 4px; }
.rail .titre-rail { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--rail-texte); padding: 0 12px 8px; }
.rail .titre-rail.reglages { padding-top: 20px; border-top: 1px solid #33373E; margin-top: 12px; }
.rail button {
  display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 8px 12px; border: 0; border-radius: 6px;
  background: transparent; color: #fff; text-align: left; cursor: pointer; width: 100%;
}
.rail button:hover { background: #24282E; }
.rail button[aria-current="page"] { background: var(--rail-2); box-shadow: inset 3px 0 0 var(--accent); }
.rail .pastille {
  width: 24px; height: 24px; border-radius: 99px; flex: none; display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; border: 1.5px solid #6B7078; color: var(--rail-texte);
}
.rail .pastille.fait { background: #2F7A52; border-color: #2F7A52; color: #fff; }
.rail .pastille.actif { background: var(--accent); border-color: var(--accent); color: #fff; }
.rail .pastille.bloque { border-color: #E06A5E; color: #F2A097; }
.rail .pastille.icone-rail { border: 0; }
.rail .libelle-rail { display: flex; flex-direction: column; min-width: 0; }
.rail .libelle-rail b { font-weight: 600; }
.rail .libelle-rail small { font-size: 12px; color: var(--rail-texte); }
.rail .libelle-rail small.ko { color: #F2A097; }
.rail .libelle-rail small.ok { color: #9FD3B4; }
main { min-width: 0; }
.onglet { max-width: 1180px; margin: 0 auto; padding: 28px 32px 60px; }
.entete-onglet { display: flex; flex-direction: column; gap: 6px; margin-bottom: 20px; }
.entete-onglet .kicker { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.entete-onglet h1 { margin: 0; font-family: var(--titre); font-weight: 800; font-size: 32px; letter-spacing: -.02em; line-height: 1.1; }
.entete-onglet p { margin: 0; color: var(--encre-2); }
.etiquettes { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.etiquette { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 99px; background: var(--surface); border: 1px solid var(--trait); font-size: 13px; }
.etiquette b { font-family: var(--titre); font-variant-numeric: tabular-nums; }

/* ---------- Le devis en direct ---------- */
.direct {
  border-left: 1px solid var(--trait); background: var(--surface); padding: 28px 24px 48px;
  display: flex; flex-direction: column; gap: 22px; position: sticky; top: 65px; align-self: start; max-height: calc(100vh - 65px); overflow: auto;
}
.direct .etiq { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--encre-3); }
.direct .total { font-family: var(--titre); font-weight: 800; font-size: 40px; letter-spacing: -.02em; line-height: 1; font-variant-numeric: tabular-nums; }
.direct .note-tva { font-size: 12px; color: var(--encre-3); }
.direct .lignes-totaux { display: flex; flex-direction: column; gap: 8px; padding-bottom: 18px; border-bottom: 1px solid var(--trait); font-variant-numeric: tabular-nums; }
.direct .ligne { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; }
.direct .ligne > span:first-child { color: var(--encre-2); }
.direct .ligne b { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.direct .barre { height: 6px; border-radius: 3px; background: var(--trait-leger); }
.direct .barre > div { height: 6px; border-radius: 3px; background: var(--encre); }
.direct .bloc { display: flex; flex-direction: column; gap: 10px; }
.direct .sous { font-size: 12px; color: var(--encre-3); margin-top: -4px; }
.encadre { display: flex; flex-direction: column; gap: 8px; padding: 16px; border-radius: var(--rayon-carte); font-size: 13px; }
.encadre .titre-encadre { display: flex; align-items: center; gap: 8px; font-family: var(--titre); font-weight: 800; font-size: 15px; }
.encadre ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
.encadre p { margin: 0; }
.encadre.bloque { background: var(--erreur-clair); border: 1px solid #F1C4BE; color: #5A1712; }
.encadre.bloque .titre-encadre { color: var(--erreur); }
.encadre.bloque a { color: #7E1A13; }
.encadre.bloque .btn { background: var(--erreur); border-color: var(--erreur); color: #fff; height: 44px; justify-content: center; }
.encadre.pret { background: var(--ok-clair); border: 1px solid #BFDCC9; color: #123F27; }
.encadre.pret .titre-encadre { color: var(--ok); }
.encadre.pret .btn { background: var(--ok); border-color: var(--ok); color: #fff; height: 44px; justify-content: center; }
.encadre.savoir { background: var(--alerte-clair); border: 1px solid #F0D9A8; color: #4D3000; }
.encadre.savoir .titre-encadre { color: var(--alerte); }

@media (max-width: 1320px) {
  .disposition { grid-template-columns: 232px minmax(0, 1fr); }
  .direct { grid-column: 2; position: static; max-height: none; border-left: 0; border-top: 1px solid var(--trait); }
}
@media (max-width: 900px) {
  .disposition, .disposition.sans-direct { grid-template-columns: minmax(0, 1fr); }
  .rail { flex-direction: row; overflow-x: auto; padding: 8px; gap: 4px; position: static; }
  .rail .titre-rail { display: none; }
  .rail button { width: auto; flex: none; min-height: 44px; }
  .rail .libelle-rail small { display: none; }
  .direct { grid-column: 1; }
  .onglet { padding: 20px 16px 48px; }
  .entete-onglet h1 { font-size: 26px; }
}

.carte { background: var(--surface); border: 1px solid var(--trait); border-radius: var(--rayon-carte); padding: 16px 18px; margin-bottom: 16px; box-shadow: 0 1px 2px rgba(26,29,33,.04); }
.carte > h2 { font-family: var(--titre); font-weight: 800; font-size: 16px; margin: 0 0 12px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.carte > h2 .aide { font-weight: 400; color: var(--encre-3); font-size: 12.5px; }
.carte h3 { font-size: 13.5px; margin: 16px 0 8px; color: var(--encre-2); }
.grille { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px 14px; }
.grille.large { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
.deux-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 900px) { .deux-col { grid-template-columns: 1fr; } }

.champ { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.champ > span { font-size: 12.5px; color: var(--encre-2); font-weight: 550; }
.champ .req { color: var(--erreur); }
input[type=text], input[type=number], input[type=date], input[type=email], input[type=tel], select, textarea {
  width: 100%; padding: 6px 8px; border: 1px solid var(--trait-fort); border-radius: 4px; background: #fff; min-width: 0;
}
textarea { resize: vertical; min-height: 60px; }
input.invalide, select.invalide { border-color: var(--erreur); background: var(--erreur-clair); }
input[readonly] { background: #f1f3f6; }
.case { display: flex; align-items: flex-start; gap: 8px; padding: 4px 0; cursor: pointer; }
.case input { margin-top: 3px; }
fieldset.radios { border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 3px; }
fieldset.radios legend { font-size: 12.5px; color: var(--encre-2); font-weight: 550; padding: 0; margin-bottom: 2px; }
fieldset.radios .opts { display: flex; flex-wrap: wrap; gap: 4px 14px; }
fieldset.radios label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }

.btn {
  display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 4px; cursor: pointer;
  border: 1px solid var(--trait-fort); background: #fff; font-weight: 550; white-space: nowrap;
}
.btn:hover { filter: brightness(.96); }
.btn.primaire { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.danger { color: var(--erreur); }
.btn.petit { padding: 2px 8px; font-size: 12.5px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.icone { border: 0; background: none; cursor: pointer; padding: 2px 5px; border-radius: 3px; color: var(--encre-2); }
.icone:hover { background: var(--accent-clair); }

.note { font-size: 12.5px; color: var(--encre-2); padding: 8px 12px; border-left: 3px solid var(--trait-fort); background: #f8f9fb; margin: 8px 0; }
.note.hypothese { border-left-color: var(--alerte); background: var(--alerte-clair); }
.note.info { border-left-color: var(--accent); background: var(--accent-clair); }
.note.ok { border-left-color: var(--ok); background: var(--ok-clair); }
.note.erreur { border-left-color: var(--erreur); background: var(--erreur-clair); }
.tag { display: inline-block; font-size: 11px; font-weight: 650; padding: 1px 6px; border-radius: 3px; background: var(--alerte-clair); color: var(--alerte); vertical-align: middle; }
.tag.bleu { background: var(--accent-clair); color: var(--accent); }

table.t { border-collapse: collapse; width: 100%; font-size: 13px; }
table.t th, table.t td { border-bottom: 1px solid var(--trait); padding: 5px 6px; text-align: left; vertical-align: top; }
table.t thead th { background: #f1f3f6; font-size: 12px; color: var(--encre-2); position: sticky; top: 0; z-index: 1; }
table.t td.num, table.t th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
table.t tfoot td { font-weight: 650; border-top: 2px solid var(--trait-fort); }
table.t input, table.t select { padding: 3px 5px; font-size: 12.5px; }
.defile { max-height: 560px; overflow: auto; border: 1px solid var(--trait); border-radius: 4px; }
.code { font-family: var(--mono); font-size: 12px; color: var(--encre-2); }

/* Conformité */
.conformite ul { margin: 6px 0 0; padding-left: 20px; }
.conformite li { margin: 2px 0; }
.conformite .ko h3 { color: var(--erreur); }
.conformite .av h3 { color: var(--alerte); }
.conformite a { color: inherit; }

/* Saisie des lignes */
.selecteur { display: grid; grid-template-columns: 160px 220px 1fr 110px auto auto; gap: 8px; align-items: end; }
@media (max-width: 1000px) { .selecteur { grid-template-columns: 1fr 1fr; } }
.apercu-ouvrage { font-size: 12.5px; color: var(--encre-2); margin-top: 6px; min-height: 18px; }
#table-lignes tr.ligne-ko td { background: var(--erreur-clair); }
#table-lignes tr.ligne-av td.des { box-shadow: inset 3px 0 0 var(--alerte); }
#table-lignes .msg { font-size: 12px; color: var(--erreur); }
#table-lignes .msg.av { color: var(--alerte); }
.r-lot-saisie td { background: #eef2f7; font-weight: 650; }

/* Tests */
.test-resume { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.test-ok { color: var(--ok); font-weight: 650; }
.test-ko { color: var(--erreur); font-weight: 650; }
details > summary { cursor: pointer; }

/* ===================== Document (devis client) ===================== */
.zone-apercu { display: flex; flex-direction: column; align-items: center; gap: 12px; overflow-x: auto; max-width: 100%; }
@media (max-width: 860px) {
  .zone-apercu { align-items: flex-start; }
  .app-barre { position: static; }
}
.feuille {
  --doc-accent: #B8430E; --doc-encre: #1A1D21; --doc-encre-2: #474C54; --doc-encre-3: #5F646C; --doc-trait: #E2DED6; --doc-trait-leger: #EEEBE5; --doc-beton: #F4F2ED;
  position: relative; width: 210mm; min-height: 297mm; background: #fff; color: var(--doc-encre);
  padding: 16mm 15mm 18mm; box-shadow: 0 1px 4px rgba(0,0,0,.18); font: 9.5pt/1.38 var(--police);
}
.feuille h1, .feuille h2, .feuille h3 { margin: 0; }
.filigrane {
  position: absolute; inset: 0; pointer-events: none; display: flex; align-items: center; justify-content: center; overflow: hidden;
}
.filigrane span { transform: rotate(-30deg); font-family: var(--titre); font-size: 60pt; line-height: 1.1; text-align: center; font-weight: 800; letter-spacing: .06em; color: rgba(163, 36, 28, .12); white-space: nowrap; }
.filigrane.neutre span { font-size: 96pt; color: rgba(26, 29, 33, .06); }
.doc-entete { display: flex; justify-content: space-between; gap: 10mm; padding-bottom: 5mm; border-bottom: 3px solid var(--doc-accent); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.doc-emetteur { font-size: 8.6pt; color: var(--doc-encre-2); line-height: 1.45; }
.doc-rs { font-family: var(--titre); font-size: 12pt; font-weight: 800; letter-spacing: -.01em; color: var(--doc-encre); margin-bottom: 1mm; }
.doc-titre { text-align: right; min-width: 64mm; }
.doc-titre h1 { font-family: var(--titre); font-weight: 800; font-size: 24pt; letter-spacing: .02em; line-height: 1.05; color: var(--doc-accent); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.doc-meta { margin-left: auto; margin-top: 2mm; border-collapse: collapse; font-size: 8.8pt; }
.doc-meta th { text-align: left; font-weight: 500; padding: .6mm 3mm .6mm 0; color: var(--doc-encre-3); }
.doc-meta td { text-align: right; padding: .6mm 0; font-weight: 700; font-family: var(--titre); font-variant-numeric: tabular-nums; }
.doc-parties { display: grid; grid-template-columns: 1fr 1fr; gap: 6mm; margin: 5mm 0; }
.doc-bloc { border: 1px solid var(--doc-trait); border-radius: 1.6mm; padding: 3mm 4mm; break-inside: avoid; }
.doc-bloc h2 { font-size: 7.8pt; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--doc-encre-3); margin-bottom: 1.5mm; }
.doc-bloc .nom { font-weight: 700; font-size: 10pt; }
.doc-objet { margin: 0 0 4mm; font-family: var(--titre); font-weight: 700; font-size: 11.5pt; }
.doc-objet strong { display: block; font-family: var(--police); font-size: 7.8pt; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--doc-encre-3); }
.bandeau { border: 1.5px solid var(--doc-encre); padding: 2.5mm 4mm; margin: 0 0 4mm; font-weight: 650; break-inside: avoid; }

.doc-table { width: 100%; border-collapse: collapse; font-size: 8.8pt; }
.doc-table thead { display: table-header-group; }
.doc-table thead th {
  background: var(--doc-encre); color: #fff; font-weight: 700; padding: 1.8mm 1.6mm; text-align: left; font-size: 7.6pt; letter-spacing: .05em; text-transform: uppercase;
  -webkit-print-color-adjust: exact; print-color-adjust: exact;
}
.doc-table th.num, .doc-table td.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.doc-table td { padding: 1.4mm 1.6mm; vertical-align: top; border-bottom: .5px solid var(--doc-trait-leger); }
.doc-table tr { break-inside: avoid; page-break-inside: avoid; }
.doc-table td.n { white-space: nowrap; color: var(--doc-encre-3); width: 12mm; font-variant-numeric: tabular-nums; }
.doc-table .r-lot th {
  text-align: left; background: transparent; font-family: var(--titre); font-weight: 800; font-size: 10pt; padding: 3.5mm 1.6mm 1.4mm; text-transform: uppercase; letter-spacing: .02em; border-bottom: 1.5px solid var(--doc-encre);
  -webkit-print-color-adjust: exact; print-color-adjust: exact; break-after: avoid; page-break-after: avoid;
}
.doc-table .r-lot th .ref { font-family: var(--police); text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--doc-encre-3); font-size: 8pt; }
.doc-table .r-sl th { text-align: left; font-weight: 600; color: var(--doc-encre-2); padding: 2mm 1.6mm .6mm; border-bottom: 0; break-after: avoid; page-break-after: avoid; }
.doc-table .lib { font-weight: 550; }
.doc-table .det { color: var(--doc-encre-2); font-size: 8.2pt; margin-top: .8mm; }
.doc-table .det strong { color: var(--doc-encre); }
.doc-table .det ul { margin: .4mm 0 0; padding-left: 4.5mm; }
.doc-table .det li { margin: 0; }
.doc-table .r-sous td { border-bottom-style: dotted; break-before: avoid; page-break-before: avoid; }
.doc-table .r-sous .des { padding-left: 5mm; color: #333; }
.doc-table .r-entete-ouvrage td { border-bottom: 0; }
.doc-table .r-st td { font-size: 8.4pt; color: var(--doc-encre-2); border-bottom: 0; padding-top: 1mm; padding-bottom: 2mm; }
.doc-table .r-st td:nth-child(2) { text-align: right; }
.doc-table .r-st td.num { font-weight: 600; color: var(--doc-encre); }
.doc-table .r-lt td { font-family: var(--titre); font-weight: 800; font-size: 9.5pt; background: var(--doc-beton); border: 0; text-align: right; padding: 2.2mm 1.6mm; -webkit-print-color-adjust: exact; print-color-adjust: exact; }

.doc-bas { display: grid; grid-template-columns: 1fr 74mm; gap: 6mm; margin-top: 5mm; break-inside: avoid; }
.doc-mini { width: 100%; border-collapse: collapse; font-size: 8.6pt; }
.doc-mini caption { text-align: left; font-weight: 700; font-size: 7.8pt; text-transform: uppercase; letter-spacing: .08em; color: var(--doc-encre-3); padding-bottom: 1.2mm; }
.doc-mini th, .doc-mini td { padding: 1.1mm 1.5mm; border-bottom: .5px solid var(--doc-trait-leger); text-align: left; }
.doc-mini .num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.doc-mini thead th { font-weight: 600; color: var(--doc-encre-3); border-bottom: 1px solid var(--doc-trait); }
.doc-totaux th { font-weight: 600; }
.doc-totaux .ttc th, .doc-totaux .ttc td { font-family: var(--titre); font-size: 10pt; font-weight: 800; border-top: 1px solid #CFC9BE; }
.doc-totaux .net th, .doc-totaux .net td {
  background: var(--doc-encre); color: #fff; font-weight: 700; padding-top: 2.6mm; padding-bottom: 2.6mm; -webkit-print-color-adjust: exact; print-color-adjust: exact;
}

.doc-section { margin-top: 4mm; break-inside: avoid; }
.doc-section h2 { font-size: 7.8pt; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--doc-encre-3); border-bottom: 1px solid var(--doc-trait); padding-bottom: 1mm; margin-bottom: 2mm; }
.doc-section p { margin: 1.2mm 0; font-size: 8.5pt; }
.doc-section p { color: var(--doc-encre-2); }
.doc-section p strong { color: var(--doc-encre); }

.doc-signatures { display: grid; grid-template-columns: 1fr 1fr; gap: 6mm; margin-top: 6mm; break-inside: avoid; }
.doc-signatures .doc-bloc { min-height: 46mm; }
.doc-signatures .ligne-ecrite { border-bottom: .5px solid #888; height: 6mm; margin: 1.5mm 0; }
.case-doc { display: inline-block; width: 3.2mm; height: 3.2mm; border: .6px solid #333; vertical-align: -0.5mm; margin-right: 1.5mm; }
.ph { background: #fff1c2; color: #8a4b00; border: 1px dashed #c98a1b; padding: 0 1mm; font-weight: 700; font-size: .92em; }
.annexe { margin-top: 10mm; border-top: 1px dashed #888; padding-top: 6mm; }
.annexe h2 { font-size: 11pt; margin-bottom: 3mm; }

.annexe .ligne-ecrite { border-bottom: .5px solid #888; height: 7mm; }

/* ===================== Impression ===================== */
@page {
  size: A4 portrait;
  margin: 16mm 15mm 18mm 15mm;
  @bottom-right { content: "Page " counter(page) " / " counter(pages); font: 7.5pt sans-serif; color: #555; }
}
.zone-impression { display: none; }
@media print {
  html, body { background: #fff !important; }
  .app-barre, .rail, .direct, .no-print, main, .onglet { display: none !important; }
  .disposition { display: block; min-height: 0; }

  .feuille { width: auto; min-height: 0; padding: 0; margin: 0; box-shadow: none; }
  .filigrane { position: fixed; }
  .annexe { break-before: page; page-break-before: always; border-top: 0; margin-top: 0; padding-top: 0; }
  .ph { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}

/* ---------- Recherche rapide ---------- */

<script id="moteur">
/* ==========================================================================
   MOTEUR DE CALCUL DES DEVIS — module JavaScript pur (aucun accès au DOM).
   Utilisable dans le navigateur (window.Moteur) et sous Node (module.exports).

   RÈGLES MONÉTAIRES (non négociables)
   - Tout montant est un nombre ENTIER de centimes (suffixe _c). Jamais de flottant.
   - Les produits intermédiaires sont calculés en BigInt, puis arrondis UNE fois.
   - Arrondi « commercial » : un demi-centime s'arrondit en s'éloignant de zéro.
   - Échelles entières :
       quantités ............ millièmes (q_m : 12,5 m² -> 12500)
       temps ................ millièmes d'heure (t_mh : 0,35 h -> 350)
       coefficients ......... dix-millièmes (1,15 -> 11500)
       pourcentages ......... points de base sur 10000 (10 % -> 1000 ; 5,5 % -> 550)

   ORDRE DE CALCUL ET D'ARRONDI (documenté, vérifié par verifierCalculs)
   1. PV unitaire d'une fourniture   = arrondi(PA × règle de marge)
        mode « coefficient »   : PV = PA × k
        mode « taux de marque » : PV = PA / (1 − t)
   2. PU fournitures d'un ouvrage    = arrondi(Σ ratio × PV fourniture)
   3. PU main-d'œuvre d'un ouvrage   = arrondi(temps × taux horaire métier
                                        × coef. région × coef. pénibilité
                                        × coef(s) accessibilité [× majoration déplacement])
   4. Total d'une ligne affichée     = arrondi(quantité × PU affiché)   -> arrondi à la ligne
   5. Sous-totaux, total HT           = sommes exactes des lignes affichées
   6. TVA                             = arrondi(base HT du taux × taux), calculée par taux
   7. Échéancier                      = arrondi(TTC × part de l'appel) ; l'écart d'arrondi
                                        est reporté sur la dernière échéance (solde)
   Conséquence : chaque ligne imprimée vérifie « Qté × PU = Total » au centime, et les
   totaux sont la somme exacte des lignes imprimées.
   ========================================================================== */
(function (racine) {
  'use strict';

  const ECH = 10000;          // échelle des coefficients et pourcentages
  const NNBSP = '\u00A0';     // espace insécable (milliers) : présente dans toutes les polices, y compris en gras
  const NBSP = '\u00A0';      // espace insécable (avant €, %)
  const UNITES = ['u', 'ml', 'm²', 'h', 'ens', 'forfait', 'j', 'lot'];
  const MODES = ['unite', 'forfait', 'horaire'];

  /* ---------- Arithmétique entière ---------- */

  function big(x) {
    if (typeof x === 'bigint') return x;
    if (!Number.isInteger(x)) throw new Error('Valeur non entière dans un calcul monétaire : ' + x);
    return BigInt(x);
  }

  // Division entière arrondie (demi vers l'extérieur). n, d : BigInt, d > 0.
  function arrondiDiv(n, d) {
    if (d <= 0n) throw new Error('Division par zéro ou négative');
    const neg = n < 0n;
    const a = neg ? -n : n;
    let q = a / d;
    if ((a % d) * 2n >= d) q += 1n;
    return neg ? -q : q;
  }

  // Π nums / Π dens, arrondi une seule fois. Retourne un Number entier.
  function mulDiv(nums, dens) {
    let n = 1n, d = 1n;
    for (const x of nums) n *= big(x);
    for (const y of dens) d *= big(y);
    const r = arrondiDiv(n, d);
    if (r > BigInt(Number.MAX_SAFE_INTEGER) || r < -BigInt(Number.MAX_SAFE_INTEGER)) throw new Error('Montant hors limites');
    return Number(r);
  }

  // Convertit "1 234,56" / "12.5" / 12.5 en entier à l'échelle 10^dec. NaN si invalide.
  // Conversion purement textuelle : aucune erreur de flottant.
  function versEntier(valeur, dec) {
    if (valeur === null || valeur === undefined || valeur === '') return NaN;
    let s = String(valeur).trim().replace(/[\s\u00A0\u202F]/g, '').replace(',', '.');
    if (!/^[-+]?(\d+\.?\d*|\.\d+)$/.test(s)) return NaN;
    let neg = false;
    if (s[0] === '-' || s[0] === '+') { neg = s[0] === '-'; s = s.slice(1); }
    const morceaux = s.split('.');
    const ent = morceaux[0] || '0';
    let frac = morceaux[1] || '';
    const garde = frac.charAt(dec);
    frac = (frac + '0'.repeat(dec)).slice(0, dec);
    let n = BigInt(ent) * (10n ** BigInt(dec)) + BigInt(frac || '0');
    if (garde !== '' && Number(garde) >= 5) n += 1n;
    if (neg) n = -n;
    return Number(n);
  }

  // Répartit un montant entier au prorata de poids entiers (méthode du plus fort reste).
  function repartir(montant, poids) {
    const total = poids.reduce((a, b) => a + b, 0);
    if (poids.length === 0) return [];
    if (total === 0) return poids.map((_, i) => (i === 0 ? montant : 0));
    const M = big(montant), T = big(total);
    const parts = poids.map(p => (M * big(p)) / T);
    const restes = poids.map((p, i) => ({ i, r: (M * big(p)) % T }));
    let reste = M - parts.reduce((a, b) => a + b, 0n);
    restes.sort((a, b) => (b.r > a.r ? 1 : b.r < a.r ? -1 : a.i - b.i));
    for (let k = 0; reste > 0n; k++, reste--) parts[restes[k % restes.length].i] += 1n;
    return parts.map(Number);
  }

  /* ---------- Formats français ---------- */

  function grouper(chiffres) { return chiffres.replace(/\B(?=(\d{3})+(?!\d))/g, NNBSP); }

  // 123456 -> "1 234,56 €"
  function euros(c, sansSymbole) {
    if (!Number.isInteger(c)) return '—';
    const neg = c < 0;
    const a = Math.abs(c);
    const ent = (a - (a % 100)) / 100;
    const s = (neg ? '−' : '') + grouper(String(ent)) + ',' + String(a % 100).padStart(2, '0');
    return sansSymbole ? s : s + NBSP + '€';
  }

  // 12500 -> "12,5" ; 85000 -> "85"
  function quantite(q_m) {
    if (!Number.isInteger(q_m)) return '—';
    const neg = q_m < 0, a = Math.abs(q_m);
    const ent = (a - (a % 1000)) / 1000;
    const frac = String(a % 1000).padStart(3, '0').replace(/0+$/, '');
    return (neg ? '−' : '') + grouper(String(ent)) + (frac ? ',' + frac : '');
  }

  // 550 -> "5,5 %" (points de base sur 10000)
  function pourcent(bp) {
    if (!Number.isInteger(bp)) return '—';
    const neg = bp < 0, a = Math.abs(bp);
    const ent = (a - (a % 100)) / 100;
    const frac = String(a % 100).padStart(2, '0').replace(/0+$/, '');
    return (neg ? '−' : '') + ent + (frac ? ',' + frac : '') + NBSP + '%';
  }

  // 11500 -> "1,15"
  function coef(e) {
    if (!Number.isInteger(e)) return '—';
    const ent = (e - (e % ECH)) / ECH;
    const frac = String(e % ECH).padStart(4, '0').replace(/0+$/, '');
    return ent + ',' + (frac.length < 2 ? (frac + '00').slice(0, 2) : frac);
  }

  function dateFr(iso) {
    if (!iso || !/^\d{4}-\d{2}-\d{2}$/.test(iso)) return '';
    const [a, m, j] = iso.split('-');
    return j + '/' + m + '/' + a;
  }

  function dateValide(iso) {
    if (!iso || !/^\d{4}-\d{2}-\d{2}$/.test(iso)) return false;
    const [a, m, j] = iso.split('-').map(Number);
    const d = new Date(Date.UTC(a, m - 1, j));
    return d.getUTCFullYear() === a && d.getUTCMonth() === m - 1 && d.getUTCDate() === j;
  }

  function ajouterJours(iso, n) {
    if (!dateValide(iso)) return '';
    const [a, m, j] = iso.split('-').map(Number);
    return new Date(Date.UTC(a, m - 1, j + n)).toISOString().slice(0, 10);
  }

  function aujourdhui() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function vide(x) { return x === null || x === undefined || String(x).trim() === ''; }

  /* ---------- Identifiants ---------- */

  function chiffresSeuls(s) { return String(s || '').replace(/\D/g, ''); }

  function luhn(num) {
    let somme = 0;
    for (let i = 0; i < num.length; i++) {
      let c = Number(num[num.length - 1 - i]);
      if (i % 2 === 1) { c *= 2; if (c > 9) c -= 9; }
      somme += c;
    }
    return somme % 10 === 0;
  }

  function cleTvaFr(siren) { return String((12 + 3 * Number(BigInt(siren) % 97n)) % 97).padStart(2, '0'); }

  function departementDepuisCP(cp) {
    const c = chiffresSeuls(cp);
    if (c.length !== 5) return '';
    if (c.startsWith('97')) return c.slice(0, 3);
    if (c.startsWith('20')) return Number(c) < 20200 ? '2A' : '2B';
    return c.slice(0, 2);
  }

  function numeroDevis(params, dateIso) {
    const d = params.devis;
    const annee = (dateValide(dateIso) ? dateIso : aujourdhui()).slice(0, 4);
    return (d.prefixe || 'D') + '-' + annee + '-' + String(d.prochainNumero).padStart(4, '0');
  }

  /* ---------- Catalogue ---------- */

  function indexer(cat) {
    const lots = new Map(), sousLots = new Map();
    cat.lots.forEach((l, i) => {
      lots.set(l.code, Object.assign({}, l, { ordre: i }));
      (l.sousLots || []).forEach((s, j) => sousLots.set(s.code, Object.assign({}, s, { lot: l.code, ordre: j })));
    });
    return {
      cat,
      lots,
      sousLots,
      familles: new Map(cat.familles.map(f => [f.code, f])),
      fournitures: new Map(cat.fournitures.map(f => [f.code, f])),
      ouvrages: new Map(cat.ouvrages.map(o => [o.code, o]))
    };
  }

  // Règle de marge applicable à une fourniture : fourniture > famille > global.
  function regleMarge(cat, fourniture, familles) {
    const p = cat.parametres.marge;
    const mode = p.mode === 'coefficient' ? 'coefficient' : 'taux_marque';
    const cle = mode === 'coefficient' ? 'coefficient' : 'tauxMarque';
    let valeur = p[cle], source = 'paramètre global';
    const fam = familles ? familles.get(fourniture.famille) : cat.familles.find(f => f.code === fourniture.famille);
    if (fam && fam.marge && !vide(fam.marge[cle])) { valeur = fam.marge[cle]; source = 'famille « ' + fam.libelle + ' »'; }
    if (fourniture.marge && !vide(fourniture.marge[cle])) { valeur = fourniture.marge[cle]; source = 'fourniture'; }
    const entier = mode === 'coefficient' ? versEntier(valeur, 4) : versEntier(valeur, 2);
    return { mode, valeur, source, entier };
  }

  function prixVente(pa_c, regle) {
    if (!Number.isInteger(pa_c) || !Number.isInteger(regle.entier)) return NaN;
    if (regle.mode === 'coefficient') return mulDiv([pa_c, regle.entier], [ECH]);
    if (regle.entier >= ECH) return NaN; // taux de marque ≥ 100 % : impossible
    return mulDiv([pa_c, ECH], [ECH - regle.entier]);
  }

  function resoudreOuvrage(idx, ligne) {
    if (ligne.libre) {
      const l = ligne.libre;
      return {
        code: 'LIBRE', libre: true, sousLot: l.sousLot, libelle: l.libelle || '', unite: l.unite || 'u',
        mode: l.mode || 'unite', tempsUnitaire_h: l.tempsUnitaire_h, prixMOBase_c: vide(l.prixMOBase_c) ? null : l.prixMOBase_c,
        fournitures: [], paLibre_c: Number.isInteger(l.paFournitures_c) ? l.paFournitures_c : 0,
        inclus: String(l.inclus || '').split('\n').map(s => s.trim()).filter(Boolean),
        exclus: String(l.exclus || '').split('\n').map(s => s.trim()).filter(Boolean),
        eligible55: !!l.eligible55
      };
    }
    return idx.ouvrages.get(ligne.ouvrage) || null;
  }

  // Valeurs unitaires de fourniture d'un ouvrage (par unité d'ouvrage).
  function valeursFournitures(idx, ouv) {
    let numPA = 0n, numPV = 0n;
    const detail = [];
    for (const c of ouv.fournitures || []) {
      const f = idx.fournitures.get(c.code);
      if (!f) throw new Error('Fourniture inconnue « ' + c.code + ' » dans l\'ouvrage ' + ouv.code);
      const r = versEntier(c.ratio, 3);
      const regle = regleMarge(idx.cat, f, idx.familles);
      const pv = prixVente(f.pa_c, regle);
      if (!Number.isInteger(pv)) throw new Error('Règle de marge invalide pour ' + f.code);
      numPA += big(r) * big(f.pa_c);
      numPV += big(r) * big(pv);
      detail.push({ code: f.code, libelle: f.libelle, famille: f.famille, ratio_m: r, pa_c: f.pa_c, pv_c: pv, regle });
    }
    if (ouv.paLibre_c) {
      const regle = regleMarge(idx.cat, { famille: 'CONSO', marge: null }, idx.familles);
      const pv = prixVente(ouv.paLibre_c, regle);
      numPA += 1000n * big(ouv.paLibre_c);
      numPV += 1000n * big(pv);
      detail.push({ code: 'LIBRE', libelle: 'Fournitures (ligne libre)', famille: 'CONSO', ratio_m: 1000, pa_c: ouv.paLibre_c, pv_c: pv, regle });
    }
    return { PAu: Number(arrondiDiv(numPA, 1000n)), PVu: Number(arrondiDiv(numPV, 1000n)), detail };
  }

  /* ---------- Coefficients de chantier ---------- */

  function adresseChantier(devis) {
    const ch = devis.chantier || {};
    if (ch.identiqueClient) {
      const c = devis.client || {};
      return { adresse: c.adresse, cp: c.cp, ville: c.ville };
    }
    return { adresse: ch.adresse, cp: ch.cp, ville: ch.ville };
  }

  function infoRegion(P, devis) {
    const ch = devis.chantier || {};
    const dep = !vide(ch.departement) ? String(ch.departement).toUpperCase() : departementDepuisCP(adresseChantier(devis).cp);
    const region = P.regions.find(r => (r.departements || []).includes(dep));
    const facteurs = [];
    let libelle, determine = true;
    if (P.coefsDepartement && !vide(P.coefsDepartement[dep])) {
      facteurs.push({ libelle: 'Département ' + dep, entier: versEntier(P.coefsDepartement[dep], 4) });
      libelle = 'Département ' + dep + (region ? ' (' + region.libelle + ')' : '');
    } else if (region) {
      facteurs.push({ libelle: region.libelle, entier: versEntier(region.coef, 4) });
      libelle = region.libelle + ' (dép. ' + dep + ')';
    } else {
      facteurs.push({ libelle: 'Région non déterminée', entier: ECH });
      libelle = 'Région non déterminée';
      determine = false;
    }
    if (ch.zoneRurale) facteurs.push({ libelle: 'Zone rurale', entier: versEntier(P.zoneRurale, 4) });
    return { departement: dep, region: region ? region.code : '', libelle, facteurs, determine };
  }

  function facteursAccessibilite(P, ch) {
    const A = P.accessibilite, out = [];
    const etage = Math.max(0, parseInt(ch.etage, 10) || 0);
    if (!ch.ascenseur && etage > 0) {
      out.push({ libelle: (etage === 1 ? '1er' : etage + 'e') + ' étage sans ascenseur', entier: ECH + versEntier(A.parEtageSansAscenseur, 4) * etage });
    }
    if (ch.stationnementDifficile) out.push({ libelle: 'Stationnement difficile', entier: versEntier(A.stationnementDifficile, 4) });
    if (ch.accesPietonLong) out.push({ libelle: 'Accès piéton long', entier: versEntier(A.accesPietonLong, 4) });
    if (ch.centreHistorique) out.push({ libelle: 'Centre-ville historique', entier: versEntier(A.centreHistorique, 4) });
    if (ch.monteCharge) out.push({ libelle: 'Monte-charge nécessaire', entier: versEntier(A.monteCharge, 4) });
    return out;
  }

  function infoDeplacement(P, devis) {
    const km = Math.max(0, versEntier((devis.chantier || {}).distanceKm || 0, 0) || 0);
    const zones = P.deplacement.zones;
    const zone = zones.find(z => vide(z.jusquaKm) || km <= Number(z.jusquaKm)) || zones[zones.length - 1];
    const mode = (devis.parametres || {}).modeDeplacement === 'majoration' ? 'majoration' : 'forfait';
    return { km, zone, mode, forfaitJour_c: zone.forfaitJour_c, majoration_bp: versEntier(zone.majoration || 0, 2) };
  }

  // Facteurs appliqués à un lot (global par défaut, surcharge possible par lot).
  function facteursLot(idx, devis, codeLot, region, dep) {
    const P = idx.cat.parametres;
    const pr = devis.parametres || {};
    const sur = (devis.surchargesLots || {})[codeLot] || {};
    const niveau = Number(!vide(sur.penibilite) ? sur.penibilite : (pr.penibilite || 1));
    const pen = P.penibilite.find(p => Number(p.niveau) === niveau) || P.penibilite[0];
    let acc;
    if (!vide(sur.accessibilite)) acc = [{ libelle: 'Coefficient d\'accessibilité propre au lot', entier: versEntier(sur.accessibilite, 4) }];
    else acc = facteursAccessibilite(P, devis.chantier || {});
    const prix = region.facteurs.map(f => f.entier).concat([versEntier(pen.coef, 4)], acc.map(a => a.entier));
    if (dep.mode === 'majoration' && dep.majoration_bp > 0) prix.push(ECH + dep.majoration_bp);
    const temps = [versEntier(pen.coef, 4)].concat(acc.map(a => a.entier));
    return {
      penibilite: { niveau: Number(pen.niveau), libelle: pen.libelle, entier: versEntier(pen.coef, 4), surcharge: !vide(sur.penibilite) },
      accessibilite: acc, accSurcharge: !vide(sur.accessibilite),
      prix, temps,
      coefPrix: produitCoefs(prix), coefTemps: produitCoefs(temps)
    };
  }

  function produitCoefs(liste) {
    if (liste.length === 0) return ECH;
    return mulDiv(liste, [10n ** BigInt(4 * (liste.length - 1))]);
  }

  function puissanceEch(n) { return 10n ** BigInt(4 * n); }

  /* ---------- TVA ---------- */

  function tauxTva(idx, devis, ouv, ligne) {
    const ch = devis.chantier || {};
    const T = idx.cat.parametres.tva;
    if (ch.sousTraitance) return { bp: 0, autoliquidation: true, source: 'Autoliquidation (sous-traitance BTP)' };
    let auto;
    if (ch.typeLocal !== 'logement') auto = { bp: versEntier(T.normal, 2), source: 'Local professionnel ou non affecté à l\'habitation' };
    else if (!ch.logementPlusDe2Ans) auto = { bp: versEntier(T.normal, 2), source: 'Logement achevé depuis moins de 2 ans' };
    else if (ch.renovationEnergetique && ouv.eligible55) auto = { bp: versEntier(T.reduit, 2), source: 'Rénovation énergétique éligible' };
    else auto = { bp: versEntier(T.intermediaire, 2), source: 'Amélioration / entretien d\'un logement de plus de 2 ans' };
    if (!vide(ligne.tva) && ligne.tva !== 'auto') {
      return { bp: versEntier(ligne.tva, 2), force: true, source: 'Taux forcé manuellement', auto };
    }
    return auto;
  }

  /* ---------- Calcul d'une ligne ---------- */

  function docLigne(role, label, unite, q_m, pu_c) {
    return { role, label, unite, q_m, pu_c, total_c: mulDiv([q_m, pu_c], [1000]) };
  }

  function calculerLigne(idx, devis, ligne, rang, region, dep) {
    const r = { id: ligne.id, rang, ligne, erreurs: [], avertissements: [] };
    const ouv = resoudreOuvrage(idx, ligne);
    if (!ouv) { r.invalide = true; r.erreurs.push('Ouvrage inconnu dans le catalogue : « ' + ligne.ouvrage + ' »'); return r; }
    const sl = idx.sousLots.get(ouv.sousLot);
    if (!sl) { r.invalide = true; r.erreurs.push('Sous-lot inconnu pour la ligne « ' + (ouv.libelle || ouv.code) + ' »'); return r; }
    const lot = idx.lots.get(sl.lot);
    const metier = idx.cat.parametres.metiers[lot.metier];
    if (!metier || !Number.isInteger(metier.tauxHoraire_c)) { r.invalide = true; r.erreurs.push('Taux horaire absent pour le métier ' + lot.metier); return r; }

    const mode = MODES.includes(ligne.mode) ? ligne.mode : (MODES.includes(ouv.mode) ? ouv.mode : 'unite');
    let q = versEntier(ligne.qte, 3);
    if (!Number.isInteger(q) || q <= 0) { r.erreurs.push('Quantité invalide ou nulle'); q = 0; }

    const f = facteursLot(idx, devis, lot.code, region, dep);
    let vu;
    try { vu = valeursFournitures(idx, ouv); } catch (e) { r.invalide = true; r.erreurs.push(e.message); return r; }

    const taux = metier.tauxHoraire_c;
    let t_mh;
    if (!vide(ouv.tempsUnitaire_h)) t_mh = versEntier(ouv.tempsUnitaire_h, 3);
    else if (Number.isInteger(ouv.prixMOBase_c)) t_mh = mulDiv([ouv.prixMOBase_c, 1000], [taux]);
    else t_mh = 0;
    if (!Number.isInteger(t_mh) || t_mh < 0) { r.erreurs.push('Temps unitaire invalide'); t_mh = 0; }

    const denom = puissanceEch(f.prix.length);
    let puMO;
    if (mode === 'horaire') puMO = mulDiv([taux].concat(f.prix), [denom]);
    else if (Number.isInteger(ouv.prixMOBase_c)) puMO = mulDiv([ouv.prixMOBase_c].concat(f.prix), [denom]);
    else puMO = mulDiv([t_mh, taux].concat(f.prix), [1000n, denom]);

    // Heures : brutes puis ajustées (pénibilité × accessibilité = temps réellement passé).
    let heuresBrutes_mh, heuresAj_mh;
    if (mode === 'horaire') { heuresBrutes_mh = q; heuresAj_mh = q; }
    else {
      heuresBrutes_mh = mulDiv([q, t_mh], [1000]);
      heuresAj_mh = mulDiv([heuresBrutes_mh].concat(f.temps), [puissanceEch(f.temps.length)]);
    }

    const qf = mode === 'horaire' ? (versEntier(ligne.qteFourn, 3) || 0) : q;
    const aff = (devis.parametres || {}).affichageFournitures === 'separe' ? 'separe' : 'integre';
    const unite = !vide(ligne.unite) ? ligne.unite : (mode === 'forfait' ? 'forfait' : mode === 'horaire' ? 'h' : ouv.unite);
    const PU = vu.PVu + puMO;
    const docs = [];
    if (mode === 'unite') {
      if (aff === 'separe' && vu.PVu > 0 && puMO > 0) {
        docs.push(docLigne('fourniture', 'Fourniture', unite, q, vu.PVu));
        docs.push(docLigne('pose', 'Pose et main-d\'œuvre', unite, q, puMO));
      } else docs.push(docLigne('principal', null, unite, q, PU));
    } else if (mode === 'forfait') {
      if (aff === 'separe' && vu.PVu > 0 && puMO > 0) {
        docs.push(docLigne('fourniture', 'Fournitures comprises', unite, 1000, mulDiv([q, vu.PVu], [1000])));
        docs.push(docLigne('pose', 'Main-d\'œuvre et mise en œuvre', unite, 1000, mulDiv([q, puMO], [1000])));
      } else docs.push(docLigne('principal', null, unite, 1000, mulDiv([q, PU], [1000])));
    } else {
      docs.push(docLigne('principal', 'Main-d\'œuvre au temps passé', 'h', q, puMO));
      if (vu.PVu > 0 && qf > 0) docs.push(docLigne('fourniture', 'Fournitures', ouv.unite, qf, vu.PVu));
      if (vu.PVu > 0 && !(qf > 0)) r.avertissements.push('Ligne au temps passé : les fournitures de l\'ouvrage ne sont pas chiffrées (quantité de fournitures vide)');
    }

    const total = docs.reduce((a, d) => a + d.total_c, 0);
    let fournPV;
    if (mode === 'horaire' || aff === 'separe') fournPV = docs.filter(d => d.role === 'fourniture').reduce((a, d) => a + d.total_c, 0);
    else fournPV = mulDiv([q, vu.PVu], [1000]);
    if (aff === 'separe' && mode !== 'horaire' && docs.length === 1) fournPV = mulDiv([q, vu.PVu], [1000]);
    const fournPA = mulDiv([qf, vu.PAu], [1000]);
    const coutMO = mulDiv([heuresAj_mh, metier.coutHoraireCharge_c || 0], [1000]);

    // Sous-lignes descriptives non chiffrées
    const details = [];
    if (!vide(ligne.complement)) details.push({ type: 'texte', texte: String(ligne.complement) });
    if (mode === 'forfait') {
      let inclus = (ouv.inclus || []).slice();
      if (inclus.length === 0 && vu.detail.length > 0) inclus = vu.detail.map(d => d.libelle + ' (' + quantite(mulDiv([d.ratio_m, q], [1000])) + ')');
      if (inclus.length === 0 && !ouv.libre) inclus = ['Main-d\'œuvre de mise en œuvre de l\'ouvrage décrit'];
      if (q !== 1000) details.push({ type: 'texte', texte: 'Base de chiffrage : ' + quantite(q) + ' ' + ouv.unite });
      if (inclus.length) details.push({ type: 'inclus', items: inclus });
      if ((ouv.exclus || []).length) details.push({ type: 'exclus', items: ouv.exclus.slice() });
      if (ouv.libre && inclus.length === 0) r.erreurs.push('Forfait sans contenu détaillé : décrivez ce qui est compris');
    }
    if (mode === 'horaire') details.push({ type: 'texte', texte: 'Nombre d\'heures estimé. Facturation au temps réellement passé ; tout dépassement fera l\'objet d\'un accord écrit préalable.' });

    const tva = tauxTva(idx, devis, ouv, ligne);
    if (tva.force) {
      const ch = devis.chantier || {};
      const T = idx.cat.parametres.tva;
      const reduit = tva.bp < versEntier(T.normal, 2);
      if (reduit && (ch.typeLocal !== 'logement' || !ch.logementPlusDe2Ans)) r.erreurs.push('Taux réduit forcé alors que le local n\'est pas un logement de plus de 2 ans');
      if (tva.bp === versEntier(T.reduit, 2) && !ouv.eligible55) r.avertissements.push('Taux de 5,5 % forcé sur un ouvrage non marqué éligible à la rénovation énergétique');
      if (![versEntier(T.normal, 2), versEntier(T.intermediaire, 2), versEntier(T.reduit, 2)].includes(tva.bp)) r.erreurs.push('Taux de TVA forcé inconnu');
    }
    if (total === 0 && q > 0) r.avertissements.push('Ligne à 0,00 € HT');

    return Object.assign(r, {
      ouvrage: ouv, lot: lot.code, sousLot: sl.code, metier: lot.metier, mode, unite, q_m: q, qf_m: qf,
      libelle: ouv.libelle, PAu: vu.PAu, PVu: vu.PVu, puMO, PU, t_mh,
      fournituresDetail: vu.detail, facteurs: f, docs, details, total_c: total,
      fournPA_c: fournPA, fournPV_c: fournPV, mo_c: total - fournPV, coutMO_c: coutMO,
      heuresBrutes_mh, heuresAj_mh, tva
    });
  }

  /* ---------- Calcul complet ---------- */

  function calculer(cat, devis) {
    const idx = indexer(cat);
    const P = cat.parametres;
    const region = infoRegion(P, devis);
    const dep = infoDeplacement(P, devis);
    const lignes = (devis.lignes || []).map((l, i) => calculerLigne(idx, devis, l, i, region, dep));
    const valides = lignes.filter(l => !l.invalide);

    // Structure Lot > Sous-lot > Lignes, dans l'ordre du catalogue.
    const structure = [];
    for (const lot of cat.lots) {
      const lignesLot = valides.filter(l => l.lot === lot.code);
      if (!lignesLot.length) continue;
      const bloc = { code: lot.code, libelle: lot.libelle, reference: lot.reference, metier: lot.metier, sousLots: [], total_c: 0 };
      for (const sl of lot.sousLots) {
        const ls = lignesLot.filter(l => l.sousLot === sl.code);
        if (!ls.length) continue;
        const t = ls.reduce((a, l) => a + l.total_c, 0);
        bloc.sousLots.push({ code: sl.code, libelle: sl.libelle, lignes: ls, total_c: t });
        bloc.total_c += t;
      }
      structure.push(bloc);
    }
    structure.forEach((lot, i) => {
      lot.numero = String(i + 1);
      lot.sousLots.forEach((sl, j) => {
        sl.numero = lot.numero + '.' + (j + 1);
        sl.lignes.forEach((l, k) => { l.numero = sl.numero + '.' + (k + 1); });
      });
    });
    const totalLignes = structure.reduce((a, l) => a + l.total_c, 0);

    // Durée de chantier et déplacements
    const pr = devis.parametres || {};
    const heuresAj = valides.reduce((a, l) => a + l.heuresAj_mh, 0);
    const hpj = versEntier(pr.heuresParJour || P.chantier.heuresParJour, 3) || 7000;
    const comp = Math.max(1, parseInt(pr.compagnons || P.chantier.compagnons, 10) || 1);
    const capaciteJour = big(hpj) * big(comp);
    const jours = heuresAj > 0 ? Number((big(heuresAj) + capaciteJour - 1n) / capaciteJour) : 0;
    const deplacement = {
      km: dep.km, zone: dep.zone, mode: dep.mode, majoration_bp: dep.majoration_bp, jours,
      forfaitJour_c: dep.forfaitJour_c, total_c: 0, doc: null
    };
    if (dep.mode === 'forfait' && jours > 0 && dep.forfaitJour_c > 0) {
      deplacement.total_c = jours * dep.forfaitJour_c;
      deplacement.doc = docLigne('principal', null, 'j', jours * 1000, dep.forfaitJour_c);
      deplacement.designation = 'Frais de déplacement — ' + dep.zone.libelle + ' (' + dep.km + ' km du dépôt), ' +
        jours + ' jour' + (jours > 1 ? 's' : '') + ' de chantier estimé' + (jours > 1 ? 's' : '');
    }

    const totalHT = totalLignes + deplacement.total_c;

    // Ventilation de la TVA (les frais de déplacement suivent le prorata des travaux)
    const autoliquidation = !!(devis.chantier || {}).sousTraitance;
    const bases = new Map();
    for (const l of valides) bases.set(l.tva.bp, (bases.get(l.tva.bp) || 0) + l.total_c);
    deplacement.ventilation = [];
    if (deplacement.total_c > 0) {
      const taux = Array.from(bases.keys());
      if (taux.length === 0) taux.push(autoliquidation ? 0 : versEntier(P.tva.normal, 2));
      const parts = repartir(deplacement.total_c, taux.map(t => bases.get(t) || 0));
      taux.forEach((t, i) => {
        bases.set(t, (bases.get(t) || 0) + parts[i]);
        deplacement.ventilation.push({ bp: t, base_c: parts[i] });
      });
    }
    const tva = Array.from(bases.entries())
      .map(([bp, base]) => ({ bp, base_c: base, montant_c: mulDiv([base, bp], [ECH]) }))
      .sort((a, b) => b.bp - a.bp);
    const totalTVA = tva.reduce((a, t) => a + t.montant_c, 0);
    const totalTTC = totalHT + totalTVA;

    // Échéancier
    const ech = calculerEcheancier(P, devis, totalTTC);

    const res = {
      idx, region, lignes, valides, structure, deplacement, tva, autoliquidation,
      totalLignes_c: totalLignes, totalHT_c: totalHT, totalTVA_c: totalTVA, totalTTC_c: totalTTC,
      netAPayer_c: totalTTC, heuresAj_mh: heuresAj, heuresParJour_mh: hpj, compagnons: comp, jours,
      echeancier: ech.etapes, retenue: ech.retenue, erreursEcheancier: ech.erreurs,
      tauxReduit: tva.some(t => t.bp > 0 && t.bp < versEntier(P.tva.normal, 2))
    };
    res.interne = recapInterne(cat, res);
    res.conformite = verifierConformite(cat, devis, res);
    return res;
  }

  function calculerEcheancier(P, devis, ttc) {
    const pr = devis.parametres || {};
    const src = (pr.echeancier && pr.echeancier.length) ? pr.echeancier : P.echeancier;
    const erreurs = [];
    const etapes = [];
    let prec = 0, cumul = 0;
    src.forEach((e, i) => {
      const c = versEntier(e.cumul, 2);
      if (!Number.isInteger(c)) { erreurs.push('Échéance ' + (i + 1) + ' : pourcentage cumulé invalide'); return; }
      if (c <= prec) erreurs.push('Échéance ' + (i + 1) + ' : le cumul doit être strictement croissant');
      const part = c - prec;
      const dernier = i === src.length - 1;
      const montant = dernier ? ttc - cumul : mulDiv([ttc, part], [ECH]);
      cumul += montant;
      etapes.push({ libelle: e.libelle, cumul_bp: c, part_bp: part, montant_c: montant, payable_c: montant });
      prec = c;
    });
    if (etapes.length === 0) erreurs.push('Échéancier vide');
    else if (etapes[etapes.length - 1].cumul_bp !== ECH) erreurs.push('Le cumul de la dernière échéance doit être de 100 %');

    const ch = devis.chantier || {};
    const particulier = (devis.client || {}).type !== 'professionnel';
    if (etapes.length && ch.horsEtablissement && particulier && etapes[0].montant_c > 0) {
      etapes[0].mention = 'Exigible au plus tôt 7 jours après la conclusion du contrat (art. L221-10 du Code de la consommation)';
    }
    const retenue = { active: !!pr.retenueGarantie, taux_bp: versEntier(P.retenueGarantie.taux, 2), montant_c: 0 };
    if (retenue.active && etapes.length) {
      retenue.montant_c = mulDiv([ttc, retenue.taux_bp], [ECH]);
      const der = etapes[etapes.length - 1];
      der.retenue_c = retenue.montant_c;
      der.payable_c = der.montant_c - retenue.montant_c;
      if (der.payable_c < 0) erreurs.push('La retenue de garantie dépasse le montant du solde : augmentez la dernière échéance');
    }
    return { etapes, retenue, erreurs };
  }

  /* ---------- Récapitulatif interne (jamais imprimé sur le devis client) ---------- */

  function ratio(n, d) { return d ? n / d : null; } // ratio d'affichage, non monétaire

  function recapInterne(cat, res) {
    const lots = res.structure.map(lot => {
      const ls = lot.sousLots.flatMap(s => s.lignes);
      const s = k => ls.reduce((a, l) => a + l[k], 0);
      const o = {
        code: lot.code, libelle: lot.libelle,
        fournPA_c: s('fournPA_c'), fournPV_c: s('fournPV_c'), mo_c: s('mo_c'), coutMO_c: s('coutMO_c'),
        heuresBrutes_mh: s('heuresBrutes_mh'), heuresAj_mh: s('heuresAj_mh'), total_c: lot.total_c,
        facteurs: ls[0].facteurs
      };
      o.margeFourn_c = o.fournPV_c - o.fournPA_c;
      o.margeMO_c = o.mo_c - o.coutMO_c;
      o.margeBrute_c = o.margeFourn_c + o.margeMO_c;
      return o;
    });
    const tot = {};
    ['fournPA_c', 'fournPV_c', 'mo_c', 'coutMO_c', 'heuresBrutes_mh', 'heuresAj_mh', 'total_c', 'margeFourn_c', 'margeMO_c', 'margeBrute_c']
      .forEach(k => { tot[k] = lots.reduce((a, l) => a + l[k], 0); });
    tot.deplacement_c = res.deplacement.total_c;
    tot.margeBruteAvecDeplacement_c = tot.margeBrute_c + tot.deplacement_c;
    const m = cat.parametres.marge;
    const modeCoef = m.mode === 'coefficient';
    const k = versEntier(m.coefficient, 4), t = versEntier(m.tauxMarque, 2);
    return {
      lots, total: tot,
      marge: {
        mode: modeCoef ? 'coefficient' : 'taux_marque',
        coefficientParam: k, tauxMarqueParam: t,
        // Indicateurs théoriques de la règle globale, dans les deux conventions :
        tauxMarqueEquivalentCoef: k ? ratio(k - ECH, k) : null,        // (k − 1) / k
        coefficientEquivalentTaux: t < ECH ? ratio(ECH, ECH - t) : null, // 1 / (1 − t)
        // Indicateurs réels du devis (après arrondis et surcharges) :
        tauxMarqueReel: ratio(tot.margeFourn_c, tot.fournPV_c),
        coefficientReel: ratio(tot.fournPV_c, tot.fournPA_c),
        tauxMargeSurAchatReel: ratio(tot.margeFourn_c, tot.fournPA_c),
        tauxMargeBrute: ratio(tot.margeBruteAvecDeplacement_c, res.totalHT_c)
      }
    };
  }

  /* ---------- Conformité ---------- */

  function verifierConformite(cat, devis, res) {
    const B = [], A = [];
    const bloq = (onglet, message) => B.push({ onglet, message });
    const avert = (onglet, message) => A.push({ onglet, message });
    const E = cat.entreprise || {};
    const c = devis.client || {};
    const ch = devis.chantier || {};
    const pr = devis.parametres || {};
    const particulier = c.type !== 'professionnel';

    // Entreprise
    [['raisonSociale', 'raison sociale'], ['formeJuridique', 'forme juridique'], ['adresse', 'adresse de l\'entreprise'],
      ['cp', 'code postal de l\'entreprise'], ['ville', 'ville de l\'entreprise'], ['siret', 'SIRET'],
      ['rcsRm', 'immatriculation RCS ou RM / RNE'], ['tvaIntra', 'n° de TVA intracommunautaire']]
      .forEach(([k, l]) => { if (vide(E[k])) bloq('entreprise', 'Entreprise : ' + l + ' manquant(e)'); });
    const siret = chiffresSeuls(E.siret);
    if (!vide(E.siret) && siret.length !== 14) bloq('entreprise', 'SIRET de l\'entreprise : 14 chiffres attendus');
    else if (siret.length === 14 && !luhn(siret) && !E.demo) avert('entreprise', 'SIRET de l\'entreprise : la clé de contrôle (Luhn) ne correspond pas, à vérifier');
    const tvaI = String(E.tvaIntra || '').replace(/\s/g, '').toUpperCase();
    if (!vide(E.tvaIntra)) {
      if (!/^FR[0-9A-Z]{2}\d{9}$/.test(tvaI)) bloq('entreprise', 'N° de TVA intracommunautaire : format FR + 2 caractères + SIREN (9 chiffres) attendu');
      else if (siret.length === 14 && tvaI.slice(4) !== siret.slice(0, 9)) avert('entreprise', 'Le SIREN du n° de TVA ne correspond pas au SIRET');
      else if (/^\d{2}$/.test(tvaI.slice(2, 4)) && tvaI.slice(2, 4) !== cleTvaFr(tvaI.slice(4))) avert('entreprise', 'Clé du n° de TVA intracommunautaire incohérente, à vérifier');
    }
    const D = E.assuranceDecennale || {};
    if (vide(D.assureur)) bloq('entreprise', 'Assurance décennale : nom de l\'assureur manquant');
    if (vide(D.contrat)) bloq('entreprise', 'Assurance décennale : n° de contrat manquant');
    if (vide(D.couverture)) bloq('entreprise', 'Assurance décennale : couverture géographique manquante');
    if (particulier && (vide((E.mediateur || {}).nom) || vide((E.mediateur || {}).site))) bloq('entreprise', 'Client particulier : coordonnées du médiateur de la consommation manquantes (art. L616-1 C. consom.)');
    if (E.demo) avert('entreprise', 'Données d\'entreprise FICTIVES de démonstration : le devis porte la mention SPÉCIMEN');

    // Client et chantier
    if (particulier) { if (vide(c.nom)) bloq('client', 'Client : nom manquant'); }
    else {
      if (vide(c.raisonSociale)) bloq('client', 'Client professionnel : raison sociale manquante');
      if (vide(c.siret)) avert('client', 'Client professionnel : SIRET non renseigné (recommandé, et obligatoire sur les factures électroniques)');
    }
    if (vide(c.adresse) || vide(c.cp) || vide(c.ville)) bloq('client', 'Client : adresse complète manquante');
    const adr = adresseChantier(devis);
    if (vide(adr.adresse) || vide(adr.cp) || vide(adr.ville)) bloq('client', 'Adresse du chantier incomplète');
    if (res && !res.region.determine) avert('client', 'Département du chantier non reconnu : coefficient régional neutre (1,00) appliqué');

    // Devis
    if (vide(devis.numero)) bloq('devis', 'Numéro de devis non attribué');
    if (!dateValide(devis.date)) bloq('devis', 'Date du devis manquante ou invalide');
    if (!(parseInt(devis.validiteJours, 10) > 0)) bloq('devis', 'Durée de validité du devis manquante');
    if (vide(pr.delaiExecution)) bloq('devis', 'Délai d\'exécution des travaux manquant');
    if (!dateValide(pr.dateDemarrage)) bloq('devis', 'Date prévisionnelle de démarrage manquante');
    else if (dateValide(devis.date) && pr.dateDemarrage < devis.date) avert('devis', 'La date de démarrage est antérieure à la date du devis');
    const reg = (cat.parametres.devis.registre || []).filter(r => r.numero === devis.numero);
    if (!vide(devis.numero) && reg.length > 1) bloq('devis', 'Numéro de devis présent plusieurs fois dans le registre : la numérotation doit être unique et continue');

    // Lignes
    if (!devis.lignes || devis.lignes.length === 0) bloq('lignes', 'Le devis ne contient aucune ligne');
    if (res) {
      res.lignes.forEach((l, i) => {
        const nom = 'Ligne ' + (i + 1) + (l.libelle ? ' (' + String(l.libelle).slice(0, 40) + ')' : '');
        l.erreurs.forEach(e => bloq('lignes', nom + ' : ' + e));
        (l.avertissements || []).forEach(e => avert('lignes', nom + ' : ' + e));
      });
      res.erreursEcheancier.forEach(e => bloq('devis', 'Échéancier : ' + e));
    }

    // TVA et cadre juridique
    if (ch.sousTraitance) {
      if (particulier) bloq('client', 'Sous-traitance : le client (donneur d\'ordre) doit être une entreprise assujettie, pas un particulier');
      if (!ch.agrementMaitreOuvrage) avert('client', 'Sous-traitance : acceptation du sous-traitant et agrément des conditions de paiement par le maître d\'ouvrage non confirmés (loi n° 75-1334 du 31/12/1975)');
      if (vide(c.tvaIntra)) avert('client', 'Autoliquidation : n° de TVA du donneur d\'ordre non renseigné');
    }
    if (ch.horsEtablissement && particulier) {
      avert('devis', 'Contrat hors établissement : formulaire de rétractation joint ; aucun paiement ne peut être exigé avant 7 jours (art. L221-10 C. consom.)');
      if (pr.retenueGarantie) avert('devis', 'Retenue de garantie appliquée à un particulier : usage rare, à valider');
    }
    if (res && res.tauxReduit) avert('devis', 'Taux réduit appliqué : la mention de certification du client est imprimée sur le devis (règles à vérifier à la date d\'émission)');
    if (ch.renovationEnergetique && res && !res.valides.some(l => l.tva.bp === versEntier(cat.parametres.tva.reduit, 2)) && !ch.sousTraitance)
      avert('lignes', 'Rénovation énergétique cochée mais aucune ligne éligible au taux de 5,5 %');

    // Marge
    const m = cat.parametres.marge;
    if (m.mode === 'coefficient') { const k = versEntier(m.coefficient, 4); if (!(k >= ECH)) avert('catalogue', 'Coefficient de vente inférieur à 1 : vente à perte'); }
    else { const t = versEntier(m.tauxMarque, 2); if (!(t >= 0 && t < 9500)) bloq('catalogue', 'Taux de marque invalide (attendu entre 0 et 95 %)'); }

    return { bloquants: B, avertissements: A, conforme: B.length === 0 };
  }

  /* ---------- Vérifications de calcul (jeux de test) ---------- */

  function verifierCalculs(cat, devis, res) {
    const out = [];
    const ok = (nom, cond, detail) => out.push({ nom, ok: !!cond, detail: detail || '' });
    // 1. Chaque ligne affichée : Qté × PU = Total (arrondi)
    let lignesOk = true, nbDocs = 0;
    res.valides.forEach(l => l.docs.forEach(d => { nbDocs++; if (d.total_c !== mulDiv([d.q_m, d.pu_c], [1000])) lignesOk = false; }));
    if (res.deplacement.doc) { nbDocs++; if (res.deplacement.doc.total_c !== mulDiv([res.deplacement.doc.q_m, res.deplacement.doc.pu_c], [1000])) lignesOk = false; }
    ok('Chaque ligne : Qté × PU HT = Total HT au centime', lignesOk, nbDocs + ' ligne(s) imprimée(s)');
    // 2. Bouclage des totaux
    let sl = true, lt = true;
    res.structure.forEach(lot => {
      lot.sousLots.forEach(s => { if (s.total_c !== s.lignes.reduce((a, l) => a + l.docs.reduce((b, d) => b + d.total_c, 0), 0)) sl = false; });
      if (lot.total_c !== lot.sousLots.reduce((a, s) => a + s.total_c, 0)) lt = false;
    });
    ok('Sous-lots = somme des lignes', sl);
    ok('Lots = somme des sous-lots', lt);
    const ht = res.structure.reduce((a, l) => a + l.total_c, 0) + res.deplacement.total_c;
    ok('Total HT = somme des lots + déplacements', ht === res.totalHT_c, euros(res.totalHT_c));
    // 3. TVA
    const sb = res.tva.reduce((a, t) => a + t.base_c, 0);
    ok('Somme des bases de TVA = total HT', sb === res.totalHT_c, euros(sb));
    ok('TVA de chaque taux = arrondi(base × taux)', res.tva.every(t => t.montant_c === mulDiv([t.base_c, t.bp], [ECH])), res.tva.map(t => pourcent(t.bp) + ' : ' + euros(t.montant_c)).join(' · '));
    ok('Total TVA = somme des TVA par taux', res.totalTVA_c === res.tva.reduce((a, t) => a + t.montant_c, 0));
    ok('TTC = HT + TVA', res.totalTTC_c === res.totalHT_c + res.totalTVA_c, euros(res.totalTTC_c));
    const basesCalc = new Map();
    res.valides.forEach(l => basesCalc.set(l.tva.bp, (basesCalc.get(l.tva.bp) || 0) + l.total_c));
    ok('Ventilation : chaque ligne comptée à son taux', res.tva.every(t => t.base_c - (basesCalc.get(t.bp) || 0) === (res.deplacement.ventilation.find(v => v.bp === t.bp) || { base_c: 0 }).base_c));
    if (res.autoliquidation) ok('Autoliquidation : aucune TVA facturée', res.totalTVA_c === 0 && res.tva.every(t => t.bp === 0));
    // 4. Échéancier
    const se = res.echeancier.reduce((a, e) => a + e.montant_c, 0);
    ok('Somme de l\'échéancier = TTC', se === res.totalTTC_c, euros(se));
    if (res.retenue.active) {
      const sp = res.echeancier.reduce((a, e) => a + e.payable_c, 0);
      ok('Échéances payables + retenue de garantie = TTC', sp + res.retenue.montant_c === res.totalTTC_c, euros(sp) + ' + ' + euros(res.retenue.montant_c));
    }
    // 5. Marge conforme au mode choisi (PV de chaque fourniture utilisée)
    let margeOk = true, nbF = 0;
    const vus = new Set();
    res.valides.forEach(l => l.fournituresDetail.forEach(d => {
      if (vus.has(d.code)) return; vus.add(d.code); nbF++;
      const R = d.regle;
      if (R.mode === 'coefficient') { if (Math.abs(d.pa_c * R.entier - d.pv_c * ECH) * 2 > ECH) margeOk = false; }
      else { if (Math.abs(d.pv_c * (ECH - R.entier) - d.pa_c * ECH) * 2 > (ECH - R.entier)) margeOk = false; }
    }));
    const mi = res.interne.marge;
    ok('Prix de vente des fournitures conformes au mode « ' + (mi.mode === 'coefficient' ? 'coefficient' : 'taux de marque') + ' »', margeOk,
      nbF + ' fourniture(s) ; taux de marque réel ' + (mi.tauxMarqueReel == null ? '—' : (mi.tauxMarqueReel * 100).toFixed(2) + ' %') +
      ' ; coefficient réel ' + (mi.coefficientReel == null ? '—' : mi.coefficientReel.toFixed(4)));
    // 6. Récapitulatif interne cohérent avec le devis client
    ok('Récapitulatif interne : fournitures + main-d\'œuvre = total des lots', res.interne.total.fournPV_c + res.interne.total.mo_c === res.totalLignes_c);
    return out;
  }

  /* ---------- Validation structurelle du catalogue ---------- */

  function validerCatalogue(cat) {
    const err = [];
    if (!cat || typeof cat !== 'object') return ['Le fichier ne contient pas un objet JSON'];
    ['entreprise', 'parametres'].forEach(k => { if (!cat[k] || typeof cat[k] !== 'object') err.push('Clé « ' + k + ' » absente'); });
    ['familles', 'fournitures', 'lots', 'ouvrages'].forEach(k => { if (!Array.isArray(cat[k])) err.push('Tableau « ' + k + ' » absent'); });
    if (err.length) return err;
    const P = cat.parametres;
    ['marge', 'metiers', 'tva', 'regions', 'penibilite', 'accessibilite', 'deplacement', 'chantier', 'echeancier', 'retenueGarantie', 'devis']
      .forEach(k => { if (P[k] === undefined) err.push('Paramètre « ' + k + ' » absent'); });
    if (err.length) return err;
    const doublons = (liste, nom) => {
      const vu = new Set();
      liste.forEach(x => { if (vu.has(x.code)) err.push(nom + ' en double : ' + x.code); vu.add(x.code); });
      return vu;
    };
    const fams = doublons(cat.familles, 'Famille');
    const fourns = doublons(cat.fournitures, 'Fourniture');
    const sls = new Set();
    doublons(cat.lots, 'Lot');
    cat.lots.forEach(l => {
      if (!P.metiers[l.metier]) err.push('Lot ' + l.code + ' : métier « ' + l.metier + ' » sans taux horaire');
      (l.sousLots || []).forEach(s => { if (sls.has(s.code)) err.push('Sous-lot en double : ' + s.code); sls.add(s.code); });
    });
    Object.entries(P.metiers).forEach(([k, m]) => {
      if (!Number.isInteger(m.tauxHoraire_c) || m.tauxHoraire_c <= 0) err.push('Métier ' + k + ' : taux horaire (centimes entiers) invalide');
      if (!Number.isInteger(m.coutHoraireCharge_c) || m.coutHoraireCharge_c < 0) err.push('Métier ' + k + ' : coût horaire chargé (centimes entiers) invalide');
    });
    cat.fournitures.forEach(f => {
      if (!fams.has(f.famille)) err.push('Fourniture ' + f.code + ' : famille inconnue « ' + f.famille + ' »');
      if (!Number.isInteger(f.pa_c) || f.pa_c < 0) err.push('Fourniture ' + f.code + ' : prix d\'achat (centimes entiers) invalide');
    });
    doublons(cat.ouvrages, 'Ouvrage');
    cat.ouvrages.forEach(o => {
      if (!sls.has(o.sousLot)) err.push('Ouvrage ' + o.code + ' : sous-lot inconnu « ' + o.sousLot + ' »');
      if (!UNITES.includes(o.unite)) err.push('Ouvrage ' + o.code + ' : unité « ' + o.unite + ' » non reconnue');
      if (!MODES.includes(o.mode)) err.push('Ouvrage ' + o.code + ' : mode de chiffrage « ' + o.mode + ' » non reconnu');
      if (vide(o.tempsUnitaire_h) && !Number.isInteger(o.prixMOBase_c)) err.push('Ouvrage ' + o.code + ' : ni temps unitaire ni prix de main-d\'œuvre de base');
      if (!vide(o.tempsUnitaire_h) && !(versEntier(o.tempsUnitaire_h, 3) >= 0)) err.push('Ouvrage ' + o.code + ' : temps unitaire invalide');
      (o.fournitures || []).forEach(c => {
        if (!fourns.has(c.code)) err.push('Ouvrage ' + o.code + ' : fourniture inconnue « ' + c.code + ' »');
        if (!(versEntier(c.ratio, 3) > 0)) err.push('Ouvrage ' + o.code + ' : ratio invalide pour ' + c.code);
      });
    });
    const t = versEntier(P.marge.tauxMarque, 2), k = versEntier(P.marge.coefficient, 4);
    if (!(t >= 0 && t < 9500)) err.push('Taux de marque global invalide (0 à 95 %)');
    if (!(k > 0)) err.push('Coefficient global invalide');
    if (!P.penibilite.length) err.push('Table de pénibilité vide');
    if (!P.deplacement.zones || !P.deplacement.zones.length) err.push('Zones de déplacement absentes');
    return err;
  }

  /* ---------- Nouveau devis ---------- */

  function nouveauDevis(cat) {
    const P = cat.parametres;
    return {
      version: 1,
      numero: '',
      date: aujourdhui(),
      validiteJours: P.devis.validiteJours,
      objet: '',
      client: { type: 'particulier', civilite: '', nom: '', raisonSociale: '', siret: '', tvaIntra: '', adresse: '', cp: '', ville: '', email: '', telephone: '' },
      chantier: {
        identiqueClient: false, adresse: '', cp: '', ville: '', departement: '', zoneRurale: false,
        etage: 0, ascenseur: true, stationnementDifficile: false, accesPietonLong: false, centreHistorique: false, monteCharge: false,
        distanceKm: 0, typeLocal: 'logement', logementPlusDe2Ans: true, renovationEnergetique: false,
        horsEtablissement: false, demandeExecutionAnticipee: false,
        sousTraitance: false, agrementMaitreOuvrage: false, maitreOuvrage: ''
      },
      parametres: {
        penibilite: 1, compagnons: P.chantier.compagnons, heuresParJour: P.chantier.heuresParJour,
        modeDeplacement: 'forfait', affichageFournitures: 'integre', retenueGarantie: false, cautionBancaire: false,
        delaiExecution: '', dateDemarrage: '', conditionsParticulieres: '',
        echeancier: P.echeancier.map(e => ({ libelle: e.libelle, cumul: e.cumul }))
      },
      surchargesLots: {},
      lignes: [],
      facturation: null,
      factures: []
    };
  }

  const Moteur = {
    ECH, UNITES, MODES,
    mulDiv, arrondiDiv, versEntier, repartir,
    euros, quantite, pourcent, coef, dateFr, dateValide, ajouterJours, aujourdhui, vide,
    luhn, cleTvaFr, departementDepuisCP, numeroDevis, adresseChantier,
    indexer, regleMarge, prixVente, valeursFournitures, resoudreOuvrage, infoRegion, infoDeplacement, facteursLot,
    calculer, calculerEcheancier, verifierConformite, verifierCalculs, validerCatalogue, nouveauDevis
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = Moteur;
  else racine.Moteur = Moteur;
})(typeof globalThis !== 'undefined' ? globalThis : this);
